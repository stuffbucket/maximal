<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maximal — Dashboard</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c8334a'/%3E%3Ctext x='50%25' y='54%25' dy='.35em' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='42' font-weight='700' fill='%23fafafa'%3Em%3C/text%3E%3C/svg%3E"
    />

    <!-- Commissioner is the body face, matching the Settings window.
         The Dashboard has no display heading (the native titlebar
         carries the page name), so Fraunces is intentionally absent —
         "Fraunces rationed" per .design-context.md. The @font-face rules
         in style.css self-host it from ./vendor/fonts/ — no CDN request,
         works offline / under a strict CSP. -->

    <!-- Tailwind + Lucide are CLASSIC global <script>s, not module imports —
         the bundled entry references window.lucide / window.tailwind as
         ambient globals. build-ui.ts copies this HTML + vendor/ verbatim (it
         bundles only the module entry), so these stay untouched classic tags
         and the ./vendor/ paths resolve next to the served HTML. -->
    <script src="./vendor/tailwind.min.js"></script>
    <script src="./vendor/lucide.min.js"></script>

    <link rel="stylesheet" href="./style.css" />
    <!-- The dashboard app: bundled by build-ui.ts from
         shell/src/dashboard/main.ts (which imports the shared i18n runtime +
         DOM binder) into ./main.js, next to this copied-verbatim HTML. -->
    <script type="module" src="./main.js"></script>
  </head>
  <body class="antialiased">
    <div id="app" class="dashboard-pane">
      <div class="dashboard-container">
        <!-- Period selector. Data refreshes automatically — Tauri
             webviews subscribe to a Channel<TokenUsageEvent> driven by
             the shell; plain-browser viewers poll on a timer. No
             Fetch button. The language picker is a global, section-
             agnostic control (same maximal.locale override as Settings,
             shared :4141 origin); options + selection are wired in
             main.ts (wireLocalePicker), which re-runs applyI18n live. -->
        <!-- It wraps rather than overflow a phone-width window: the range
             label's length depends on the time of day and the language. -->
        <div class="dashboard-toolbar mb-6 flex flex-wrap items-center gap-3">
          <!-- "Period" is the control's hover text (native title, browser
               timing) and accessible name, not a visible label. -->
          <div
            id="token-usage-period"
            class="segmented"
            role="group"
            data-i18n-aria-label="dashboard-period-label"
            data-i18n-title="dashboard-period-label"
          >
            <button
              type="button"
              class="segmented-option"
              data-period="day"
              aria-pressed="true"
              data-i18n="dashboard-period-days"
              data-i18n-count="1"
            >1 day</button>
            <button
              type="button"
              class="segmented-option"
              data-period="week"
              aria-pressed="false"
              data-i18n="dashboard-period-days"
              data-i18n-count="7"
            >7 days</button>
            <button
              type="button"
              class="segmented-option"
              data-period="month"
              aria-pressed="false"
              data-i18n="dashboard-period-days"
              data-i18n-count="30"
            >30 days</button>
          </div>
          <!-- The window those numbers cover, compact ("Jun 8 – 15"); the
               exact timestamps are its hover text. Filled by main.ts. -->
          <span id="token-usage-range" class="range-label"></span>
          <!-- Language: a globe with the native <select> laid invisibly over
               it, so clicking opens the real menu; the current language is
               the select's hover text (set in main.ts). -->
          <div class="lang-picker ml-auto">
            <i data-lucide="globe" aria-hidden="true"></i>
            <select
              id="locale-select"
              data-locale-select
              data-i18n-aria-label="common-language-label"
            ></select>
          </div>
        </div>
        <!-- Dashboard and Sessions are two views over one persistent bundle.
             main.ts rebuilds only quota/token strings; live/controller.ts builds
             the graph and session table once, then feeds both from one poll so
             selection, animation, hover and focus survive view switches. -->
        <main id="content-area">
          <div data-observability-view="dashboard">
            <div id="dashboard-bento" class="dashboard-bento" hidden>
              <section id="usage-column" class="dashboard-bento__col dashboard-bento__quota" aria-labelledby="usage-quotas-title">
                <h2 id="usage-quotas-title" class="section__title">
                  <i data-lucide="bar-chart-big" aria-hidden="true"></i>
                  <span data-i18n="dashboard-quotas-title">Usage Quotas</span>
                </h2>
                <div class="usage-overview">
                  <div id="usage-prerequisite" class="usage-prerequisite" hidden></div>
                  <section id="live-metrics" class="usage-panel usage-panel--tokens" aria-label="Token use" data-i18n-aria-label="dashboard-flow-token-use"></section>
                  <section id="quota-metrics" class="usage-panel usage-panel--quota" aria-label="Usage quotas" data-i18n-aria-label="dashboard-quotas-title">
                    <div id="usage-quotas"></div>
                    <div id="cache-hit"></div>
                  </section>
                </div>
              </section>
              <section class="dashboard-bento__col dashboard-bento__live" aria-labelledby="live-sessions-title">
                <h2 id="live-sessions-title" class="section__title">
                  <i data-lucide="activity" aria-hidden="true"></i>
                  <span data-i18n="dashboard-live-title">Live sessions</span>
                </h2>
                <div id="live-sessions"></div>
              </section>
            </div>
            <div id="dashboard-rest"></div>
          </div>
          <div data-observability-view="sessions" hidden>
            <section id="sessions" class="sessions" aria-labelledby="sessions-title">
              <h2 id="sessions-title" class="section__title">
                <i data-lucide="list" aria-hidden="true"></i>
                <span data-i18n="dashboard-sessions-title">Sessions</span>
              </h2>
              <p id="sessions-error" class="live__error" role="alert" hidden>
                <span class="live__error-title" data-i18n="dashboard-error-generic"></span>
                <span class="live__error-message"></span>
              </p>
              <div id="sessions-empty" class="observability-empty">
                <h3 class="observability-empty__title" data-i18n="sessions-empty-title">No sessions yet</h3>
                <p data-i18n="sessions-empty-detail">Sessions will appear here after apps send requests through Maximal.</p>
              </div>
              <div id="sessions-table" hidden></div>
            </section>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
