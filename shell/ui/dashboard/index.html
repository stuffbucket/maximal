<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maximal — Dashboard</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c8334a'/%3E%3Ctext x='50%25' y='54%25' dy='.35em' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='42' font-weight='700' fill='%23fafafa'%3Em%3C/text%3E%3C/svg%3E"
    />

    <!-- Commissioner is the body face, matching the Settings window.
         The Dashboard has no display heading (the native titlebar
         carries the page name), so Fraunces is intentionally absent —
         "Fraunces rationed" per .design-context.md. The @font-face rules
         in style.css self-host it from ./vendor/fonts/ — no CDN request,
         works offline / under a strict CSP. -->

    <!-- Tailwind + Lucide are CLASSIC global <script>s, not module imports —
         the bundled entry references window.lucide / window.tailwind as
         ambient globals. build-ui.ts copies this HTML + vendor/ verbatim (it
         bundles only the module entry), so these stay untouched classic tags
         and the ./vendor/ paths resolve next to the served HTML. -->
    <script src="./vendor/tailwind.min.js"></script>
    <script src="./vendor/lucide.min.js"></script>

    <link rel="stylesheet" href="./style.css" />
    <!-- The dashboard app: bundled by build-ui.ts from
         shell/src/dashboard/main.ts (which imports the shared i18n runtime +
         DOM binder) into ./main.js, next to this copied-verbatim HTML. -->
    <script type="module" src="./main.js"></script>
  </head>
  <body class="antialiased">
    <div id="app" class="min-h-screen p-4 sm:p-6">
      <div class="max-w-7xl mx-auto">
        <!-- Native macOS titlebar already reads "Maximal — Dashboard";
             no in-window duplicate. Content starts at the control row. -->

        <!-- Period selector. Data refreshes automatically — Tauri
             webviews subscribe to a Channel<TokenUsageEvent> driven by
             the shell; plain-browser viewers poll on a timer. No
             Fetch button. The language picker is a global, section-
             agnostic control (same maximal.locale override as Settings,
             shared :4141 origin); options + selection are wired in
             main.ts (wireLocalePicker), which re-runs applyI18n live. -->
        <div class="mb-6 flex items-center gap-3">
          <!-- "Period" is the control's hover text (native title, browser
               timing) and accessible name, not a visible label. -->
          <div
            id="token-usage-period"
            class="segmented"
            role="group"
            data-i18n-aria-label="dashboard-period-label"
            data-i18n-title="dashboard-period-label"
          >
            <button
              type="button"
              class="segmented-option"
              data-period="day"
              aria-pressed="true"
              data-i18n="dashboard-period-days"
              data-i18n-count="1"
            >1 day</button>
            <button
              type="button"
              class="segmented-option"
              data-period="week"
              aria-pressed="false"
              data-i18n="dashboard-period-days"
              data-i18n-count="7"
            >7 days</button>
            <button
              type="button"
              class="segmented-option"
              data-period="month"
              aria-pressed="false"
              data-i18n="dashboard-period-days"
              data-i18n-count="30"
            >30 days</button>
          </div>
          <!-- The window those numbers cover, compact ("Jun 8 – 15"); the
               exact timestamps are its hover text. Filled by main.ts. -->
          <span id="token-usage-range" class="range-label"></span>
          <!-- Language: a globe with the native <select> laid invisibly over
               it, so clicking opens the real menu; the current language is
               the select's hover text (set in main.ts). -->
          <div class="lang-picker ml-auto">
            <i data-lucide="globe" aria-hidden="true"></i>
            <select
              id="locale-select"
              data-locale-select
              data-i18n-aria-label="common-language-label"
            ></select>
          </div>
        </div>
        <!-- Content area for dynamically rendered data. -->
        <main id="content-area"></main>
      </div>
    </div>
  </body>
</html>
