<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22">
  <!-- AppKit template image: the detached dot changes silhouette without fixed color. -->
  <defs>
    <mask id="attention-cutout">
      <rect x="1" y="1" width="20" height="20" rx="5" fill="white"/>
      <text x="11" y="16.5" font-family="-apple-system, Helvetica, sans-serif"
            font-weight="900" font-size="16" text-anchor="middle" fill="black">m</text>
      <circle cx="18" cy="4" r="4" fill="black"/>
    </mask>
  </defs>
  <rect x="1" y="1" width="20" height="20" rx="5" fill="black"
        mask="url(#attention-cutout)"/>
  <circle cx="18" cy="4" r="2.5" fill="black"/>
</svg>
