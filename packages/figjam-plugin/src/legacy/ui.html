  for (const el of [b, text, glyph]) for (const a of el.getAnimations()) a.cancel();
  b.classList.toggle("iconic", icon);
  if (!animate || reduceMotion.matches || !b.offsetParent) return;
  const to = b.getBoundingClientRect().width;
  const opts = { duration: 220, easing: "cubic-bezier(0.22, 0.61, 0.36, 1)" };
  b.animate([{ width: `${from}px` }, { width: `${to}px` }], opts);
  // Cross-fade over the same span: never both solid, never both gone.
  text.animate([{ opacity: icon ? 1 : 0 }, { opacity: icon ? 0 : 1 }], opts);
  glyph.animate([{ opacity: icon ? 0 : 1 }, { opacity: icon ? 1 : 0 }], opts);
}

function chipEngaged() {
  return !els.modelMenu.hidden || els.modelBtn.matches(":hover") || els.modelMenu.matches(":hover")
    || els.modelBtn.matches(":focus-visible") || els.modelMenu.contains(document.activeElement);
}

function chipPeek() {
  clearTimeout(chip.leaveTimer);
  clearTimeout(chip.enterTimer);
  paintChip(false);
}

// Collapse back to the icon (if idle) once nothing holds the chip open.
function chipRelease(delay = CHIP_LINGER_MS) {
  clearTimeout(chip.enterTimer);
  clearTimeout(chip.leaveTimer);
  chip.leaveTimer = setTimeout(() => { if (chip.idle && !chipEngaged()) paintChip(true); }, delay);
}

function chipSetIdle(idle) {
  clearTimeout(chip.idleTimer);
  chip.idle = idle;
  if (!idle) { clearTimeout(chip.leaveTimer); paintChip(false); }
  else if (!chipEngaged()) paintChip(true);
}

// Any model/effort interaction restarts the 15 s idle clock.
function chipTouch() {
  clearTimeout(chip.idleTimer);
  chip.idleTimer = setTimeout(() => { chip.idle = true; chipRelease(0); }, CHIP_IDLE_MS);
}

els.modelBtn.addEventListener("pointerenter", () => {
  clearTimeout(chip.leaveTimer);
  if (!els.modelBtn.classList.contains("iconic")) return;
  clearTimeout(chip.enterTimer);
  chip.enterTimer = setTimeout(chipPeek, CHIP_REST_MS);
});
els.modelBtn.addEventListener("pointerleave", () => chipRelease());
els.modelMenu.addEventListener("pointerenter", () => clearTimeout(chip.leaveTimer));
els.modelMenu.addEventListener("pointerleave", () => chipRelease());
els.modelMenu.addEventListener("pointerdown", chipTouch);
els.modelMenu.addEventListener("keydown", chipTouch);
els.modelBtn.addEventListener("focus", () => { if (els.modelBtn.matches(":focus-visible")) chipPeek(); });
els.modelBtn.addEventListener("blur", () => chipRelease());
// Escape with the menu closed: collapse after the same delay even though focus stays.
els.modelBtn.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || !els.modelMenu.hidden || !chip.idle) return;
  clearTimeout(chip.leaveTimer);
  chip.leaveTimer = setTimeout(() => { if (chip.idle && els.modelMenu.hidden) paintChip(true); }, CHIP_LINGER_MS);
});

let connectRetry = null;
let connectFails = 0;
let connectGen = 0;

async function connect() {
  clearTimeout(connectRetry);
  const gen = ++connectGen;
  // Retries keep the last error showing instead of flickering to "Connecting…".
  if (net.maximal.s === "down") setNet("maximal", "down", Object.assign({}, net.maximal, { nextAt: 0 }));
  else {
    setNet("maximal", "checking");
    setStatus("Connecting to Maximal…");
  }
  try {
    const res = await fetch(`${settings.baseUrl}/v1/models`, { headers: headers(), signal: AbortSignal.timeout(8000) });
    if (gen !== connectGen) return;
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const body = await res.json();
    if (gen !== connectGen) return;
    const list = (body.data || []).filter((m) => m && m.id && !/embedding/i.test(m.id));
    if (list.length === 0) throw new Error("no models");
    const rank = (id) => {
      const i = PREFERRED_MODELS.findIndex((p) => id.startsWith(p));
      return i < 0 ? PREFERRED_MODELS.length : i;
    };
    list.sort((a, b) => rank(a.id) - rank(b.id) || a.id.localeCompare(b.id));
    models = list.map((m) => ({ id: m.id, name: m.display_name || m.id }));
    if (!models.some((m) => m.id === modelId)) modelId = models.some((m) => m.id === settings.model) ? settings.model : models[0].id;
    showModel();
    connectFails = 0;
    setStatus(`Maximal · ${fileInfo.name || "this board"}`, "ok");
    setNet("maximal", "ok");
  } catch (error) {
    if (gen !== connectGen) return;
    models = [];
    modelId = "";
    showModel();
    const host = settings.baseUrl.replace(/^https?:\/\//, "");
    const why = error.name === "TimeoutError" ? "no answer in 8s" : error.message;
    const unreachable = error.name === "TimeoutError" || error instanceof TypeError;
    let short;
    if (unreachable) short = `Maximal isn't running on ${host} · retrying…`;
    else if (/^HTTP 40[13]/.test(error.message)) short = `Maximal refused the API key (${error.message}) — check Settings`;
    else if (error.message === "no models") short = `Maximal on ${host} has no models`;
    else short = `Maximal on ${host} answered ${error.message}`;
    // The hint line above the input says this (and counts down), so no log note.
    connectFails++;
    const delay = backoff(connectFails);
    setStatus(`Can't reach Maximal at ${settings.baseUrl} (${why}). Is it running?`, "bad", short);
    setNet("maximal", "down", { hint: unreachable ? "Can't reach Maximal" : /^HTTP 40[13]/.test(error.message) ? "Maximal refused the API key" : error.message === "no models" ? "Maximal has no models" : `Maximal answered ${error.message}`, attempt: connectFails, nextAt: Date.now() + delay });
    connectRetry = setTimeout(connect, delay);
  }
}

function renderModelMenu(showEffort) {
  const menu = els.modelMenu;
  menu.replaceChildren();
  // radio: true for model / effort choices; Back and Effort are plain items.
  const item = (label, checked, onclick, sub, radio = true) => {
    const b = document.createElement("button");
    b.className = "item";
    b.setAttribute("role", radio ? "menuitemradio" : "menuitem");
    if (radio) b.setAttribute("aria-checked", String(Boolean(checked)));
    b.innerHTML = `<span class="check" aria-hidden="true">${checked ? "✓" : ""}</span>`;
    const l = document.createElement("span");
    l.textContent = label;
    b.append(l);
    if (sub) {
      const s = document.createElement("span");
      s.className = "sub";
      s.textContent = sub;
      b.append(s);
    }
    b.onclick = onclick;
    menu.append(b);
    return b;
  };
  const sep = () => { const d = document.createElement("div"); d.className = "sep"; d.setAttribute("role", "separator"); menu.append(d); };
  if (showEffort) {
    item("Back", false, (e) => { e.stopPropagation(); renderModelMenu(false); placePop(menu, els.modelBtn, "above"); focusFirst(menu); }, "", false).querySelector(".check").textContent = "‹";
    sep();
    for (const [value, label] of EFFORTS) {
      item(label, value === effort, () => { effort = value; settings.effort = value; saveSettings(); showModel(); closePops(); });
    }
    return;
  }
  if (models.length === 0) {
    const l = document.createElement("div");
    l.className = "label";
    l.setAttribute("role", "none");
    l.textContent = "No models — is Maximal running?";
    menu.append(l);
  }
  for (const m of models) {
    item(m.name, m.id === modelId, () => { modelId = m.id; settings.model = m.id; saveSettings(); showModel(); closePops(); });
  }
  sep();
  item("Effort", false, (e) => { e.stopPropagation(); renderModelMenu(true); placePop(menu, els.modelBtn, "above"); focusFirst(menu); }, `${effortName(effort)} ›`, false);
}

els.modelBtn.onclick = () => {
  // The icon only eases the chip back in; the full chip opens the menu.
  if (els.modelBtn.classList.contains("iconic")) { chipPeek(); chipRelease(); return; }
  chipTouch();
  const open = els.modelMenu.hidden;
  closePops();
  if (!open) return;
  renderModelMenu(false);
  els.modelMenu.style.maxHeight = "";
  placePop(els.modelMenu, els.modelBtn, "above");
  els.modelBtn.setAttribute("aria-expanded", "true");
  popOpener = els.modelBtn;
  focusFirst(els.modelMenu);
};

async function callModel(signal) {
  const body = { model: modelId, max_tokens: 4096, system: SYSTEM, tools: TOOLS, messages };
  if (effort) body.output_config = { effort };
  const res = await fetch(`${settings.baseUrl}/v1/messages`, {
    method: "POST",
    headers: headers(),
    signal,
    body: JSON.stringify(body),
  });
  const text = await res.text();
  let parsed;
  try { parsed = JSON.parse(text); } catch { parsed = undefined; }
  if (!res.ok) {
    const message = parsed && parsed.error && parsed.error.message ? parsed.error.message : text.slice(0, 400);
    throw new Error(`Maximal answered ${res.status}: ${message}`);
  }
  return parsed;
}

// ---------------------------------------------------------------- transcript UI

function scrollDown() {
  els.log.scrollTop = els.log.scrollHeight;
}

// Everything goes above the live status line, which stays last.
function place(el) {
  clearHint();
  if (live.el && live.el.parentNode === els.log) els.log.insertBefore(el, live.el);
  else els.log.append(el);
  scrollDown();
}

function add(kind, text) {
  const div = document.createElement("div");
  div.className = `msg ${kind}`;
  if (kind === "error") {
    // Icon + spoken "Error:" so it never relies on color alone.
    div.innerHTML = `${ICON_ALERT}<span><span class="sr">Error: </span></span>`;
    div.lastChild.append(text);
  } else div.textContent = text;
  place(div);
  return div;
}

// "create_stickies" → "Create stickies".
function humanize(name) {
  const s = String(name).replace(/_/g, " ").trim();
  return s.charAt(0).toUpperCase() + s.slice(1);
}

const ICON_COPY = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><path d="M8.5 1.5h-5a2 2 0 0 0-2 2v5"/></svg>';
const ICON_CHECK = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2.5 6.5l2.5 2.5 4.5-5.5"/></svg>';
const ICON_ERR = '<svg class="dz-err" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" role="img" aria-label="Failed"><circle cx="6" cy="6" r="4.75"/><path d="M6 3.5v3M6 8.25v.25"/></svg>';
const ICON_ALERT = '<svg class="dz-err" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="6" cy="6" r="4.75"/><path d="M6 3.5v3M6 8.25v.25"/></svg>';
const DOTS = '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>';

// One 1s clock for every ticking label (live line, running rows).
const tickers = new Set();
let tickTimer = null;
function tick(fn, on) {
  if (on) tickers.add(fn);
  else tickers.delete(fn);
  if (tickers.size && !tickTimer) tickTimer = setInterval(() => { for (const f of tickers) f(); }, 1000);
  else if (!tickers.size && tickTimer) { clearInterval(tickTimer); tickTimer = null; }
}
const secs = (t0) => `${Math.max(0, Math.floor((Date.now() - t0) / 1000))}s`;
setInterval(() => {
  for (const t of els.log.querySelectorAll("time[data-t] > [aria-hidden]")) t.textContent = ago(Number(t.parentNode.dataset.t));
}, 30000);

// ---- live status: dots + present-tense label + seconds since it changed.
const live = { el: null, label: "", since: 0 };
const STALL_MS = 20000;

function liveTick() {
  if (!live.el) return;
  live.el.querySelector(".live-t").textContent = secs(live.since);
  live.el.querySelector(".live-hint").textContent = Date.now() - live.since > STALL_MS ? "still working…" : "";
}

function liveSet(label) {
  if (!label) return liveStop();
  if (!live.el) {
    live.el = document.createElement("div");
    live.el.className = "live";
    live.el.innerHTML = `${DOTS}<span class="live-label"></span><span class="live-t" aria-hidden="true"></span><span class="live-hint"></span>`;
    tick(liveTick, true);
  }
  if (live.el.parentNode !== els.log) { clearHint(); els.log.append(live.el); }
  if (label !== live.label) {
    live.label = label;
    live.since = Date.now();
    live.el.querySelector(".live-label").textContent = label;
  }
  liveTick();
  scrollDown();
}

function liveStop() {
  tick(liveTick, false);
  if (live.el) live.el.remove();
  live.el = null;
  live.label = "";
}

// ---- tool labels: present while running, past when done, "Couldn't …" on error.
const VERB_FORMS = Object.fromEntries(("create Creating Created|update Updating Updated|delete Deleting Deleted|set Setting Set|get Getting Got|find Finding Found|search Searching Searched|list Listing Listed|switch Switching Switched|rename Renaming Renamed|edit Editing Edited|connect Connecting Connected|draw Drawing Drew|stamp Stamping Stamped|review Reviewing Reviewed|fit Fitting Fitted|style Styling Styled|duplicate Duplicating Duplicated|group Grouping Grouped|ungroup Ungrouping Ungrouped|move Moving Moved|unlock Unlocking Unlocked|calibrate Calibrating Calibrated|reorder Reordering Reordered|align Aligning Aligned|distribute Distributing Distributed|arrange Arranging Arranged|focus Focusing Focused|select Selecting Selected|export Exporting Exported|convert Converting Converted|copy Copying Copied|sort Sorting Sorted|run Running Ran|read Reading Read")
  .split("|").map((s) => { const [v, ing, ed] = s.split(" "); return [v, [ing, ed]]; }));
const TOOL_VERB = { get_board: "read", get_selection: "read", get_node: "read", find_nodes: "search", board_tree: "read", viewport: "set", batch: "run" };
const TOOL_OBJECT = {
  get_board: "the board", get_selection: "the selection", get_node: "a node", find_nodes: "the board", list_pages: "pages",
  get_link: "a link", set_link: "a link", set_board_url: "the board link", export_png: "a PNG", review_layout: "the layout",
  connect: "shapes", draw: "", stamp: "", batch: "a batch", run_code: "code", read_markup: "markup", board_tree: "the board tree",
  viewport: "the viewport", focus: "the view", calibrate_fonts: "fonts", unlock_all: "everything", move_to: "nodes", fit_section: "a section",
};

function countOf(input) {
  for (const v of Object.values(input || {})) if (Array.isArray(v)) return v.length;
  return 0;
}

function toolLabel(name, input, phase) {
  const parts = String(name).split("_");
  const verb = TOOL_VERB[name] || parts[0];
  const forms = VERB_FORMS[verb];
  if (!forms) return phase === "fail" ? `${humanize(name)} failed` : humanize(name);
  let obj = name in TOOL_OBJECT ? TOOL_OBJECT[name] : parts.slice(1).join(" ");
  if (!(name in TOOL_OBJECT) && obj) {
    const n = countOf(input);
    if (n > 1) obj = `${n} ${obj}`;
    else if (!/s$/.test(obj)) obj = `${/^[aeiou]/.test(obj) ? "an" : "a"} ${obj}`;
  }
  const head = phase === "fail" ? `Couldn't ${verb}` : forms[phase === "ing" ? 0 : 1];
  return obj ? `${head} ${obj}` : head;
}

// ---- disclosure rows: a button head + a lazily built, height-animated body.
// Open state is remembered per key while the panel is open.
const openRows = new Set();
let rowSeq = 0;

function animateBody(body, open) {
  for (const a of body.getAnimations()) a.cancel();
  body.style.overflow = "";
  if (reduceMotion.matches) { body.hidden = !open; return; }
  body.hidden = false;
  const h = `${body.scrollHeight}px`;
  body.style.overflow = "hidden";
  const frames = [{ height: "0px", opacity: 0 }, { height: h, opacity: 1 }];
  const a = body.animate(open ? frames : frames.reverse(), { duration: 180, easing: "cubic-bezier(0.22, 0.61, 0.36, 1)" });
  a.onfinish = () => { body.style.overflow = ""; if (!open) body.hidden = true; };
}

function disclosure(cls, key, build) {
  const wrap = document.createElement("div");
  wrap.className = `dz ${cls}`;
  const head = document.createElement("button");
  head.type = "button";
  head.className = "dz-head";
  head.setAttribute("aria-expanded", "false");
  const body = document.createElement("div");
  body.className = "dz-body";
  body.id = `dz${++rowSeq}`;
  body.hidden = true;
  head.setAttribute("aria-controls", body.id);
  wrap.append(head, body);
  let built = false;
  const d = {
    wrap, head, body, open: false,
    set(open, animate) {
      d.open = open;
      if (key) { if (open) openRows.add(key); else openRows.delete(key); }
      head.setAttribute("aria-expanded", String(open));
      wrap.classList.toggle("open", open);
      if (open && !built) { body.replaceChildren(); build(body); built = true; }
      if (animate) animateBody(body, open);
      else body.hidden = !open;
    },
    // Content changed (e.g. a result arrived): rebuild now if open, else on next open.
    rebuild() {
      if (d.open) { body.replaceChildren(); build(body); } else built = false;
    },
    restore() { if (key && openRows.has(key)) d.set(true, false); },
  };
  head.onclick = () => d.set(!d.open, true);
  return d;
}

// Pretty JSON with theme-colored keys/strings/numbers/literals.
function highlightJson(text) {
  const re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;
  let out = "";
  let last = 0;
  let m;
  while ((m = re.exec(text))) {
    out += escapeHtml(text.slice(last, m.index));
    const cls = m[1] ? (m[2] ? "j-k" : "j-s") : m[3] ? "j-b" : "j-n";
    out += `<span class="${cls}">${escapeHtml(m[1] || m[0])}</span>${m[2] ? escapeHtml(m[2]) : ""}`;
    last = re.lastIndex;
  }
  return out + escapeHtml(text.slice(last));
}

const IO_LINES = 40;
function ioBlock(title, value, images) {
  const wrap = document.createElement("div");
  wrap.className = "io";
  const h = document.createElement("div");
  h.className = "io-title";
  h.textContent = title;
  wrap.append(h);
  const isJson = typeof value !== "string";
  const text = isJson ? forDisplay(value === undefined ? null : value) : value;
  const lines = text.split("\n");
  const pre = document.createElement("pre");
  const render = (all) => {
    const shown = all ? text : lines.slice(0, IO_LINES).join("\n");
    if (isJson) pre.innerHTML = highlightJson(shown);
    else pre.textContent = shown;
  };
  render(false);
  wrap.append(pre);
  if (lines.length > IO_LINES) {
    const more = document.createElement("button");
    more.type = "button";
    more.className = "more";
    more.textContent = `Show more (${lines.length - IO_LINES} lines)`;
    pre.tabIndex = -1;
    more.onclick = () => { render(true); more.remove(); pre.focus(); };
    wrap.append(more);
  }
  for (const img of images || []) {
    const el = document.createElement("img");
    el.alt = `Export${img.id ? ` of ${img.id}` : ""}`;
    el.src = `data:${img.format === "JPG" ? "image/jpeg" : "image/png"};base64,${img.base64}`;
    wrap.append(el);
  }
  return wrap;
}

// One tool call: running → dots + elapsed; done → past-tense label.
// opts (a step with only this call): prefix for the label, and the step's
// pre-tool text shown first in the body.
function callRow(call, onChange, opts = {}) {
  const r = { status: "queued", started: 0, result: undefined, images: [] };
  const d = disclosure("call", call.id ? `c:${call.id}` : "", (body) => {
    if (opts.text) body.append(thoughtRow(opts.text, opts.textKey || ""));
    body.append(ioBlock("Request", call.input || {}));
    if (r.status === "ok" || r.status === "failed") body.append(ioBlock(r.status === "ok" ? "Response" : "Error", r.result, r.images));
    else {
      const w = document.createElement("div");
      w.className = "io-title";
      w.textContent = "Waiting for the response…";
      body.append(w);
    }
  });
  const ticker = () => { const t = d.head.querySelector(".dz-t"); if (t) t.textContent = secs(r.started); };
  r.present = toolLabel(call.name, call.input, "ing");
  r.paint = () => {
    const label = r.status === "ok" ? toolLabel(call.name, call.input, "ed")
      : r.status === "failed" ? toolLabel(call.name, call.input, "fail") : r.present;
    d.wrap.classList.toggle("failed", r.status === "failed");
    d.wrap.classList.toggle("pending", r.status === "queued");
    d.head.innerHTML = `${r.status === "failed" ? ICON_ERR : ""}<span class="dz-label"></span>${r.status === "running" ? `${DOTS}<span class="dz-t" aria-hidden="true"></span>` : ICON_CARET}`;
    d.head.querySelector(".dz-label").textContent = opts.prefix ? `${opts.prefix} · ${label}` : label;
    d.head.title = call.name;
    if (r.status === "running") ticker();
  };
  r.start = () => {
    r.status = "running";
    r.started = Date.now();
    tick(ticker, true);
    r.paint();
    onChange();
  };
  r.done = (ok, result, images) => {
    tick(ticker, false);
    r.status = ok ? "ok" : "failed";
    r.result = result;
    r.images = images && images.length ? images : ok ? imagesOf(result) : [];
    r.paint();
    d.rebuild();
    onChange();
  };
  r.d = d;
  r.paint();
  return r;
}

// Pre-tool text: one truncated line; its own caret shows it all.
// Open, the full text renders as markdown beside the caret (links and copy
// buttons can't live inside the toggle button).
function thoughtRow(text, key) {
  const wrap = document.createElement("div");
  wrap.className = "thought-wrap";
  const full = document.createElement("div");
  full.className = "thought-md";
  setMarkdown(full, text);
  const b = document.createElement("button");
  b.type = "button";
  b.className = "thought";
  const t = document.createElement("span");
  t.className = "thought-text";
  t.textContent = text.replace(/[`*_~#>|]+/g, "").replace(/\s+/g, " ").trim();
  b.append(t);
  b.insertAdjacentHTML("beforeend", ICON_CARET);
  wrap.append(full, b);
  const set = (open) => {
    b.setAttribute("aria-expanded", String(open));
    if (open) b.setAttribute("aria-label", "Collapse note"); else b.removeAttribute("aria-label");
    b.classList.toggle("open", open);
    wrap.classList.toggle("open", open);
    full.hidden = !open;
    if (key) { if (open) openRows.add(key); else openRows.delete(key); }
  };
  b.onclick = () => set(b.getAttribute("aria-expanded") !== "true");
  set(Boolean(key && openRows.has(key)));
  return wrap;
}

// One agent step: its tool calls behind a summary twirldown.
function addStep({ text, calls, prefix, key }) {
  const rows = [];
  // Stopped mid-step: calls that never ran say so.
  const cancel = () => {
    for (const r of rows) if (r.status === "queued" || r.status === "running") r.done(false, "Not run: the user stopped the agent.");
  };
  // One call is its own row (one twirldown), not a group holding a same-named row.
  if (calls.length === 1) {
    const r = callRow(calls[0], () => {}, { prefix, text, textKey: key ? `t:${key}` : "" });
    rows.push(r);
    place(r.d.wrap);
    r.d.restore();
    return { rows, cancel };
  }
  let started = 0;
  const g = disclosure("step", key ? `g:${key}` : "", (body) => {
    if (text) body.append(thoughtRow(text, key ? `t:${key}` : ""));
    for (const r of rows) body.append(r.d.wrap);
  });
  const ticker = () => { const t = g.head.querySelector(".dz-t"); if (t) t.textContent = secs(started); };
  const paint = () => {
    const n = rows.length;
    if (n < calls.length) return;
    const done = rows.filter((r) => r.status === "ok" || r.status === "failed").length;
    const failed = rows.filter((r) => r.status === "failed").length;
    const runningNow = rows.some((r) => r.status === "running");
    if (runningNow && !started) { started = Date.now(); tick(ticker, true); }
    if (!runningNow) tick(ticker, false);
    let label;
    if (runningNow) label = n === 1 ? rows[0].present : `Running ${done + 1} of ${n} actions…`;
    else if (done < n) label = n === 1 ? rows[0].present : `${n} actions`;
    else if (n === 1) label = toolLabel(calls[0].name, calls[0].input, failed ? "fail" : "ed");
    else label = `Ran ${n} actions${failed ? ` · ${failed} failed` : ""}`;
    if (prefix) label = `${prefix} · ${label}`;
    g.wrap.classList.toggle("failed", failed > 0);
    g.head.innerHTML = `${failed ? ICON_ERR : ""}<span class="dz-label"></span>${runningNow ? `${DOTS}<span class="dz-t" aria-hidden="true"></span>` : ICON_CARET}`;
    g.head.querySelector(".dz-label").textContent = label;
    if (runningNow) ticker();
  };
  for (const c of calls) rows.push(callRow(c, paint));
  paint();
  place(g.wrap);
  g.restore();
  for (const r of rows) r.d.restore();
  return { rows, cancel };
}

// Bridge-relayed calls: a one-call step.
function addTool(name, input, prefix) {
  const step = addStep({ calls: [{ name, input }], prefix });
  step.rows[0].start();
  return { done(ok, result) { step.rows[0].done(ok, result); } };
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch { /* the iframe may block it */ }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;opacity:0";
  document.body.append(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch { /* ignore */ }
  ta.remove();
  return ok;
}

// ---------- markdown (assistant prose): escape first, then a small safe subset.
const MD_ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const mdEsc = (s) => String(s).replace(/[&<>"']/g, (c) => MD_ESC[c]);
const mdSafeUrl = (u) => /^(https?:\/\/|mailto:)/i.test(u) && !/[\s<>"]/.test(u);
const mdLink = (url, label) => `<a class="md-link" href="${mdEsc(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`;

function mdInline(src, noAuto) {
  const held = [];
  const hold = (html) => `\u0001${held.push(html) - 1}\u0002`;
  let s = String(src).replace(/[\u0001\u0002]/g, "");
  // Code spans, then links, then bare URLs are held out so emphasis can't touch them.
  s = s.replace(/(`+)([^`]|[^`][\s\S]*?[^`])\1(?!`)/g, (_, __, code) => hold(`<code>${mdEsc(code.trim() || code)}</code>`));
  s = s.replace(/\[([^\]\n]+)\]\(\s*<?([^\s)<>]+)>?(?:\s+"[^"]*")?\s*\)/g, (m, label, url) =>
    mdSafeUrl(url) ? hold(mdLink(url, mdInline(label, true))) : m);
  s = s.replace(/<((?:https?:\/\/|mailto:)[^\s<>]+)>/gi, (_, url) => hold(mdLink(url, mdEsc(url))));
  if (!noAuto) s = s.replace(/\bhttps?:\/\/[^\s<>"'`]+/gi, (url) => {
    const trail = url.match(/[.,;:!?)\]]+$/);
    let cut = trail ? trail[0] : "";
    // Keep a closing paren that balances one inside the URL (e.g. wikipedia links).
    if (cut.startsWith(")") && (url.split("(").length > url.split(")").length - 1)) cut = cut.slice(1);
    const u = cut ? url.slice(0, -cut.length) : url;
    return hold(mdLink(u, mdEsc(u))) + cut;
  });
  s = mdEsc(s)
    .replace(/(\*\*|__)(?=\S)([\s\S]*?\S)\1/g, "<strong>$2</strong>")
    .replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<del>$1</del>")
    .replace(/\*(?=[^\s*])([^*]*?[^\s*])\*/g, "<em>$1</em>")
    .replace(/(^|[^\w])_(?=[^\s_])([^_]*?[^\s_])_(?!\w)/g, "$1<em>$2</em>");
  return s.replace(/\u0001(\d+)\u0002/g, (_, i) => held[i]);
}

const MD_FENCE = /^ {0,3}(`{3,}|~{3,})\s*([\w+#.-]*)/;
const MD_HEAD = /^ {0,3}(#{1,6})\s+(.*?)(?:\s+#+)?\s*$/;
const MD_HR = /^ {0,3}([-*_])(?:\s*\1){2,}\s*$/;
const MD_QUOTE = /^ {0,3}>/;
const MD_ITEM = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
const MD_TSEP = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
const mdIsTable = (lines, i) => lines[i].includes("|") && i + 1 < lines.length && MD_TSEP.test(lines[i + 1]) && lines[i + 1].includes("-");
const mdStarts = (lines, i) => MD_FENCE.test(lines[i]) || MD_HEAD.test(lines[i]) || MD_HR.test(lines[i]) || MD_QUOTE.test(lines[i]) || MD_ITEM.test(lines[i]) || mdIsTable(lines, i);
const mdCells = (row) => row.trim().replace(/^\|/, "").replace(/(^|[^\\])\|$/, "$1").split(/(?<!\\)\|/).map((c) => mdInline(c.trim().replace(/\\\|/g, "|")));
const mdIndent = (ws) => ws.replace(/\t/g, "    ").length;

function mdList(lines, i) {
  let html = "";
  const stack = []; // { indent, tag }
  const close = () => { html += `</li></${stack.pop().tag}>`; };
  let blank = false;
  for (; i < lines.length; i++) {
    const line = lines[i];
    if (!line.trim()) { blank = true; continue; }
    const m = line.match(MD_ITEM);
    if (m && !MD_HR.test(line)) {
      const indent = mdIndent(m[1]);
      const ordered = /\d/.test(m[2]);
      const tag = ordered ? "ol" : "ul";
      while (stack.length && indent < stack[stack.length - 1].indent) close();
      const top = stack[stack.length - 1];
      if (!top || indent > top.indent + 1) {
        html += `<${tag}${ordered && parseInt(m[2], 10) !== 1 ? ` start="${parseInt(m[2], 10)}"` : ""}><li>`;
        stack.push({ indent, tag });
      } else if (top.tag !== tag) {
        close();
        html += `<${tag}><li>`;
        stack.push({ indent, tag });
      } else html += "</li><li>";
      html += mdInline(m[3]);
      blank = false;
      continue;
    }
    // Continuation text: indented, or a lazy line straight after an item.
    const indented = /^\s{2,}/.test(line);
    if ((!indented && (blank || mdStarts(lines, i))) || MD_FENCE.test(line)) break;
    html += `${blank ? "<br><br>" : "<br>"}${mdInline(line.trim())}`;
    blank = false;
  }
  while (stack.length) close();
  return { html, next: i };
}

function renderMarkdown(src) {
  const lines = String(src ?? "").replace(/\r\n?/g, "\n").split("\n");
  let out = "";
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    let m;
    if ((m = line.match(MD_FENCE))) {
      const fence = m[1];
      const body = [];
      for (i++; i < lines.length && !new RegExp(`^ {0,3}${fence[0]}{${fence.length},}\\s*$`).test(lines[i]); i++) body.push(lines[i]);
      i++;
      const lang = m[2] ? ` data-lang="${mdEsc(m[2])}"` : "";
      out += `<div class="md-code"${lang}><pre tabindex="0"><code>${mdEsc(body.join("\n"))}</code></pre><button type="button" class="md-copy" title="Copy code" aria-label="Copy code">${ICON_COPY}</button></div>`;
    } else if ((m = line.match(MD_HEAD))) {
      out += `<${m[1].length <= 2 ? "h3" : "h4"}>${mdInline(m[2])}</${m[1].length <= 2 ? "h3" : "h4"}>`;
      i++;
    } else if (MD_HR.test(line)) {
      out += "<hr>";
      i++;
    } else if (MD_QUOTE.test(line)) {
      const body = [];
      for (; i < lines.length && MD_QUOTE.test(lines[i]); i++) body.push(lines[i].replace(/^ {0,3}> ?/, ""));
      out += `<blockquote>${renderMarkdown(body.join("\n"))}</blockquote>`;
    } else if (mdIsTable(lines, i)) {
      const head = mdCells(line);
      let rows = "";
      for (i += 2; i < lines.length && lines[i].trim() && lines[i].includes("|"); i++) {
        rows += `<tr>${mdCells(lines[i]).map((c) => `<td>${c}</td>`).join("")}</tr>`;
      }
      out += `<div class="md-table" tabindex="0"><table><thead><tr>${head.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
    } else if (MD_ITEM.test(line)) {
      const r = mdList(lines, i);
      out += r.html;
      i = r.next;
    } else {
      const para = [line.trim()];
      for (i++; i < lines.length && lines[i].trim() && !mdStarts(lines, i); i++) para.push(lines[i].trim());
      out += `<p>${para.map(mdInline).join("<br>")}</p>`;
    }
  }
  return out;
}

// Render into an element; links open via the sandbox (figma.openExternal), code blocks copy.
function setMarkdown(el, text) {
  el.classList.add("md");
  el.innerHTML = renderMarkdown(text);
}
document.addEventListener("click", async (e) => {
  const a = e.target.closest && e.target.closest(".md a.md-link");
  if (a) {
    e.preventDefault();
    const url = a.getAttribute("href");
    if (mdSafeUrl(url)) post({ type: "open-external", url });
    return;
  }
  const b = e.target.closest && e.target.closest(".md-copy");
  if (!b) return;
  if (!(await copyText(b.parentNode.querySelector("code").textContent))) return;
  b.innerHTML = ICON_CHECK;
  setTimeout(() => { b.innerHTML = ICON_COPY; }, 1200);
});

// The agent's final prose, with a muted copy + relative-time footer.
function addAssistant(text, at) {
  const wrap = document.createElement("div");
  wrap.className = "answer";
  const div = document.createElement("div");
  div.className = "msg assistant";
  setMarkdown(div, text);
  const foot = document.createElement("div");
  foot.className = "msg-foot";
  const copy = document.createElement("button");
  copy.type = "button";
  copy.title = "Copy";
  copy.setAttribute("aria-label", "Copy message");
  copy.innerHTML = ICON_COPY;
  copy.onclick = async () => {
    if (!(await copyText(text))) return;
    copy.innerHTML = ICON_CHECK;
    setTimeout(() => { copy.innerHTML = ICON_COPY; }, 1200);
  };
  foot.append(copy);
  if (at) {
    const t = document.createElement("time");
    t.dataset.t = String(at);
    t.dateTime = new Date(at).toISOString();
    // The relative label re-ticks every 30 s; keep it out of the live log.
    const rel = document.createElement("span");
    rel.setAttribute("aria-hidden", "true");
    rel.textContent = ago(at);
    const abs = document.createElement("span");
    abs.className = "sr";
    abs.textContent = new Date(at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    t.append(rel, abs);
    foot.append(t);
  }
  wrap.append(div, foot);
  place(wrap);
  return div;
}

const CONTEXT_RE = /\n\n\[Current selection: [\s\S]*\]$/;

function blockText(content) {
  if (typeof content === "string") return content;
  if (!Array.isArray(content)) return "";
  return content.filter((b) => b && b.type === "text").map((b) => b.text).join("\n");
}

function blockImages(content) {
  if (!Array.isArray(content)) return [];
  return content.filter((b) => b && b.type === "image" && b.source && b.source.data)
    .map((b) => ({ format: b.source.media_type === "image/jpeg" ? "JPG" : "PNG", base64: b.source.data }));
}

// Rebuild the transcript from a saved Messages API array.
function renderTranscript() {
  liveStop();
  els.log.replaceChildren();
  queue = [];
  const results = new Map();
  for (const m of messages) {
    if (m.role === "user" && Array.isArray(m.content)) {
      for (const b of m.content) if (b && b.type === "tool_result") results.set(b.tool_use_id, b);
    }
  }
  for (const m of messages) {
    if (m.role === "user") {
      // Text blocks after tool results are messages queued while the agent ran.
      const blocks = typeof m.content === "string" ? [{ type: "text", text: m.content }] : Array.isArray(m.content) ? m.content : [];
      for (const b of blocks) {
        if (!b || b.type !== "text") continue;
        const text = String(b.text || "").replace(CONTEXT_RE, "").trim();
        if (text) add("user", text);
      }
    } else if (m.role === "assistant" && Array.isArray(m.content)) {
      const text = m.content.filter((b) => b && b.type === "text" && b.text.trim()).map((b) => b.text.trim()).join("\n\n");
      const uses = m.content.filter((b) => b && b.type === "tool_use");
      if (uses.length === 0) {
        if (text) addAssistant(text);
        continue;
      }
      const step = addStep({ text, calls: uses, key: uses[0].id });
      uses.forEach((u, i) => {
        const r = results.get(u.id);
        if (!r) return step.rows[i].done(false, "No result");
        const raw = blockText(r.content);
        let value = raw;
        try { value = JSON.parse(raw); } catch { /* keep text */ }
        step.rows[i].done(!r.is_error, value, blockImages(r.content));
      });
    }
  }
  if (messages.length === 0) welcome();
  setActivity("");
  scrollDown();
}

const ICON_X = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 2l6 6M8 2L2 8"/></svg>';
const ICON_PLUS = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5 1.5v7M1.5 5h7"/></svg>';

// The hint above the input says what the next message carries: the
// selection (as JSON, see selectionContext) or just the page.
// The page the agent last acted on (tool results' target.pageName).
let agentPage = "";

// Empty when there's nothing to say: the row folds to zero height.
function showContext() {
  const key = selection.map((n) => n.id || n.name || "").join(",");
  if (key !== selKey) { selKey = key; ctxExcluded = false; }
  const n = selection.length;
  const away = agentPage && fileInfo.page && agentPage !== fileInfo.page ? `Agent is working on ${agentPage}` : "";
  els.ctxRow.classList.toggle("on", n > 0 && !ctxExcluded);
  els.ctxRow.classList.toggle("empty", n === 0 && !away);
  els.ctxX.hidden = n === 0;
  if (n === 0) {
    els.ctx.textContent = away;
    els.ctx.title = away ? `${away}; you're viewing ${fileInfo.page}.` : "";
    return;
  }
  els.ctx.textContent = `${n} selected · ${ctxExcluded ? "not included" : "included with your message"}${away ? ` · ${away}` : ""}`;
  const lines = selection.slice(0, 10).map((x) => {
    const label = String(x.text || x.name || x.id || "").replace(/\s+/g, " ").slice(0, 60);
    return `• ${x.type ? `${String(x.type).toLowerCase().replace(/_/g, " ")}: ` : ""}${label}`;
  });
  if (n > 10) lines.push(`…and ${n - 10} more`);
  els.ctx.title = `${ctxExcluded ? "Not sent" : "Sent with your next message"}:\n${lines.join("\n")}`;
  els.ctxX.innerHTML = ctxExcluded ? ICON_PLUS : ICON_X;
  const action = ctxExcluded ? "Include the selection with your message" : "Don't include the selection";
  els.ctxX.title = action;
  els.ctxX.setAttribute("aria-label", action);
}

els.ctxX.onclick = () => {
  ctxExcluded = !ctxExcluded;
  showContext();
};

function selectionContext() {
  return selection.length && !ctxExcluded
    ? `\n\n[Current selection: ${JSON.stringify(selection).slice(0, 4000)}]`
    : "";
}

function setActivity(text) {
  els.cactivity.textContent = text ? `${text}…` : "Working…";
  if (running) liveSet(text || "Thinking");
}

function setRunning(on) {
  running = on;
  els.cprompt.hidden = on;
  els.cactivity.hidden = !on;
  els.newChat.disabled = on;
  if (on) setActivity("Thinking");
  else liveStop();
  paintInput();
}

// ---------------------------------------------------------------- queue
//
// Messages sent while the agent runs show right away marked "Queued" and are
// delivered at the next step boundary (as text after the tool results), or
// as a new turn if the agent finishes first.

function queueMessage(text) {
  const el = add("user", text);
  el.classList.add("queued");
  const tag = document.createElement("span");
  tag.className = "queued-tag";
  tag.textContent = "Queued";
  el.append(tag);
  queue.push({ text: text + selectionContext(), raw: text, el });
}

function deliverQueued() {
  const items = queue.splice(0);
  for (const q of items) {
    q.el.classList.remove("queued");
    const tag = q.el.querySelector(".queued-tag");
    if (tag) tag.remove();
  }
  return items.map((q) => ({ type: "text", text: q.text }));
}

// The run ended before delivery: take the bubbles back, return the text to the input.
function restoreQueued() {
  const items = queue.splice(0);
  if (items.length === 0) return;
  for (const q of items) q.el.remove();
  const back = items.map((q) => q.raw).join("\n\n");
  els.prompt.value = els.prompt.value.trim() ? `${back}\n\n${els.prompt.value}` : back;
  autosize();
}

// ---------------------------------------------------------------- agent loop

async function runAgent(userText) {
  if (!modelId) {
    add("error", "No model — check that Maximal is running, then Save and reconnect in Settings.");
    return;
  }
  if (!chat) {
    chat = { id: newChatId(), title: pendingTitle || titleFrom(userText), createdAt: new Date().toISOString() };
    pendingTitle = "";
    setChatTitle();
  }
  const context = selectionContext();
  messages.push({ role: "user", content: [{ type: "text", text: userText + context }] });
  add("user", userText);
  chipSetIdle(true);
  setRunning(true);
  abort = new AbortController();
  let current = null;
  try {
    for (let step = 0; step < MAX_STEPS; step++) {
      setActivity("Thinking");
      const reply = await callModel(abort.signal);
      const content = Array.isArray(reply.content) ? reply.content : [];
      messages.push({ role: "assistant", content });
      const text = content.filter((b) => b.type === "text" && b.text.trim()).map((b) => b.text.trim()).join("\n\n");
      const calls = content.filter((b) => b.type === "tool_use");
      if (calls.length === 0 || reply.stop_reason !== "tool_use") {
        if (text) { addAssistant(text, Date.now()); compactNotify(text); }
        if (queue.length === 0) return;
        // Finished with messages waiting: they start the next turn.
        repairHistory();
        messages.push({ role: "user", content: deliverQueued() });
        saveChat();
        continue;
      }
      const results = [];
      current = addStep({ text, calls, key: calls[0].id });
      for (const [i, call] of calls.entries()) {
        if (abort.signal.aborted) throw new DOMException("Stopped", "AbortError");
        const row = current.rows[i];
        row.start();
        setActivity(row.present);
        const out = await runTool(call.name, call.input || {});
        row.done(out.ok, out.ok ? out.result : out.error);
        results.push({
          type: "tool_result",
          tool_use_id: call.id,
          content: toolResultContent(out),
          is_error: !out.ok,
        });
      }
      current = null;
      messages.push({ role: "user", content: results.concat(deliverQueued()) });
      saveChat();
    }
    add("note", `Stopped after ${MAX_STEPS} steps.`);
  } catch (error) {
    if (error.name === "AbortError") add("note", "Stopped.");
    else add("error", error.message);
    repairHistory();
  } finally {
    if (current) current.cancel();
    abort = null;
    restoreQueued();
    setRunning(false);
    saveChat();
    if (document.body.classList.contains("compact")) els.cprompt.focus();
    else els.prompt.focus();
  }
}

// After a stop or error, make sure every tool_use has a tool_result so the
// next request is valid.
function repairHistory() {
  const last = messages[messages.length - 1];
  if (!last || last.role !== "assistant") return;
  const calls = (last.content || []).filter((b) => b.type === "tool_use");
  if (calls.length === 0) return;
  messages.push({
    role: "user",
    content: calls.map((c) => ({ type: "tool_result", tool_use_id: c.id, content: "Not run: the user stopped the agent.", is_error: true })),
  });
}

// ---------------------------------------------------------------- remote control
//
// With the switch on, the panel connects to bridge.ts on this computer and
// runs the tool calls it relays (from curl or Claude Code), showing each one
// in the transcript.

let bridge = null;
let bridgeRetry = null;
// Identifies this panel to the bridge, so several boards (or two windows on
// one board) can be connected at once. Kept for the panel's lifetime, so a
// reconnect after a bridge restart gets the same id back.
// The sandbox picks the name (it's also in Figma's window title) and passes
// it on <html data-session>; the fallback only runs if that's missing.
const SESSION = document.documentElement.dataset.session || (() => {
  const moods = ["giddy", "calm", "brave", "sleepy", "curious", "jolly", "grumpy", "proud", "shy", "eager",
    "happy", "merry", "bold", "keen", "zany", "witty", "cheery", "plucky", "sunny", "chill",
    "dreamy", "fierce", "gentle", "glad", "hasty", "humble", "jaunty", "kind", "lively", "lucky",
    "mellow", "nimble", "perky", "quiet", "silly", "snappy", "spry", "upbeat", "wise", "zesty"];
  const animals = ["otter", "lynx", "heron", "panda", "gecko", "moose", "koala", "falcon", "badger", "bison",
    "crane", "dingo", "eagle", "ferret", "gibbon", "hare", "ibis", "jackal", "kiwi", "lemur",
    "marten", "newt", "ocelot", "puffin", "quail", "raven", "seal", "tapir", "urchin", "vole",
    "walrus", "yak", "zebra", "beaver", "camel", "dove", "egret", "fox", "goose", "llama"];
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  return `${pick(moods)}-${pick(animals)}`;
})();

function sendBoard() {
  if (bridge && bridge.readyState === WebSocket.OPEN) bridge.send(JSON.stringify({ type: "board", board: fileInfo }));
}

// Pairing v2 (approve once): hello carries the instance name (SESSION) and
// the stored client token, if any. Unknown panels wait for approval
// ("bun figjam.ts approve <name>" or Maximal); the bridge then sends
// {paired, token, clientId}, which is stored per Figma user via save-settings.
let bridgeFails = 0;
let bridgeToolsBusy = 0; // Claude Code tool calls running right now
let bridgeDropNoted = false; // one log note per drop, at most
let pairStop = false; // denied / expired / unpaired / replaced: wait for "Ask again"
let expiredOnce = false; // an expired request is re-sent automatically once
const PAIR_CLOSE = { 4401: "unpaired", 4403: "pair-denied", 4408: "pair-expired", 4409: "pair-name-in-use", 4429: "pair-busy" };

function storeBridgeToken(token, clientId) {
  settings.bridgeToken = token || "";
  settings.bridgeClientId = clientId || "";
  delete settings.pairingCode;
  saveSettings();
}

function openBridge() {
  clearTimeout(bridgeRetry);
  if (!settings.remote) return setNet("bridge", "off");
  if (bridge || pairStop) return;
  let ws;
  try {
    ws = new WebSocket(BRIDGE_URL);
  } catch (error) {
    setNet("bridge", "blocked", { error: error.message });
    return;
  }
  bridge = ws;
  bridgePaired = false;
  let ended = null; // the pair-* / unpaired message that precedes a close
  setNet("bridge", "connecting", { attempt: bridgeFails });
  ws.onopen = () => {
    const hello = { type: "hello", session: SESSION, board: fileInfo, plugin: pluginInfo, tools: allTools };
    if (settings.bridgeToken) hello.token = settings.bridgeToken;
    if (pluginInfo.user) hello.user = pluginInfo.user;
    ws.send(JSON.stringify(hello));
  };
  ws.onmessage = async (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }
    if (bridge !== ws) return;
    if (msg.type === "paired") {
      if (msg.token) storeBridgeToken(msg.token, msg.clientId);
      bridgePaired = true;
      bridgeFails = 0;
      expiredOnce = false;
      bridgeDropNoted = false;
      setNet("bridge", "connected");
      if (!storeOnline) refreshChats();
      return;
    }
    if (msg.type === "pair-pending") {
      // A revoked token (or a new bridge data dir): drop it and wait as new.
      if (msg.reason === "unknown-token" && settings.bridgeToken) storeBridgeToken("", "");
      setNet("bridge", "pending", { name: msg.name || SESSION, expiresAt: msg.expiresInSec ? Date.now() + msg.expiresInSec * 1000 : 0 });
      return;
    }
    if (/^pair-|^unpaired$/.test(msg.type)) { ended = msg; return; }
    if (msg.type === "chats-reply") return settleChatReply(msg);
    if (msg.type !== "tool" || !bridgePaired) return;
    const view = addTool(msg.name, msg.input || {}, "Claude Code");
    bridgeToolsBusy++;
    let out;
    try {
      out = await runTool(msg.name, msg.input || {}, typeof msg.actor === "string" ? msg.actor : "agent:anonymous");
    } finally {
      bridgeToolsBusy--;
    }
    view.done(out.ok, out.ok ? out.result : out.error);
    compactNotify(`Claude Code · ${toolLabel(msg.name, msg.input || {}, out.ok ? "ed" : "fail")}`);
    if (!running) setActivity("");
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "tool-result", id: msg.id, ok: out.ok, result: out.result, error: out.error }));
    }
  };
  ws.onclose = (event) => {
    if (bridge !== ws) return;
    bridge = null;
    bridgePaired = false;
    storeOnline = false;
    failChatReplies();
    if (bridgeToolsBusy > 0 && !bridgeDropNoted) {
      bridgeDropNoted = true;
      add("note", "The bridge disconnected while a Claude Code tool call was running, so its result couldn't be sent back.");
    }
    if (!settings.remote) return setNet("bridge", "off");
    const why = ended ? ended.type : PAIR_CLOSE[event.code];
    // Replaced by a newer request from this board: stay quiet, don't fight it.
    if (event.code === 4000) { pairStop = true; return setNet("bridge", "replaced"); }
    if (why === "pair-denied") { pairStop = true; return setNet("bridge", "denied"); }
    if (why === "unpaired") { storeBridgeToken("", ""); pairStop = true; return setNet("bridge", "unpaired"); }
    if (why === "pair-expired") {
      if (!expiredOnce) { expiredOnce = true; return openBridge(); }
      pairStop = true;
      return setNet("bridge", "expired");
    }
    bridgeFails++;
    let delay = backoff(bridgeFails);
    if (why === "pair-busy" && ended && ended.retryAfterSec) delay = Math.max(delay, ended.retryAfterSec * 1000);
    setNet("bridge", "retrying", { attempt: bridgeFails, nextAt: Date.now() + delay, why: why || "" });
    bridgeRetry = setTimeout(openBridge, delay);
  };
}

function closeBridge() {
  clearTimeout(bridgeRetry);
  const ws = bridge;
  bridge = null;
  bridgePaired = false;
  storeOnline = false;
  failChatReplies();
  if (ws) ws.close();
  bridgeFails = 0;
  setNet("bridge", "off");
}

// Settings → "Ask again": a fresh request after denied / expired / unpaired.
function askAgain() {
  pairStop = false;
  expiredOnce = false;
  bridgeFails = 0;
  if (bridge) { const ws = bridge; bridge = null; bridgePaired = false; ws.close(); }
  openBridge();
}

// Settings → "Forget": the bridge revokes this client (closes 4401) and the
// stored token goes away.
function forgetBridge() {
  if (bridge && bridgePaired && bridge.readyState === WebSocket.OPEN) bridge.send(JSON.stringify({ type: "unpair" }));
  storeBridgeToken("", "");
  renderNet();
}

// ---------------------------------------------------------------- window

function windowSize() {
  const w = settings.window || {};
  return {
    width: Math.min(1400, Math.max(320, Number(w.width) || DEFAULT_WINDOW.width)),
    height: Math.min(1200, Math.max(360, Number(w.height) || DEFAULT_WINDOW.height)),
  };
}

function applyWindowMode(mode, resize) {
  const size = windowSize();
  settings.window = { mode, width: size.width, height: size.height };
  document.body.classList.toggle("compact", mode === "compact");
  if (mode !== "compact") compactClear();
  closePops(false);
  closeChats(false);
  if (!resize) return;
  post(Object.assign({ type: "resize", anchor: true }, mode === "compact" ? COMPACT : size));
  saveSettings();
  setTimeout(() => (mode === "compact" ? els.cprompt : els.prompt).focus(), 50);
}

els.collapse.onclick = () => {
  els.cprompt.value = els.prompt.value.replace(/\s+/g, " ");
  applyWindowMode("compact", true);
};
els.expand.onclick = () => {
  if (els.cprompt.value.trim()) els.prompt.value = els.cprompt.value;
  applyWindowMode("expanded", true);
};

// Corner grip: drag resizes the window (throttled), the size persists on release.
(() => {
  let start = null;
  let pending = null;
  let timer = null;
  const flush = () => {
    timer = null;
    if (pending) post(Object.assign({ type: "resize" }, pending));
  };
  els.grip.onpointerdown = (e) => {
    e.preventDefault();
    els.grip.setPointerCapture(e.pointerId);
    start = { x: e.screenX, y: e.screenY, w: window.innerWidth, h: window.innerHeight };
  };
  els.grip.onpointermove = (e) => {
    if (!start) return;
    pending = {
      width: Math.round(Math.min(1400, Math.max(320, start.w + e.screenX - start.x))),
      height: Math.round(Math.min(1200, Math.max(360, start.h + e.screenY - start.y))),
    };
    if (!timer) timer = setTimeout(flush, 33);
  };
  const end = () => {
    if (!start) return;
    start = null;
    clearTimeout(timer);
    flush();
    if (pending) {
      settings.window = { mode: "expanded", width: pending.width, height: pending.height };
      saveSettings();
    }
    pending = null;
  };
  els.grip.onpointerup = end;
  els.grip.onpointercancel = end;
})();

// ---------------------------------------------------------------- events

function send(source, fromKey) {
  const input = source === "compact" ? els.cprompt : els.prompt;
  const text = input.value.trim();
  if (running) {
    if (source === "main" && text) {
      input.value = "";
      autosize();
      queueMessage(text);
      closeChats();
      paintGo();
    } else if (!fromKey && abort) abort.abort();
    return;
  }
  if (!text || connState.state !== "ok") return;
  input.value = "";
  autosize();
  closeChats();
  // From the bar: open the panel so the conversation and live line show.
  if (source === "compact") applyWindowMode("expanded", true);
  runAgent(text);
}

// Something happened while collapsed (a reply, Claude Code activity): the
// bar's text area says it and the Expand button gets an unread dot.
let compactNote = "";
function compactNotify(text) {
  if (!document.body.classList.contains("compact")) return;
  compactNote = String(text || "").replace(/\s+/g, " ").trim().slice(0, 200);
  if (!compactNote) return;
  els.expand.classList.add("unread");
  els.expand.setAttribute("aria-label", "Expand · new activity");
  if (running) els.cactivity.textContent = compactNote;
  paintInput();
}
function compactClear() {
  compactNote = "";
  els.expand.classList.remove("unread");
  els.expand.setAttribute("aria-label", "Expand");
}

// Grows by whole lines (UI3 multi-line field), up to 160px.
function autosize() {
  const ta = els.prompt;
  ta.style.height = "auto";
  const cs = getComputedStyle(ta);
  const lh = parseFloat(cs.lineHeight) || 20;
  const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const maxLines = Math.max(1, Math.floor((160 - pad) / lh));
  const lines = Math.min(maxLines, Math.max(2, Math.ceil((ta.scrollHeight - pad - 0.5) / lh)));
  ta.style.height = `${pad + lines * lh}px`;
}

els.go.onclick = () => onRound("main");
els.cgo.onclick = () => onRound("compact");
els.prompt.oninput = () => { autosize(); paintGo(); };
els.prompt.onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send("main", true);
  }
};
els.cprompt.onkeydown = (e) => {
  if (e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    send("compact");
  }
};
els.newChat.onclick = () => { closePops(); startNewChat(); };
els.remote.onchange = () => {
  settings.remote = els.remote.checked;
  saveSettings();
  if (settings.remote) { pairStop = false; expiredOnce = false; bridgeFails = 0; openBridge(); }
  else closeBridge();
};
els.allowRunCode.onchange = () => {
  settings.allowRunCode = els.allowRunCode.checked;
  applyToolGate();
  saveSettings();
  add("note", settings.allowRunCode ? "run_code is on: agents may run Plugin API code on this board." : "run_code is off.");
};
// Figma access token (comment tools). Write-only: it goes to the sandbox once
// on save and is never kept in `settings`, shown again, logged or sent to the
// bridge; the sandbox answers with {hasToken, last4} only.
function renderFigmaToken(status) {
  const s = status || {};
  els.figmaTokenStatus.textContent = s.error || (s.hasToken ? `Saved · ends in ${s.last4}` : "No token saved");
  els.figmaTokenStatus.classList.toggle("error", Boolean(s.error));
  els.figmaToken.placeholder = s.hasToken ? "Paste a new token to replace it" : "Paste a token";
  const clearHadFocus = document.activeElement === els.figmaTokenClear;
  els.figmaTokenClear.hidden = !s.hasToken;
  if (clearHadFocus && !s.hasToken) els.figmaToken.focus();
}
function saveFigmaToken() {
  const token = els.figmaToken.value.trim();
  els.figmaToken.value = "";
  if (!token) return renderFigmaToken({ error: "Paste a token first." });
  post({ type: "figma-token-save", token });
}
els.figmaTokenSave.onclick = saveFigmaToken;
els.figmaTokenClear.onclick = () => post({ type: "figma-token-clear" });
els.figmaToken.onkeydown = (e) => {
  if (e.key === "Enter" && !e.isComposing) {
    e.preventDefault();
    saveFigmaToken();
  }
};
els.figmaTokenLink.onclick = (e) => {
  e.preventDefault();
  post({ type: "open-external", url: els.figmaTokenLink.href });
};
els.saveSettings.onclick = () => {
  settings.baseUrl = els.baseUrl.value.trim().replace(/\/+$/, "") || DEFAULT_BASE;
  settings.apiKey = els.apiKey.value.trim();
  saveSettings();
  if (els.figmaToken.value.trim()) saveFigmaToken();
  closePops();
  connectFails = 0;
  connState.state = "";
  net.maximal = { s: "checking" };
  connect();
  // A bridge that's waiting to retry gets an immediate attempt too.
  if (settings.remote && !bridge) { bridgeFails = 0; openBridge(); }
};

setRunning(false);
showModel();
renderChats();
post({ type: "init" });
</script>
</body>
