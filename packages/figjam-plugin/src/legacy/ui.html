<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agent</title>
<style>
  /* ---------- WCAG 2.2 AA contrast, measured (WCAG 2 relative luminance).
     Surfaces and body text come from Figma's UI3 theme vars (themeColors)
     with their documented values as fallbacks. Muted text, control borders,
     brand fills, focus ring, danger and syntax colors are our own tokens
     because the Figma ones fail; "was" = the failing value replaced.
     Text needs 4.5:1; non-text UI (borders, icons, ring, chevron) 3:1.

     LIGHT   bg #fff · bg-2 / bg-hover #f5f5f5 · bg-3 (drawer hover) #e6e6e6 · menu #1e1e1e
       fg #1e1e1e (Figma rgba(0,0,0,.9))   bg 16.7 · bg-2 16.0 · bg-3 13.4
       fg-2 #666 muted, placeholder, timestamps, hint line, chips, icons, chevrons
                                           bg 5.74 · bg-2 5.27 · bg-3 4.60 · mark 5.09
                                           was text-secondary rgba(0,0,0,.5) 3.95 / 3.62, tertiary #9a9a9a 2.8
       accent-fg #0a6dc2 links             bg 5.28 · bg-2 4.84   was #0d99ff 2.99, #007be5 4.23
       ring #0a6dc2 focus (non-text)       bg 5.28 · bg-2 4.84   was #0d99ff 2.99
       on-accent #fff on accent #0a6dc2    5.28                  was on #0d99ff 2.99
       danger #c22e0e                      bg 5.69 · bg-2 5.22   was #dc3412 4.24 on bg-2
       placeholder #666 (fg-2, also when disabled: it carries status) on field bg 5.74
       field focus border #0d99ff (Figma border-selected) vs bg 2.99
       syntax on bg-2: key #0a6dc2 4.84 · str #0f7a3f 4.97 · num #7a3ce0 5.43 · lit #9a5200 5.38
                                           was #14ae5c 2.66, #9747ff 4.13, #b86200 4.03
       mark #fff1c2 behind fg 14.8
     DARK    bg #2c2c2c · bg-2 / bg-hover #383838 · bg-3 #444
       fg #fff                             bg 13.97 · bg-2 11.73 · bg-3 9.74
       fg-2 #b3b3b3                        bg 6.66 · bg-2 5.59 · bg-3 4.65   was rgba(255,255,255,.4) 3.54
       accent-fg / ring #7cc4f8            bg 7.39 · bg-2 6.20 · bg-3 5.15   was #0c8ce9 3.95
       on-accent #fff on accent #0a6dc2    5.28                  was on #0c8ce9 3.53
       danger #fca397                      bg 7.20 · bg-2 6.04
       placeholder #b3b3b3 on field bg 6.66 · focus border #0c8ce9 vs bg 3.95
       syntax on bg-2: #7cc4f8 6.20 · #79d297 6.41 · #c9a2ff 5.64 · #f3b562 6.48
       mark #5a4a14 behind #fff 8.66
     POPOVERS / MENUS (main ⋯ menu, model + Effort, chat-row ⋯, Settings) use
       the panel surface in both themes, no inverted menus: fg / fg-2 / danger on
       bg (rest) and bg-hover (hover); keyboard focus adds the ring — all pairs
       are the bg / bg-2 columns above (light fg-2 on hover 5.27, danger 5.22;
       dark fg-2 on hover 5.59, danger 6.04). Was #fff on #1e1e1e menus whose
       selected row #0d99ff carried #fff at 2.99.
     TEXT FIELDS — deliberate UI3-fidelity choice: rest borders use Figma's
       own border var (#e6e6e6 light 1.25, #444 dark 1.43), below the 3:1
       non-text guideline exactly as Figma's controls are. Fields stay
       identifiable by placeholder, label and position; the 1px focus border is
       the state indicator (light #0d99ff 2.99, a hair under 3:1; dark 3.95).
       Disabled text uses text-disabled (#b3b3b3, exempt); the disabled
       composer's placeholder keeps fg-2 because it carries the error.
     Exempt: hairline dividers (--border, decorative), disabled controls.
     Reconnect button: fg on bg-2 16.0 / 11.7; dots accent-fg on bg-2 4.84 / 6.20. */
  :root {
    color-scheme: light;
    --bg: var(--figma-color-bg, #ffffff);
    --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
    --bg-3: var(--figma-color-bg-tertiary, #e6e6e6);
    --bg-hover: var(--figma-color-bg-hover, #f5f5f5);
    --fg: var(--figma-color-text, #1e1e1e);
    --fg-2: #666666;
    --border: var(--figma-color-border, #e6e6e6);
    /* UI3 text fields (UI3Kit): rest / focus / disabled straight from the theme. */
    --field-bg: var(--figma-color-bg, #ffffff);
    --field-border: var(--figma-color-border, #e6e6e6);
    --field-focus: var(--figma-color-border-selected, #0d99ff);
    --fg-disabled: var(--figma-color-text-disabled, #b3b3b3);
    --selection: var(--figma-color-bg-selected, #e5f4ff);
    --accent: #0a6dc2;
    --accent-fg: #0a6dc2;
    --ring: #0a6dc2;
    --on-accent: #ffffff;
    --danger: #c22e0e;
    --mark: #fff1c2;
    --syn-key: #0a6dc2;
    --syn-str: #0f7a3f;
    --syn-num: #7a3ce0;
    --syn-lit: #9a5200;

    /* type: system UI (SF Pro Text/Display picked optically on macOS).
       rem so text zoom scales it: 11/16, 12/16, 14/20, 16/24 px at 100%. */
    --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --text-xs: 0.6875rem/1rem;
    --text-sm: 0.75rem/1rem;
    --text-base: 0.875rem/1.25rem;
    --text-lg: 1rem/1.5rem;

    /* 4px grid */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;

    --r-sm: 4px;
    --r-md: 8px;
    --r-lg: 12px;
    --r-field: 6px;
    --control-h: 32px;
    --row-h: 36px;
    --header-h: 44px;
    --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  html.figma-dark {
    color-scheme: dark;
    --fg-2: #b3b3b3;
    --accent-fg: #7cc4f8;
    --ring: #7cc4f8;
    --danger: #fca397;
    --mark: #5a4a14;
    --syn-key: #7cc4f8;
    --syn-str: #79d297;
    --syn-num: #c9a2ff;
    --syn-lit: #f3b562;
  }
  /* Outside Figma (no theme class): follow the OS. */
  @media (prefers-color-scheme: dark) {
    html:not(.figma-light):not(.figma-dark) {
      color-scheme: dark;
      --bg: #2c2c2c; --bg-2: #383838; --bg-3: #444444; --bg-hover: #383838;
      --fg: #ffffff; --border: #444444;
      --fg-2: #b3b3b3; --accent-fg: #7cc4f8; --ring: #7cc4f8;
      --field-bg: #2c2c2c; --field-border: #444444; --field-focus: #0c8ce9; --fg-disabled: #757575; --selection: #2b4a63;
      --danger: #fca397; --mark: #5a4a14;
      --syn-key: #7cc4f8; --syn-str: #79d297; --syn-num: #c9a2ff; --syn-lit: #f3b562;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); font: var(--text-base) var(--font-family); font-optical-sizing: auto; -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; font-optical-sizing: auto; color: inherit; }
  ::placeholder { color: var(--fg-2); opacity: 1; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* Text fields (UI3): theme bg + 1px theme border at rest; focus = 1px
     selected-border (the one focus indicator, never an outline); disabled =
     same border, disabled text. Placeholders stay fg-2 even when disabled
     because they carry connection state. */
  input:not([type="checkbox"]), textarea { background: var(--field-bg); color: var(--fg); border: 1px solid var(--field-border); border-radius: var(--r-field); padding: 0 var(--space-2); outline: none; }
  input:not([type="checkbox"]):focus, textarea:focus { border-color: var(--field-focus); }
  input:not([type="checkbox"]):focus-visible, textarea:focus-visible { outline: none; }
  input:disabled, textarea:disabled { color: var(--fg-disabled); cursor: not-allowed; }
  input::selection, textarea::selection { background: var(--selection); }
  input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }

  button { border: 0; background: none; border-radius: var(--r-sm); padding: 0 var(--space-2); cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
  /* Keyboard ring for buttons, menu items, checkboxes, summaries. */
  :focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
  :focus:not(:focus-visible) { outline: none; }
  [hidden] { display: none !important; }
  svg { display: block; flex: none; }
  .icon { width: var(--control-h); height: var(--control-h); padding: 0; display: inline-grid; place-items: center; color: var(--fg-2); }
  .icon:hover:not(:disabled) { background: var(--bg-hover); color: var(--fg); }
  .round { width: var(--control-h); height: var(--control-h); padding: 0; border-radius: 50%; display: inline-grid; place-items: center; background: var(--accent); color: var(--on-accent); flex: none; }
  .round:focus-visible { outline-offset: 2px; }
  .round.stop { background: var(--fg); color: var(--bg); }
  /* Maximal down: the send button becomes Reconnect (dots while retrying). */
  .round.reconnect { background: var(--bg-2); color: var(--fg); }
  .round.reconnect:hover { background: var(--bg-3); }
  .round.reconnect[aria-disabled="true"] { cursor: progress; }
  .spacer { flex: 1; }

  /* ---------- layout: header / stage. The stage clips a stack (conversation
     + composer, then the chats list) that slides up to reveal the chats. */
  #app { position: relative; height: 100%; display: flex; flex-direction: column; }
  #stage { flex: 1; min-height: 0; position: relative; overflow: hidden; overflow: clip; }
  #stack { position: absolute; left: 0; right: 0; top: 0; height: 100%; }
  #convo { height: 100%; display: flex; flex-direction: column; }

  /* ---------- chats (below the fold) */
  #chats { height: calc(100% - var(--composer-h, 160px)); display: flex; flex-direction: column; padding: var(--space-3) var(--space-4) 0; }
  #search { flex: none; width: 100%; min-height: var(--control-h); }
  .chats-label { color: var(--fg-2); font: var(--text-sm) var(--font-family); padding: var(--space-2) var(--space-2) 0; }
  #chatList { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; padding: var(--space-1) 0 var(--space-2); }
  .chat-row { display: flex; align-items: center; border-bottom: 1px solid var(--border); }
  .chat-row:last-child { border-bottom: 0; }
  .chat-row:hover, .chat-row.active { background: var(--bg-hover); }
  .chat-row.active .t { font-weight: 600; }
  .chat-row .open { flex: 1; min-width: 0; min-height: var(--row-h); text-align: left; padding: var(--space-3) var(--space-2); display: flex; flex-direction: column; border-radius: 0; }
  .chat-row .t { font: var(--text-base) var(--font-family); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-row .s { color: var(--fg-2); font: var(--text-sm) var(--font-family); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .chat-row .s mark { background: var(--mark); color: inherit; border-radius: var(--r-sm); }
  /* Hidden with opacity, not visibility, so it stays in the tab order. */
  .chat-row .more { opacity: 0; width: 28px; height: 28px; margin: var(--space-1); }
  .chat-row:hover .more, .chat-row:focus-within .more, .chat-row .more[aria-expanded="true"] { opacity: 1; }
  .chat-row input { flex: 1; min-width: 0; margin: var(--space-1) 0; min-height: var(--control-h); }
  .nav-empty { color: var(--fg-2); padding: var(--space-3) var(--space-2); }

  /* Scrollbars: fixed gutter, thumb only while hovering or scrolling. No
     scrollbar-color here: it turns off the ::-webkit-scrollbar styling. */
  .scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .scroll::-webkit-scrollbar-thumb { background-color: transparent; border: 2px solid transparent; border-radius: 4px; background-clip: padding-box; }
  .scroll:hover::-webkit-scrollbar-thumb, .scroll.scrolling::-webkit-scrollbar-thumb { background-color: rgba(128, 128, 128, 0.45); }

  /* ---------- header */
  header { min-height: var(--header-h); flex: none; display: flex; align-items: center; gap: var(--space-1); padding: 0 var(--space-2); border-bottom: 1px solid var(--border); }
  #chatTitle { flex: 1; min-width: 0; display: block; min-height: var(--control-h); padding: 0 var(--space-2); font: var(--text-base) var(--font-family); font-weight: 500; color: var(--fg); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; }
  #chatTitle:hover { background: var(--bg-hover); }
  #titleInput { flex: 1; min-width: 0; min-height: var(--control-h); font-weight: 500; }

  /* ---------- popovers / menus */
  .pop { position: absolute; z-index: 30; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--space-2) 0; box-shadow: 0 4px 16px rgba(0,0,0,0.2), 0 2px 8px rgba(0,0,0,0.15); min-width: 160px; max-width: calc(100vw - var(--space-4)); }
  .pop .item { display: flex; align-items: center; gap: var(--space-2); width: calc(100% - var(--space-4)); min-height: var(--row-h); margin: 0 var(--space-2); padding: var(--space-1) var(--space-2); text-align: left; color: var(--fg); border-radius: var(--r-sm); overflow-wrap: anywhere; }
  .pop .item:hover, .pop .item:focus { background: var(--bg-hover); }
  .pop .item .check { width: 12px; flex: none; }
  .pop .item .sub { margin-left: auto; color: var(--fg-2); font: var(--text-sm) var(--font-family); white-space: nowrap; }
  .pop .item.danger { color: var(--danger); }
  .pop .sep { height: 1px; margin: var(--space-2) 0; background: var(--border); }
  .pop .label { padding: var(--space-1) var(--space-4); color: var(--fg-2); font: var(--text-sm) var(--font-family); }
  #settingsPop { left: var(--space-2); top: var(--header-h); width: min(320px, calc(100% - var(--space-4))); max-height: calc(100% - var(--header-h) - var(--space-2)); overflow-y: auto; padding: var(--space-5); }
  #settingsPop h2 { font: var(--text-base) var(--font-family); font-weight: 600; margin: 0; }
  /* Labels sit above their fields so they reflow at any text size. */
  .field { display: grid; gap: var(--space-1); margin-top: var(--space-4); }
  .field input { min-width: 0; min-height: var(--control-h); }
  .check-row { display: flex; gap: var(--space-2); align-items: flex-start; margin-top: var(--space-4); cursor: pointer; }
  .check-row input { margin: var(--space-1) 0 0; }
  .check-row small { display: block; color: var(--fg-2); font: var(--text-sm) var(--font-family); }
  .bridge-row { margin: var(--space-2) 0 0 var(--space-6); }
  /* Figma access token: write-only field + Save/Clear; status and help in fg-2 (5.74 / 6.66), link accent-fg (5.28 / 7.39), error danger. */
  .token-row { display: flex; gap: var(--space-2); }
  .token-row input { flex: 1; }
  .field small { color: var(--fg-2); font: var(--text-sm) var(--font-family); }
  .field small.error { color: var(--danger); }
  .field a { justify-self: start; color: var(--accent-fg); font: var(--text-sm) var(--font-family); text-decoration: underline; text-underline-offset: 2px; border-radius: var(--r-sm); }
  .field a:focus-visible { outline-offset: 2px; }
  .pop-foot { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-5); }
  .btn { display: inline-flex; align-items: center; min-height: var(--control-h); border: 1px solid var(--field-border); padding: var(--space-1) var(--space-3); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn:focus-visible { outline-offset: 2px; }

  /* ---------- transcript */
  #log { flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; padding: var(--space-4) var(--space-2) var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-6); }
  .msg { white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; max-width: 85%; background: var(--bg-2); border-radius: var(--r-lg); padding: var(--space-2) var(--space-3); }
  .msg.user.queued { opacity: 0.7; }
  .queued-tag { display: block; margin-top: var(--space-1); color: var(--fg-2); font: var(--text-sm) var(--font-family); }
  .msg.note { color: var(--fg-2); }
  /* Errors: icon + "Error:" (screen readers) + color, never color alone. */
  .msg.error { color: var(--danger); display: flex; align-items: flex-start; gap: var(--space-2); }
  .msg.error > svg { margin-top: var(--space-1); }
  .hint { color: var(--fg-2); margin: auto 0; text-align: center; padding: var(--space-4) var(--space-2); }
  .dots { display: inline-flex; align-items: center; gap: var(--space-1); flex: none; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-fg); animation: dot 1.2s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: 0.16s; }
  .dots i:nth-child(3) { animation-delay: 0.32s; }
  @keyframes dot { 0%, 70%, 100% { opacity: 0.3; transform: scale(0.8); } 35% { opacity: 1; transform: scale(1); } }
  .live { display: flex; align-items: center; gap: var(--space-2); min-height: 24px; padding: 0 var(--space-1); color: var(--fg-2); font: var(--text-sm) var(--font-family); }
  .live-label, .dz-label { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live-t, .dz-t { flex: none; color: var(--fg-2); font-variant-numeric: tabular-nums; }
  .live-hint { flex: none; color: var(--fg-2); }
  .dz { display: flex; flex-direction: column; align-items: flex-start; }
  .dz-head { display: inline-flex; align-items: center; gap: var(--space-1); max-width: 100%; min-height: 24px; padding: var(--space-2) var(--space-1); color: var(--fg-2); font: var(--text-sm) var(--font-family); text-align: left; }
  .dz-head:hover { background: var(--bg-hover); color: var(--fg); }
  .dz-head .dots { margin-left: var(--space-1); }
  #log .caret { flex: none; color: var(--fg-2); transition: transform 180ms var(--ease-out); }
  .dz.open > .dz-head .caret, .thought.open .caret { transform: rotate(90deg); }
  .dz-err { flex: none; color: var(--danger); }
  .dz.failed > .dz-head .dz-label { color: var(--danger); }
  .dz.pending > .dz-head { font-style: italic; }
  .dz-body { align-self: stretch; display: flex; flex-direction: column; align-items: flex-start; margin: 0 0 0 var(--space-2); padding-left: var(--space-2); border-left: 1px solid var(--border); }
  .dz-body[hidden] { display: none; }
  .call > .dz-body { align-items: stretch; padding-bottom: var(--space-2); }
  .thought { display: flex; align-items: flex-start; gap: var(--space-1); max-width: 100%; min-height: 24px; padding: var(--space-1); color: var(--fg-2); font: var(--text-sm) var(--font-family); text-align: left; }
  .thought:hover { background: var(--bg-hover); }
  .thought-text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: text; }
  .thought-wrap { display: flex; align-items: flex-start; gap: var(--space-1); max-width: 100%; }
  .thought-wrap.open .thought-text { display: none; }
  .thought-md { flex: 1; min-width: 0; padding: var(--space-1); color: var(--fg-2); font: var(--text-sm) var(--font-family); }
  .thought-md :is(h3, h4) { font: 600 var(--text-sm) var(--font-family); }
  .thought-md[hidden] { display: none; }

  /* ---------- markdown */
  .msg.md { white-space: normal; }
  .md { min-width: 0; overflow-wrap: anywhere; user-select: text; }
  .md :where(p, h3, h4, ul, ol, li, blockquote, hr, pre, table) { margin: 0; }
  .md > * + *, .md blockquote > * + *, .md li > * + * { margin-top: var(--space-2); }
  .md > * + :is(h3, h4) { margin-top: var(--space-3); }
  .md h3 { font: 600 var(--text-lg) var(--font-family); }
  .md h4 { font: 600 var(--text-base) var(--font-family); }
  .md :is(ul, ol) { padding-left: var(--space-5); }
  .md li + li, .md li > :is(ul, ol) { margin-top: var(--space-1); }
  .md a { color: var(--accent-fg); text-decoration: underline; text-underline-offset: 2px; }
  .md code { font-family: var(--font-mono); font-size: 0.75rem; background: var(--bg-2); border-radius: var(--r-sm); padding: 0 var(--space-1); }
  .md blockquote { border-left: 2px solid var(--border); padding-left: var(--space-3); color: var(--fg-2); }
  .md hr { border: 0; border-top: 1px solid var(--border); }
  .md-code { position: relative; }
  .md-code pre { overflow-x: auto; background: var(--bg-2); border-radius: var(--r-md); padding: var(--space-2) var(--space-3); font: var(--text-sm) var(--font-mono); white-space: pre; overflow-wrap: normal; }
  .md-code pre code { background: none; padding: 0; font-size: inherit; }
  .md-copy { position: absolute; top: var(--space-1); right: var(--space-1); width: 24px; height: 24px; padding: 0; display: inline-grid; place-items: center; background: var(--bg); color: var(--fg-2); border: 1px solid var(--border); opacity: 0; }
  .md-code:hover .md-copy, .md-copy:focus-visible, .md-code pre:focus-visible + .md-copy { opacity: 1; }
  .md-copy:hover { color: var(--fg); }
  @media (hover: none) { .md-copy { opacity: 1; } }
  .md-table { overflow-x: auto; }
  .md table { border-collapse: collapse; overflow-wrap: normal; }
  .md :is(th, td) { border: 1px solid var(--border); padding: var(--space-1) var(--space-2); text-align: left; vertical-align: top; }
  .md th { font-weight: 600; background: var(--bg-2); }
  .thought .caret { margin-top: var(--space-1); }
  .io { display: flex; flex-direction: column; gap: var(--space-1); padding-top: var(--space-1); }
  .io-title { color: var(--fg-2); font: var(--text-xs) var(--font-family); font-weight: 500; }
  .io pre { margin: 0; max-height: 320px; overflow: auto; padding: var(--space-2); background: var(--bg-2); border-radius: var(--r-md); font: var(--text-xs) var(--font-mono); white-space: pre-wrap; word-break: break-word; }
  .io .more { align-self: flex-start; min-height: 24px; padding: 0 var(--space-1); color: var(--accent-fg); font: var(--text-sm) var(--font-family); }
  .io .more:hover { background: var(--bg-hover); }
  .io img { display: block; align-self: flex-start; max-width: 100%; max-height: 160px; object-fit: contain; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-md); }
  .j-k { color: var(--syn-key); }
  .j-s { color: var(--syn-str); }
  .j-n { color: var(--syn-num); }
  .j-b { color: var(--syn-lit); }
  .answer { display: flex; flex-direction: column; gap: var(--space-1); }
  .msg-foot { display: flex; align-items: center; gap: var(--space-1); color: var(--fg-2); font: var(--text-xs) var(--font-family); }
  .msg-foot button { width: 24px; height: 24px; padding: 0; display: inline-grid; place-items: center; color: var(--fg-2); margin-left: calc(-1 * var(--space-1)); }
  .msg-foot button:hover { background: var(--bg-hover); color: var(--fg); }
  .spin { width: 12px; height: 12px; border: 2px solid var(--fg-2); border-top-color: transparent; border-radius: 50%; animation: rot 0.7s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ---------- composer: the box is the single focus indicator for the textarea */
  .composer { flex: none; padding: 0 var(--space-4); background: var(--bg); }
  /* Hint line: only when it says something; otherwise it folds to 0 (the
     top margin stays as the gap above the box). Height eases, no jump. */
  .ctx { display: flex; align-items: center; gap: var(--space-1); height: 1.5rem; min-height: 24px; overflow: hidden; margin: var(--space-2) 0; padding: 0 var(--space-1) 0 var(--space-2); color: var(--fg-2); font: var(--text-sm) var(--font-family); transition: height 180ms var(--ease-out), min-height 180ms var(--ease-out), margin-bottom 180ms var(--ease-out), opacity 140ms var(--ease-out); }
  .ctx.empty { height: 0; min-height: 0; margin-bottom: 0; opacity: 0; }
  .ctx.on { color: var(--fg); }
  #ctx { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ctxX { width: 24px; height: 24px; padding: 0; display: inline-grid; place-items: center; color: var(--fg-2); flex: none; }
  #ctxX:hover { background: var(--bg-hover); color: var(--fg); }
  .box { border: 1px solid var(--field-border); border-radius: var(--r-field); background: var(--field-bg); display: flex; flex-direction: column; }
  .box:has(#prompt:focus) { border-color: var(--field-focus); }
  .box:has(#prompt:disabled) { cursor: not-allowed; }
  #prompt { border: 0; border-radius: var(--r-field) var(--r-field) 0 0; resize: none; min-height: 48px; max-height: 160px; padding: var(--space-3) var(--space-4) var(--space-2); background: transparent; }
  #prompt:focus, #prompt:focus-visible { border: 0; outline: none; }
  .box-row { display: flex; align-items: center; gap: var(--space-1); padding: 0 var(--space-2) var(--space-2) var(--space-3); min-width: 0; }
  /* Model chip: full label, or (idle) a sparkles icon button. The spacer to
     its left absorbs the width change, so its right edge and Send stay put. */
  #modelBtn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: flex-end; min-height: var(--control-h); color: var(--fg-2); font: var(--text-sm) var(--font-family); padding: 0 var(--space-2); min-width: 0; white-space: nowrap; }
  #modelBtn .chip-text { display: inline-flex; align-items: center; gap: var(--space-1); min-width: 0; }
  #modelBtn #modelLabel { overflow: hidden; text-overflow: ellipsis; }
  #modelBtn .chip-icon { position: absolute; right: var(--space-2); top: 50%; margin-top: -8px; opacity: 0; pointer-events: none; }
  #modelBtn.iconic { width: var(--control-h); flex: none; }
  #modelBtn.iconic .chip-text { opacity: 0; }
  #modelBtn.iconic .chip-icon { opacity: 1; }
  #modelBtn:hover { background: var(--bg-hover); color: var(--fg); }
  /* UI3 bottom drawer handle: full-bleed bar on the panel's bottom edge while
     the chats are closed (chevron up); the drawer's top edge once open (down). */
  .drawer { display: grid; place-items: center; width: calc(100% + 2 * var(--space-4)); height: 24px; margin: var(--space-3) calc(-1 * var(--space-4)) 0; padding: 0; background: var(--bg-2); color: var(--fg-2); border-top: 1px solid var(--border); border-radius: 0 0 var(--r-lg) var(--r-lg); }
  .drawer[aria-expanded="true"] { border-radius: 0; border-bottom: 1px solid var(--border); }
  .drawer:hover { background: var(--bg-3); color: var(--fg); }
  .drawer svg { transition: transform 160ms var(--ease-out); }
  .drawer[aria-expanded="true"] svg { transform: rotate(180deg); }

  /* ---------- compact bar (48px; 32px controls leave 8px above/below) */
  #compact { display: none; height: 100%; align-items: center; gap: var(--space-2); padding: 0 var(--space-2) 0 var(--space-3); }
  body.compact #app { display: none; }
  body.compact #compact { display: flex; }
  #cprompt { flex: 1; min-width: 0; height: var(--control-h); }
  #cactivity { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg-2); }
  /* Unread: something happened while collapsed (non-color cue: the dot + label). */
  #expand { position: relative; }
  #expand.unread::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-fg); }

  /* Pointer-only resize corner (24px target). Keyboard users have Collapse /
     Expand; Figma's own window frame also resizes. */
  #grip { position: absolute; right: 0; bottom: 0; width: 24px; height: 24px; display: grid; place-items: center; cursor: nwse-resize; z-index: 25; color: var(--fg-2); touch-action: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .dots i { opacity: 0.7; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon" id="menuBtn" title="Menu" aria-label="Menu" aria-haspopup="menu" aria-expanded="false" aria-controls="mainMenu"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
    <button id="chatTitle" title="Rename chat">New chat</button>
    <button class="icon" id="collapse" title="Collapse to a bar" aria-label="Collapse to a bar"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 2.5L7 7M7 3v4H3M13.5 13.5L9 9M9 13V9h4"/></svg></button>
  </header>
  <div id="stage">
    <div id="stack">
      <div id="convo">
        <div id="log" class="scroll" role="log" aria-live="polite" aria-label="Conversation"></div>
        <footer class="composer" id="composer">
          <div class="ctx empty" id="ctxRow"><span id="ctx"></span><button type="button" id="ctxX" hidden></button></div>
          <div class="box">
            <textarea id="prompt" rows="2" aria-label="Message" placeholder="Ask the agent to work on this board…"></textarea>
            <div class="box-row">
              <span class="spacer"></span>
              <button id="modelBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="modelMenu" aria-label="Model: none"><span class="chip-text" aria-hidden="true"><span id="modelLabel">No model</span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3.5 5l2.5 2.5L8.5 5"/></svg></span><svg class="chip-icon" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6.5 4.5Q7.1 8.9 11.5 9.5Q7.1 10.1 6.5 14.5Q5.9 10.1 1.5 9.5Q5.9 8.9 6.5 4.5Z"/><path d="M12 1.25Q12.33 3.67 14.75 4Q12.33 4.33 12 6.75Q11.67 4.33 9.25 4Q11.67 3.67 12 1.25Z"/><path d="M13 10.75Q13.21 12.29 14.75 12.5Q13.21 12.71 13 14.25Q12.79 12.71 11.25 12.5Q12.79 12.29 13 10.75Z"/></svg></button>
              <button class="round" id="go" title="Send (↩)" aria-label="Send"></button>
            </div>
          </div>
          <button type="button" class="drawer" id="chatsHandle" aria-expanded="false" aria-controls="chats" aria-label="Show chats" title="Chats"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5l3-3 3 3"/></svg></button>
        </footer>
      </div>
      <section id="chats" aria-label="Chats" inert>
        <input id="search" type="search" placeholder="Search this board's chats" spellcheck="false" aria-label="Search chats" />
        <div class="chats-label" id="navLabel" hidden></div>
        <div id="chatList" class="scroll"></div>
      </section>
    </div>
  </div>
  <div id="mainMenu" class="pop" hidden role="menu">
    <button class="item" id="newChat" role="menuitem">New chat</button>
    <button class="item" id="menuChats" role="menuitem">Chats</button>
    <button class="item" id="menuSettings" role="menuitem">Settings…</button>
    <div class="sep" id="versionSep" role="separator" hidden></div>
    <div class="label" id="version" role="none" hidden></div>
  </div>
  <div id="settingsPop" class="pop" hidden role="dialog" aria-modal="false" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">Settings</h2>
    <label class="field"><span>Maximal</span><input id="baseUrl" spellcheck="false" /></label>
    <label class="field"><span>API key</span><input id="apiKey" type="password" placeholder="Only if required" spellcheck="false" /></label>
    <label class="check-row"><input type="checkbox" id="remote" /><span>Let Claude Code drive this board<small id="bridgeStatus">Connects to the bridge on localhost:4150</small></span></label>
    <div class="bridge-row"><button type="button" class="btn" id="bridgeAct" hidden></button></div>
    <label class="check-row"><input type="checkbox" id="allowRunCode" /><span>Allow run_code<small>Agents may run arbitrary Plugin API code on this board</small></span></label>
    <div class="field" role="group" aria-labelledby="figmaTokenLabel">
      <label id="figmaTokenLabel" for="figmaToken">Figma access token</label>
      <div class="token-row">
        <input id="figmaToken" type="password" autocomplete="off" spellcheck="false" placeholder="Paste a token" aria-describedby="figmaTokenStatus figmaTokenHelp" />
        <button type="button" class="btn" id="figmaTokenSave">Save</button>
        <button type="button" class="btn" id="figmaTokenClear" hidden>Clear</button>
      </div>
      <small id="figmaTokenStatus" role="status">No token saved</small>
      <small id="figmaTokenHelp">For comments. Grant file_comments:read, file_comments:write and file_content:read; the token stays on this computer in Figma's plugin storage.</small>
      <a id="figmaTokenLink" href="https://www.figma.com/settings" title="Opens Figma's settings: Security → Personal access tokens">Create a token in Figma</a>
    </div>
    <div class="pop-foot"><span class="spacer"></span><button type="button" class="btn primary" id="saveSettings">Save and reconnect</button></div>
  </div>
  <div id="modelMenu" class="pop" hidden role="menu"></div>
  <div id="rowMenu" class="pop" hidden role="menu">
    <button class="item" id="rowRename" role="menuitem">Rename</button>
    <button class="item danger" id="rowDelete" role="menuitem">Delete</button>
  </div>
  <div id="grip" title="Resize (drag)" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor"><path d="M12 5L5 12M12 9L9 12"/></svg></div>
</div>
<div id="netLive" class="sr" role="status" aria-live="polite"></div>
<div id="compact">
  <input id="cprompt" placeholder="Ask the agent…" spellcheck="false" aria-label="Prompt" />
  <span id="cactivity" hidden></span>
  <button class="round" id="cgo" title="Send" aria-label="Send"></button>
  <button class="icon" id="expand" title="Expand" aria-label="Expand"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7L2.5 2.5M2.5 6.5v-4h4M9 9l4.5 4.5M13.5 9.5v4h-4"/></svg></button>
</div>

<script>
"use strict";

const DEFAULT_BASE = "http://localhost:4141";
const PREFERRED_MODELS = ["claude-sonnet", "claude-opus", "claude-fable", "gpt-6", "gpt-5"];
const MAX_STEPS = 30;
const BRIDGE_URL = "ws://localhost:4150/plugin";
const EFFORTS = [["low", "Low"], ["medium", "Medium"], ["high", "High"], ["xhigh", "Extra high"], ["max", "Max"]];
const DEFAULT_EFFORT = "high";
const COMPACT = { width: 300, height: 48 };
const DEFAULT_WINDOW = { width: 400, height: 640 };

const SYSTEM = `You are a skilled workshop facilitator and visual thinker working inside a FigJam board through a Figma plugin. You change the board only through the provided tools; changes appear live and each tool call is one undo step (use batch to group several).

Start: call get_board (or get_selection when the user says "this"/"these"). Use node ids from tool results only; never invent ids.

Pick the right element:
- Ideas, votes-to-be, one thought each → stickies (create_stickies, many per call). Vary color by meaning; wide stickies for longer text; hide the author line for facilitator content.
- Flows, processes, architectures → create_shape (DIAMOND decisions, ELLIPSE start/end, ENG_DATABASE stores…) + connect with connections [{from, to, label}] in one call. Magnets auto-pick facing sides; elbowed by default. Label edges ("yes"/"no", verbs).
- Areas / phases / groups → create_section. Grids and comparisons → create_table. Headings → create_text (48–64 board title, 32 section heading, 16–18 body).
- Numbered steps / callouts → create_label pinned to a node. Votes and reactions → stamp (clones a real stamp if one exists, else an emoji stand-in; say which).
- Annotate → draw: pen to circle a cluster (closed loop) or underline; style "highlighter" to highlight. Code → create_code_block. Links/images → create_link, create_image.
- Comments → get_comments reads the board's comment threads (with the node each is pinned to); add_comment posts one (pinned with nodeId, or a reply with replyTo) and react_to_comment adds an emoji, but only when the user asks. They need the user's Figma access token; if a tool says there's none, tell the user to add one in Settings → Figma access token. You can't resolve, edit or delete comments: the user does that in Figma.

Layout rules: omit x/y to place in free space (or below content with sectionId; section coordinates are relative). Flows: shapes ≥ 160×80, text 16–18px, gaps ≥ 64px so connectors read as arrows, nodes on a grid with no crossings. Sections wrap their content evenly (fit_section). Use align, distribute, arrange_grid.

Color must mean something: pick one scheme per artifact (stage, status, owner or sentiment), keep it consistent, use ≤ 4 hues + a neutral, and add a small legend when color carries meaning; otherwise use one neutral color. Sticky defaults: green=positive, pink=concern, red=blocker, blue=discussion, violet=idea, yellow=question, teal=decision.

Pages: when the user asks for something new and large (a workshop, a diagram, a plan), make it on its own page: create_page with a meaningful name (it switches to it). Rename vague pages ("Page 1") with rename_page. list_pages/switch_page to move around.

Review in passes before you finish:
1. review_layout on what you made; fix every issue it lists.
2. export_png and look critically: balance, whitespace, hierarchy, readable text at 100% zoom, arrow lengths, color meaning. Fix what's off.
3. review_layout again until clean.

Finish: focus on what you made, call get_link for it, and reply with a short summary that includes the links. If get_link has no URL, ask the user for the board's share link and call set_board_url.

Other: get_node for detail, find_nodes to search; update_node/style_text/set_link to edit. run_code (only if offered) is a last resort. Don't delete or rewrite content the user didn't ask you to change.`;

const ICON_SEND = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 11.5v-9M3 6.5l4-4 4 4"/></svg>';
const ICON_STOP = '<svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" rx="1.5" fill="currentColor"/></svg>';
const ICON_CARET = '<svg class="caret" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"><path d="M3.5 2l3 3-3 3"/></svg>';

// Tool schemas come from code.js on init (single source of truth); run_code
// is only offered to the model when "Allow run_code" is on.
let allTools = [];
let TOOLS = [];

// ---------------------------------------------------------------- state

const $ = (id) => document.getElementById(id);
const els = {
  chatTitle: $("chatTitle"), baseUrl: $("baseUrl"), apiKey: $("apiKey"),
  log: $("log"), ctx: $("ctx"), ctxRow: $("ctxRow"), ctxX: $("ctxX"), netLive: $("netLive"), prompt: $("prompt"), go: $("go"), cgo: $("cgo"), cprompt: $("cprompt"), cactivity: $("cactivity"),
  newChat: $("newChat"), saveSettings: $("saveSettings"), remote: $("remote"),
  allowRunCode: $("allowRunCode"), version: $("version"), versionSep: $("versionSep"), search: $("search"), chatList: $("chatList"), navLabel: $("navLabel"),
  modelBtn: $("modelBtn"), modelLabel: $("modelLabel"), modelMenu: $("modelMenu"), settingsPop: $("settingsPop"),
  menuBtn: $("menuBtn"), mainMenu: $("mainMenu"), menuChats: $("menuChats"), menuSettings: $("menuSettings"),
  bridgeStatus: $("bridgeStatus"), bridgeAct: $("bridgeAct"), rowMenu: $("rowMenu"),
  stage: $("stage"), stack: $("stack"), composer: $("composer"), chats: $("chats"), chatsHandle: $("chatsHandle"),
  collapse: $("collapse"), expand: $("expand"), grip: $("grip"),
  figmaToken: $("figmaToken"), figmaTokenSave: $("figmaTokenSave"), figmaTokenClear: $("figmaTokenClear"),
  figmaTokenStatus: $("figmaTokenStatus"), figmaTokenLink: $("figmaTokenLink"),
};

let settings = { baseUrl: DEFAULT_BASE, apiKey: "", model: "", effort: DEFAULT_EFFORT, remote: false, allowRunCode: false, bridgeToken: "", bridgeClientId: "" };
let pluginInfo = {};
let messages = [];
let selection = [];
let fileInfo = {};
let boardId = "";
let running = false;
let abort = null;
const pendingTools = new Map();
let toolSeq = 0;
let models = []; // [{id, name}]
let modelId = "";
let effort = DEFAULT_EFFORT;
let connState = { text: "Starting the plugin…", state: "", short: "Starting the plugin…" };
// Messages typed while the agent runs: [{ text (sent to the model), raw (typed), el (bubble) }].
let queue = [];
// The user excluded the current selection from the next message (reset when the selection changes).
let ctxExcluded = false;
let selKey = "";

let chat = null; // current chat meta {id, title, createdAt}
let chats = []; // index for this board
let searchResults = null; // null when not searching
let storeOnline = false; // paired bridge socket answering chat requests

// ---------------------------------------------------------------- plugin bridge

function post(msg) {
  parent.postMessage({ pluginMessage: msg }, "*");
}

function saveSettings() {
  post({ type: "save-settings", settings });
}

function versionLine() {
  if (!pluginInfo.version) return "";
  const loaded = pluginInfo.loadedAt
    ? new Date(pluginInfo.loadedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
    : "";
  return `Agent v${pluginInfo.version} · build ${pluginInfo.build}${loaded ? ` · loaded ${loaded}` : ""}`;
}

const HINT = "Ask for anything on this board — e.g. “Make a retro with three sections and a few starter stickies” or “Group the selected stickies by theme.”";

// Empty state: one hint.
function welcome() {
  const div = document.createElement("div");
  div.className = "hint";
  div.textContent = HINT;
  els.log.append(div);
}

function clearHint() {
  for (const h of els.log.querySelectorAll(".hint")) h.remove();
}

function applyToolGate() {
  TOOLS = allTools.filter((t) => t.name !== "run_code" || settings.allowRunCode);
}

// code.js asks the panel to fetch image bytes (only hosts the manifest allows).
async function fetchForSandbox(msg) {
  try {
    const res = await fetch(msg.url, { signal: AbortSignal.timeout(15000) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const bytes = new Uint8Array(await res.arrayBuffer());
    post({ type: "fetch-result", id: msg.id, ok: true, bytes });
  } catch (error) {
    post({ type: "fetch-result", id: msg.id, ok: false, error: error.message });
  }
}

// Long strings (image base64) are shortened for the transcript.
function forDisplay(value) {
  return JSON.stringify(value, (key, v) => (typeof v === "string" && v.length > 2000 ? `…(${v.length} chars)` : v), 2);
}

function imagesOf(result) {
  return result && Array.isArray(result.images) ? result.images.filter((i) => typeof i.base64 === "string") : [];
}

// Tool result content for the model: export_png images become image blocks.
function toolResultContent(out) {
  if (!out.ok) return out.error;
  const images = imagesOf(out.result);
  if (images.length === 0) return JSON.stringify(out.result);
  const meta = Object.assign({}, out.result, {
    images: out.result.images.map((i) => Object.assign({}, i, { base64: undefined })),
  });
  const blocks = [{ type: "text", text: JSON.stringify(meta) }];
  for (const img of images) {
    if (img.base64.length > 5_000_000) {
      blocks.push({ type: "text", text: `Image ${img.id} is too large to attach (${img.bytes} bytes); export with a smaller maxDimension.` });
      continue;
    }
    blocks.push({ type: "image", source: { type: "base64", media_type: img.format === "JPG" ? "image/jpeg" : "image/png", data: img.base64 } });
  }
  return blocks;
}

// actor tags the board changes a call makes: "panel:<session>" for the
// panel's own agent, "agent:<name>" for calls relayed by the bridge.
function runTool(name, input, actor) {
  const id = `t${++toolSeq}`;
  return new Promise((resolve) => {
    pendingTools.set(id, resolve);
    post({ type: "tool", id, name, input, actor: actor || `panel:${SESSION}` });
  });
}

// Requests to the sandbox's chat store (offline fallback) resolve on the
// next reply of the expected type.
const waiters = [];
function sandboxRequest(msg, replyType, match) {
  return new Promise((resolve, reject) => {
    const w = { replyType, match, resolve, reject };
    w.timer = setTimeout(() => { waiters.splice(waiters.indexOf(w), 1); reject(new Error("The plugin didn't answer")); }, 8000);
    waiters.push(w);
    post(msg);
  });
}
function settleWaiters(msg) {
  for (let i = 0; i < waiters.length; i++) {
    const w = waiters[i];
    if (msg.type === "chats-error" || (msg.type === w.replyType && (!w.match || w.match(msg)))) {
      waiters.splice(i, 1);
      clearTimeout(w.timer);
      if (msg.type === "chats-error") w.reject(new Error(msg.error || "Chat storage failed"));
      else w.resolve(msg);
      return;
    }
  }
}

window.onmessage = (event) => {
  const msg = event.data && event.data.pluginMessage;
  if (!msg) return;
  if (msg.type === "init") {
    settings = Object.assign({}, settings, msg.settings);
    fileInfo = msg.file || {};
    boardId = msg.boardId || fileInfo.boardId || "";
    selection = msg.selection || [];
    pluginInfo = msg.plugin || {};
    allTools = Array.isArray(msg.tools) ? msg.tools : [];
    applyToolGate();
    effort = settings.effort || DEFAULT_EFFORT;
    els.baseUrl.value = settings.baseUrl;
    els.apiKey.value = settings.apiKey || "";
    delete settings.pairingCode; // pairing v1 leftover
    els.allowRunCode.checked = Boolean(settings.allowRunCode);
    els.remote.checked = Boolean(settings.remote);
    renderFigmaToken(msg.figmaToken);
    els.version.textContent = versionLine();
    els.version.hidden = els.versionSep.hidden = !els.version.textContent;
    applyWindowMode(settings.window && settings.window.mode === "compact" ? "compact" : "expanded", false);
    els.log.replaceChildren();
    welcome();
    showContext();
    if (Array.isArray(msg.chats)) { chats = msg.chats; renderChats(); }
    if (msg.problem) add("error", msg.problem);
    if (settings.remote) openBridge();
    refreshChats();
    connect();
  } else if (msg.type === "selection") {
    selection = msg.selection || [];
    showContext();
  } else if (msg.type === "page") {
    fileInfo = msg.file || fileInfo;
    selection = msg.selection || [];
    showContext();
    sendBoard();
  } else if (msg.type === "fetch") {
    fetchForSandbox(msg);
  } else if (msg.type === "figma-token") {
    renderFigmaToken(msg);
  } else if (msg.type === "tool-result") {
    const resolve = pendingTools.get(msg.id);
    const target = msg.result && msg.result.target;
    if (target && target.pageName && target.pageName !== agentPage) { agentPage = String(target.pageName); showContext(); }
    if (resolve) {
      pendingTools.delete(msg.id);
      resolve(msg);
    }
  } else if (msg.type === "changes") {
    // Board change feed from the sandbox; the bridge keeps it for agents.
    if (bridge && bridge.readyState === WebSocket.OPEN) bridge.send(JSON.stringify(msg));
  } else if (msg.type === "chats" || msg.type === "chat" || msg.type === "chats-error") {
    if (msg.type === "chats" && !storeOnline && Array.isArray(msg.chats)) { chats = msg.chats; renderChats(); }
    settleWaiters(msg);
  }
};

// ---------------------------------------------------------------- chat store
//
// Primary: the paired bridge socket (SQLite on disk), {type:"chats", op,
// reqId} -> {type:"chats-reply", reqId, ok, ...}. Fallback (socket not paired,
// or no reply in 10 s): the sandbox's figma.clientStorage via chat-* messages.

const chatReplies = new Map(); // reqId -> { resolve, reject, timer }
let chatReqSeq = 0;
let bridgePaired = false;

function bridgeChats(op, args) {
  return new Promise((resolve, reject) => {
    const ws = bridge;
    if (!ws || !bridgePaired || ws.readyState !== WebSocket.OPEN) return reject(new Error("Bridge not paired"));
    const reqId = `q${++chatReqSeq}`;
    const timer = setTimeout(() => { chatReplies.delete(reqId); reject(new Error("The bridge didn't answer")); }, 10000);
    chatReplies.set(reqId, { resolve, reject, timer });
    ws.send(JSON.stringify(Object.assign({ type: "chats", op, reqId }, args || {})));
  }).then((body) => { storeOnline = true; return body; });
}

function settleChatReply(msg) {
  const w = chatReplies.get(msg.reqId);
  if (!w) return;
  chatReplies.delete(msg.reqId);
  clearTimeout(w.timer);
  if (msg.ok) return w.resolve(msg);
  const err = new Error(msg.error || "Chat storage failed");
  err.status = msg.status || 500;
  w.reject(err);
}

// The socket closed: pending requests fall back to the sandbox store.
function failChatReplies() {
  for (const [reqId, w] of chatReplies) { clearTimeout(w.timer); w.reject(new Error("Bridge disconnected")); chatReplies.delete(reqId); }
}

// No paired bridge (or it timed out) → fall back; an error reply from a live bridge is real.
function offline(error) {
  if (error && error.status) return false;
  storeOnline = false;
  return true;
}

const store = {
  async list() {
    try { return (await bridgeChats("list", { boardId })).chats || []; }
    catch (e) { if (!offline(e)) throw e; return (await sandboxRequest({ type: "chats-list" }, "chats")).chats || []; }
  },
  async search(q) {
    try { return (await bridgeChats("search", { q, boardId })).results || []; }
    catch (e) {
      if (!offline(e)) throw e;
      const needle = q.toLowerCase();
      return chats.filter((c) => (c.title || "").toLowerCase().includes(needle));
    }
  },
  async load(id) {
    try { return (await bridgeChats("get", { id })).chat; }
    catch (e) {
      if (!offline(e)) throw e;
      const r = await sandboxRequest({ type: "chat-load", id }, "chat", (m) => m.id === id);
      if (!r.chat) throw new Error(r.error || "Chat not found");
      return r.chat;
    }
  },
  async save(record) {
    try {
      const body = await bridgeChats("put", { id: record.id, chat: record });
      upsertChat(body.chat);
    } catch (e) {
      if (!offline(e)) throw e;
      chats = (await sandboxRequest({ type: "chat-save", chat: record }, "chats")).chats || chats;
      renderChats();
    }
  },
  async rename(id, title) {
    try { upsertChat((await bridgeChats("rename", { id, title })).chat); }
    catch (e) {
      if (!offline(e)) throw e;
      chats = (await sandboxRequest({ type: "chat-rename", id, title }, "chats")).chats || chats;
      renderChats();
    }
  },
  async remove(id) {
    try { await bridgeChats("delete", { id }); chats = chats.filter((c) => c.id !== id); renderChats(); }
    catch (e) {
      if (!offline(e)) throw e;
      chats = (await sandboxRequest({ type: "chat-delete", id }, "chats")).chats || chats;
      renderChats();
    }
  },
};

function upsertChat(entry) {
  if (!entry || !entry.id) return;
  chats = [entry].concat(chats.filter((c) => c.id !== entry.id));
  chats.sort((a, b) => toMs(b.updatedAt) - toMs(a.updatedAt));
  renderChats();
}

async function refreshChats() {
  try { chats = await store.list(); renderChats(); }
  catch (error) { console.warn("chats", error); }
}

function newChatId() {
  return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function titleFrom(text) {
  const t = text.replace(/\s+/g, " ").trim();
  return t.length > 60 ? `${t.slice(0, 59).trimEnd()}…` : t;
}

// Saves run one at a time so an older snapshot never lands after a newer one.
let saveChain = Promise.resolve();
function saveChat() {
  if (!chat || messages.length === 0) return;
  const record = {
    id: chat.id, title: chat.title, createdAt: chat.createdAt, model: modelId, effort,
    boardId, boardName: fileInfo.name || "", messages: messages.slice(),
  };
  saveChain = saveChain.then(() => store.save(record)).catch((error) => console.warn("chat save failed", error));
}

// Title typed in the header before the chat exists; the first send uses it.
let pendingTitle = "";

function setChatTitle() {
  els.chatTitle.textContent = chat ? chat.title : (pendingTitle || "New chat");
  els.chatTitle.title = "Rename chat";
}

function editChatTitle() {
  if (els.chatTitle.hidden) return;
  const input = document.createElement("input");
  input.id = "titleInput";
  input.value = chat ? chat.title : pendingTitle;
  input.placeholder = "New chat";
  input.spellcheck = false;
  input.setAttribute("aria-label", "Chat title");
  els.chatTitle.hidden = true;
  els.chatTitle.after(input);
  input.focus();
  input.select();
  let done = false;
  const finish = (commit, refocus) => {
    if (done) return;
    done = true;
    const title = input.value.trim();
    input.remove();
    els.chatTitle.hidden = false;
    if (commit && title) {
      if (!chat) pendingTitle = title;
      else if (title !== chat.title) {
        chat.title = title;
        const c = chats.find((x) => x.id === chat.id);
        if (c) {
          c.title = title;
          renderChats();
          store.rename(chat.id, title).catch((e) => add("error", `Rename failed: ${e.message}`));
        } else saveChat();
      }
    }
    setChatTitle();
    if (refocus) els.chatTitle.focus();
  };
  input.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); finish(true, true); }
    else if (e.key === "Escape") { e.stopPropagation(); finish(false, true); }
  };
  input.onblur = () => finish(true, false);
}

function startNewChat() {
  if (running) return;
  messages = [];
  chat = null;
  pendingTitle = "";
  setChatTitle();
  agentPage = "";
  showContext();
  chipSetIdle(false);
  els.log.replaceChildren();
  welcome();
  renderChats();
  closeChats();
  els.prompt.focus();
}

async function openChat(id) {
  if (running) return;
  closeChats();
  try {
    const record = await store.load(id);
    chat = { id: record.id, title: record.title || "Untitled", createdAt: record.createdAt };
    messages = Array.isArray(record.messages) ? record.messages : [];
    if (record.model && models.some((m) => m.id === record.model)) modelId = record.model;
    if (record.effort) effort = record.effort;
    showModel();
    chipSetIdle(messages.length > 0);
    setChatTitle();
    renderTranscript();
    renderChats();
  } catch (error) {
    add("error", `Couldn't open that chat: ${error.message}`);
  }
}

// ---------------------------------------------------------------- nav

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Only <mark> survives from the bridge's FTS snippet.
function snippetHtml(s) {
  return escapeHtml(s).replace(/&lt;(\/?)mark&gt;/g, "<$1mark>");
}

function toMs(t) {
  return typeof t === "number" ? t : Date.parse(t || "") || 0;
}

const RTF = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
function ago(t) {
  const ms = toMs(t);
  if (!ms) return "";
  const s = (ms - Date.now()) / 1000;
  const a = Math.abs(s);
  if (a < 45) return "just now";
  const [v, unit] = a < 3600 ? [s / 60, "minute"] : a < 86400 ? [s / 3600, "hour"]
    : a < 86400 * 30 ? [s / 86400, "day"] : a < 86400 * 365 ? [s / (86400 * 30), "month"] : [s / (86400 * 365), "year"];
  return RTF.format(Math.round(v) || -1, unit);
}

let renamingId = null;

function renderChats() {
  const list = searchResults || chats;
  els.navLabel.textContent = searchResults ? `${list.length} result${list.length === 1 ? "" : "s"}` : "";
  els.navLabel.hidden = !searchResults;
  els.chatList.replaceChildren();
  if (list.length === 0) {
    const empty = document.createElement("div");
    empty.className = "nav-empty";
    empty.textContent = searchResults ? "No matching chats." : "No chats yet.";
    els.chatList.append(empty);
    return;
  }
  for (const c of list) {
    const row = document.createElement("div");
    row.className = `chat-row${chat && chat.id === c.id ? " active" : ""}`;
    if (renamingId === c.id) {
      const input = document.createElement("input");
      input.value = c.title || "";
      input.setAttribute("aria-label", "Chat title");
      let done = false;
      const finish = (commit) => {
        if (done) return;
        done = true;
        renamingId = null;
        const title = input.value.trim();
        if (commit && title && title !== c.title) {
          c.title = title;
          if (chat && chat.id === c.id) { chat.title = title; setChatTitle(); }
          store.rename(c.id, title).catch((e) => add("error", `Rename failed: ${e.message}`));
        }
        renderChats();
      };
      input.onkeydown = (e) => {
        if (e.key === "Enter") finish(true);
        else if (e.key === "Escape") finish(false);
      };
      input.onblur = () => finish(true);
      row.append(input);
      els.chatList.append(row);
      setTimeout(() => { input.focus(); input.select(); });
      continue;
    }
    const open = document.createElement("button");
    open.className = "open";
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = c.title || "Untitled";
    const s = document.createElement("span");
    s.className = "s";
    if (c.snippet) s.innerHTML = snippetHtml(c.snippet);
    else s.textContent = ago(c.updatedAt);
    open.append(t, s);
    open.title = c.title || "";
    open.onclick = () => openChat(c.id);
    const more = document.createElement("button");
    more.className = "icon more";
    more.setAttribute("aria-label", "Chat actions");
    more.setAttribute("aria-haspopup", "menu");
    more.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="4" cy="8" r="1"/><circle cx="8" cy="8" r="1"/><circle cx="12" cy="8" r="1"/></svg>';
    more.onclick = (e) => { e.stopPropagation(); openRowMenu(c, more); };
    row.append(open, more);
    els.chatList.append(row);
  }
}

let rowMenuChat = null;
let rowMenuAnchor = null;
let deleteArmed = false;

function openRowMenu(c, anchor) {
  closePops();
  rowMenuChat = c;
  rowMenuAnchor = anchor;
  deleteArmed = false;
  $("rowDelete").textContent = "Delete";
  anchor.setAttribute("aria-expanded", "true");
  popOpener = anchor;
  placePop(els.rowMenu, anchor, "below");
  focusFirst(els.rowMenu);
}

$("rowRename").onclick = () => {
  const c = rowMenuChat;
  closePops();
  if (!c) return;
  renamingId = c.id;
  renderChats();
};
// Figma blocks confirm(), so delete asks for a second click.
$("rowDelete").onclick = (e) => {
  e.stopPropagation();
  const c = rowMenuChat;
  if (!c) return;
  if (!deleteArmed) {
    deleteArmed = true;
    $("rowDelete").textContent = "Click again to delete";
    $("rowDelete").focus();
    return;
  }
  closePops();
  if (running && chat && chat.id === c.id) return;
  store.remove(c.id).then(() => {
    if (searchResults) searchResults = searchResults.filter((r) => r.id !== c.id);
    if (chat && chat.id === c.id) startNewChat();
    else renderChats();
  }).catch((err) => add("error", `Delete failed: ${err.message}`));
};

let searchTimer = null;
let searchSeq = 0;
els.search.oninput = () => {
  clearTimeout(searchTimer);
  const q = els.search.value.trim();
  if (!q) { searchResults = null; renderChats(); return; }
  searchTimer = setTimeout(async () => {
    const seq = ++searchSeq;
    try {
      const results = await store.search(q);
      if (seq === searchSeq && els.search.value.trim()) { searchResults = results; renderChats(); }
    } catch (error) {
      if (seq === searchSeq) { searchResults = []; renderChats(); }
    }
  }, 250);
};

// ---------------------------------------------------------------- chats reveal
//
// Default: header / conversation / selection hint + input; the chats list
// waits below the bottom edge. Scrolling down past the end of the
// conversation (with a little resistance) slides the stack up until the
// input sits under the header and the chats list fills the rest.

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
const reveal = { open: false, off: 0, pull: 0, idle: null };
const PULL_DEAD = 48; // px of wheel delta ignored before anything moves
const PULL_DAMP = 0.55;
const PULL_SNAP = 72; // visual px past which a release opens (or closes)

function revealMax() {
  return els.log.offsetHeight;
}

// Wheel delta → visual offset: dead zone, then damped, then 1:1.
function damped(pull, dead) {
  const r = pull - dead;
  if (r <= 0) return 0;
  if (r * PULL_DAMP <= PULL_SNAP) return r * PULL_DAMP;
  return PULL_SNAP + (r - PULL_SNAP / PULL_DAMP);
}

function setOff(px, animate) {
  reveal.off = Math.max(0, Math.min(revealMax(), px));
  els.stack.style.transition = animate && !reduceMotion.matches ? "transform 280ms var(--ease-out)" : "none";
  els.stack.style.transform = reveal.off ? `translateY(${-reveal.off}px)` : "";
}

function openChats(animate = true) {
  clearTimeout(reveal.idle);
  reveal.open = true;
  reveal.pull = 0;
  els.chats.inert = false;
  els.chatsHandle.setAttribute("aria-expanded", "true");
  els.chatsHandle.setAttribute("aria-label", "Hide chats");
  setOff(revealMax(), animate);
}

function closeChats(animate = true) {
  clearTimeout(reveal.idle);
  const was = reveal.open || reveal.off > 0;
  reveal.open = false;
  reveal.pull = 0;
  // Focus inside the list would be lost when it goes inert: hand it to the handle.
  if (els.chats.contains(document.activeElement)) els.chatsHandle.focus({ preventScroll: true });
  els.chats.inert = true;
  els.chatsHandle.setAttribute("aria-expanded", "false");
  els.chatsHandle.setAttribute("aria-label", "Show chats");
  if (was) setOff(0, animate);
}

function settleSoon(fn) {
  clearTimeout(reveal.idle);
  reveal.idle = setTimeout(fn, 160);
}

// Friction: only a scroll gesture that STARTS with the conversation already
// at its end (or with nothing to scroll) may pull the chats up. A gesture that
// scrolls the conversation down to its end stops there; the user lets it come
// to rest and scrolls again. A gesture is a run of wheel events (trackpad
// momentum included) without a pause longer than GESTURE_GAP.
const GESTURE_GAP = 250;
const gesture = { last: 0, mayPull: false };

function noteGesture() {
  const now = performance.now();
  if (now - gesture.last > GESTURE_GAP) {
    const log = els.log;
    const scrollable = log.scrollHeight > log.clientHeight + 2;
    const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 2;
    gesture.mayPull = !scrollable || atEnd;
  }
  gesture.last = now;
}

els.stage.addEventListener("wheel", (e) => {
  if (document.body.classList.contains("compact") || e.ctrlKey) return;
  noteGesture();
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  const max = revealMax();
  if (!reveal.open) {
    const log = els.log;
    const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 2;
    if (reveal.pull === 0 && (dy <= 0 || !atBottom || !gesture.mayPull)) return;
    e.preventDefault();
    reveal.pull = Math.max(0, reveal.pull + dy);
    setOff(damped(reveal.pull, PULL_DEAD), false);
    if (reveal.off >= max) return openChats(false);
    settleSoon(() => (reveal.off > PULL_SNAP ? openChats() : closeChats()));
    return;
  }
  // Open: the list scrolls normally; scrolling up past its top heads back.
  const inList = e.target.closest && e.target.closest("#chatList");
  const listAtTop = !inList || els.chatList.scrollTop <= 0;
  if (reveal.pull === 0 && (dy >= 0 || !listAtTop)) return;
  e.preventDefault();
  reveal.pull = Math.max(0, reveal.pull - dy);
  setOff(max - damped(reveal.pull, PULL_DEAD / 2), false);
  if (reveal.off <= 0) return closeChats(false);
  settleSoon(() => (max - reveal.off > PULL_SNAP ? closeChats() : openChats()));
}, { passive: false });

els.chatsHandle.onclick = () => (reveal.open ? closeChats() : openChats());

// Keep the input pinned under the header when it grows or the window resizes.
new ResizeObserver(() => {
  els.stage.style.setProperty("--composer-h", `${els.composer.offsetHeight}px`);
  if (reveal.open) setOff(revealMax(), false);
}).observe(els.composer);
new ResizeObserver(() => { if (reveal.open) setOff(revealMax(), false); }).observe(els.stage);

// Scrollbar thumbs show while scrolling (and on hover, in CSS).
for (const el of [els.log, els.chatList]) {
  let t = null;
  el.addEventListener("scroll", () => {
    el.classList.add("scrolling");
    clearTimeout(t);
    t = setTimeout(() => el.classList.remove("scrolling"), 900);
  }, { passive: true });
}

// ---------------------------------------------------------------- popovers

function placePop(pop, anchor, where) {
  pop.hidden = false;
  const app = $("app").getBoundingClientRect();
  const a = anchor.getBoundingClientRect();
  const w = pop.offsetWidth;
  const h = pop.offsetHeight;
  let left = Math.min(Math.max(8, a.right - w), app.width - w - 8);
  let top = where === "above" ? a.top - h - 4 : a.bottom + 4;
  if (top + h > app.height - 8) top = Math.max(8, a.top - h - 4);
  if (top < 8) top = 8;
  pop.style.left = `${Math.max(8, left)}px`;
  pop.style.top = `${top}px`;
}

// The control that opened the current popover; focus goes back to it on close.
let popOpener = null;
const POPS = () => [els.modelMenu, els.rowMenu, els.settingsPop, els.mainMenu];
const popOpen = () => POPS().some((p) => !p.hidden);

function focusFirst(menu) {
  const item = menu.querySelector("[aria-checked=\"true\"]:not(:disabled)") || menu.querySelector("[role^=\"menuitem\"]:not(:disabled)");
  if (item) item.focus();
}

// restore: put focus back on the opener (keyboard close, item chosen); a
// click elsewhere passes false so focus lands where the user clicked.
function closePops(restore = true) {
  const wasOpen = popOpen();
  const focusInside = POPS().some((p) => p.contains(document.activeElement));
  const modelWasOpen = !els.modelMenu.hidden;
  for (const p of POPS()) p.hidden = true;
  if (modelWasOpen) chipRelease();
  els.menuBtn.setAttribute("aria-expanded", "false");
  els.modelBtn.setAttribute("aria-expanded", "false");
  if (rowMenuAnchor) rowMenuAnchor.setAttribute("aria-expanded", "false");
  rowMenuAnchor = null;
  const opener = popOpener;
  popOpener = null;
  if (wasOpen && restore && (focusInside || document.activeElement === document.body) && opener) {
    if (opener.isConnected && opener.offsetParent) opener.focus();
    else els.prompt.focus();
  }
}

document.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".pop, #menuBtn, #modelBtn, .more")) return;
  closePops(false);
});
document.addEventListener("keydown", (e) => {
  const menu = e.target.closest && e.target.closest(".pop[role=\"menu\"]");
  if (menu && ["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key)) {
    const items = [...menu.querySelectorAll("[role^=\"menuitem\"]:not(:disabled)")];
    if (!items.length) return;
    e.preventDefault();
    const i = items.indexOf(document.activeElement);
    const n = items.length;
    const next = e.key === "Home" ? 0 : e.key === "End" ? n - 1 : e.key === "ArrowDown" ? (i + 1) % n : (i - 1 + n) % n;
    items[next].focus();
    return;
  }
  // Tab leaves a menu: close it and continue from the opener.
  if (menu && e.key === "Tab") { closePops(true); return; }
  if (e.key === "Escape") {
    if (popOpen()) { e.preventDefault(); closePops(true); return; }
    if (reveal.open && !e.target.closest("input, textarea")) closeChats();
  }
});

els.chatTitle.onclick = editChatTitle;

els.menuBtn.onclick = () => {
  const open = els.mainMenu.hidden;
  closePops();
  if (!open) return;
  els.newChat.disabled = running;
  placePop(els.mainMenu, els.menuBtn, "below");
  els.menuBtn.setAttribute("aria-expanded", "true");
  popOpener = els.menuBtn;
  focusFirst(els.mainMenu);
};
els.menuChats.onclick = () => { closePops(); openChats(); els.search.focus({ preventScroll: true }); };
// Settings is a non-modal dialog: focus moves in; Escape, Save or a click
// outside closes it and focus returns to whatever opened it.
function openSettings(field, opener) {
  closePops(false);
  els.settingsPop.hidden = false;
  popOpener = opener || els.menuBtn;
  (field || els.baseUrl).focus();
}
els.menuSettings.onclick = () => openSettings();

// ---------------------------------------------------------------- connection
// One model for both links (Maximal and the bridge). Every transition goes
// through setNet -> renderNet, which paints the state into the input itself
// (placeholder, enabled, send/Reconnect button), Settings' bridge line, and
// announces state changes (not countdowns) in the #netLive status region.
//   maximal: checking | ok | down {hint, attempt, nextAt}
//   bridge:  off | connecting {attempt} | pending {name, expiresAt} | connected
//            | retrying {attempt, nextAt, why} | denied | expired | unpaired
//            | replaced | blocked {error}
const BACKOFF = [1000, 2000, 4000, 8000, 15000];
const backoff = (attempt) => BACKOFF[Math.min(Math.max(attempt, 1), BACKOFF.length) - 1];
const NET_DEBOUNCE = 1500; // bridge blips shorter than this never reach the input
const net = { maximal: { s: "checking" }, bridge: { s: "off" } };
let netSince = 0; // when the current bridge trouble started; 0 = healthy
let netTimer = null;
let netShown = null; // the bridge issue the input is showing, if any
let netSaid = ""; // key of the last state announced
const BRIDGE_IDLE = "Connects to the bridge on localhost:4150";

function setNet(part, s, extra) {
  net[part] = Object.assign({}, extra, { s });
  renderNet();
}

const secsTo = (at) => Math.max(0, Math.ceil((at - Date.now()) / 1000));
const countdown = (p) => (p.nextAt && secsTo(p.nextAt) > 0 ? `retrying in ${secsTo(p.nextAt)}s` : "retrying…");
const clip = (s, n) => (s.length > n ? `${s.slice(0, n - 1).trimEnd()}…` : s);
const mmss = (at) => { const s = secsTo(at); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

// Maximal down or still connecting: the input can't be used and says why.
function maximalIssue() {
  const m = net.maximal;
  if (m.s === "down") return { text: `${clip(m.hint, 24)} · ${countdown(m)}`, say: `${m.hint}. Retrying automatically.`, key: `m:${m.hint}` };
  if (m.s === "checking") return { text: "Connecting to Maximal…", say: "", key: "m:checking" };
  return null;
}

// Bridge trouble while Maximal works: the agent still runs, only the
// placeholder changes (short, no countdown; Settings has the detail).
function bridgeIssue() {
  if (!settings.remote) return null;
  const b = net.bridge;
  const offline = { text: "Bridge offline · chats saved locally", say: "Bridge offline. Chats are saved locally.", key: "b:offline" };
  switch (b.s) {
    case "connecting":
      return b.attempt ? offline : { text: "Connecting to the bridge…", say: "", key: "b:connecting" };
    case "pending":
      return { text: clip(`Waiting for approval · ${b.name || SESSION}`, 40), say: `Claude Code control is waiting for approval of ${b.name || SESSION}.`, key: "b:pending" };
    case "denied":
      return { text: "Bridge denied this panel", say: "The bridge denied this panel. Chats are saved locally.", key: "b:denied" };
    case "expired":
      return { text: "Approval timed out · see Settings", say: "Bridge approval timed out. Ask again in Settings.", key: "b:expired" };
    case "unpaired":
      return { text: "Panel unpaired · see Settings", say: "This panel was unpaired from the bridge.", key: "b:unpaired" };
    case "retrying":
      if (b.why === "pair-name-in-use") return { text: "Bridge: name in use · retrying", say: "Another panel is using this name. Retrying.", key: "b:name" };
      if (b.why === "pair-busy") return { text: "Bridge busy · retrying", say: "The bridge has too many requests. Retrying.", key: "b:busy" };
      return offline;
    case "blocked":
      return offline;
    default:
      return null;
  }
}

const APPROVE_HINT = (name) => `Approve in Maximal or run: bun figjam.ts approve ${name}`;

// Settings' bridge line + its one action button.
function bridgeStatus() {
  const b = net.bridge;
  const paired = { text: "Paired with this computer ✓", act: "forget" };
  if (!settings.remote) return settings.bridgeToken ? paired : { text: BRIDGE_IDLE, act: "" };
  switch (b.s) {
    case "connected": return { text: `Paired with this computer ✓ · ${SESSION}`, act: "forget" };
    case "connecting": return { text: `${b.attempt ? "Reconnecting" : "Connecting"} to the bridge on localhost:4150…`, act: "" };
    case "pending": return { text: `Waiting for approval${b.expiresAt ? ` (${mmss(b.expiresAt)})` : ""}. ${APPROVE_HINT(b.name || SESSION)}`, act: "ask" };
    case "denied": return { text: "Pairing was denied.", act: "ask" };
    case "expired": return { text: "The approval request timed out.", act: "ask" };
    case "unpaired": return { text: "This panel was unpaired.", act: "ask" };
    case "replaced": return { text: "Another panel for this board took over the bridge connection.", act: "ask" };
    case "retrying": {
      const why = b.why === "pair-name-in-use" ? `Another request already uses the name ${SESSION}`
        : b.why === "pair-busy" ? "The bridge has too many pending requests"
        : "Bridge isn't running on localhost:4150";
      return { text: `${why} · ${countdown(b)} (attempt ${b.attempt})`, act: "retry" };
    }
    case "blocked": return { text: `Bridge blocked: ${b.error}`, act: "retry" };
    default: return { text: BRIDGE_IDLE, act: "" };
  }
}

const setText = (el, text) => { if (el.textContent !== text) el.textContent = text; };

function renderNet() {
  clearTimeout(netTimer);
  netTimer = null;
  const issue = bridgeIssue();
  const now = Date.now();
  if (!issue) netSince = 0;
  else if (!netSince) netSince = now;
  const waiting = Boolean(issue) && now - netSince < NET_DEBOUNCE;
  netShown = issue && !waiting ? issue : null;

  const st = bridgeStatus();
  setText(els.bridgeStatus, st.text);
  els.bridgeAct.hidden = !st.act;
  els.bridgeAct.dataset.act = st.act;
  setText(els.bridgeAct, st.act === "forget" ? "Forget" : st.act === "retry" ? "Retry now" : "Ask again");
  paintInput();
  announceNet();

  const b = net.bridge;
  if (waiting) netTimer = setTimeout(renderNet, NET_DEBOUNCE - (now - netSince));
  else if (net.maximal.s === "down" || b.s === "retrying" || (b.s === "pending" && b.expiresAt)) netTimer = setTimeout(renderNet, 500);
}

// Placeholders aren't announced reliably: say each state change once.
function announceNet() {
  const m = maximalIssue();
  const cur = m && m.key !== "m:checking" ? m : netShown;
  const key = cur ? cur.key : "ok";
  if (key === netSaid) return;
  const was = netSaid;
  netSaid = key;
  const say = cur ? cur.say : was && was !== "b:connecting" ? "Connected." : "";
  if (say) setText(els.netLive, say);
}

// Skip the wait: retry whatever is down right now.
function retryNow() {
  if (net.maximal.s === "down" && net.maximal.nextAt) connect();
  if (settings.remote && !bridge && (net.bridge.s === "retrying" || net.bridge.s === "blocked")) { clearTimeout(bridgeRetry); openBridge(); }
}

els.bridgeAct.onclick = () => {
  const act = els.bridgeAct.dataset.act;
  if (act === "forget") forgetBridge();
  else if (act === "retry") retryNow();
  else askAgain();
};
window.addEventListener("focus", retryNow);
document.addEventListener("visibilitychange", () => { if (!document.hidden) retryNow(); });

// ---------------------------------------------------------------- Maximal

function headers() {
  const h = { "content-type": "application/json", "anthropic-version": "2023-06-01" };
  if (settings.apiKey) h["x-api-key"] = settings.apiKey;
  return h;
}

function setStatus(text, state, short) {
  connState = { text, state: state || "", short: short || text };
  paintInput();
}

// State lives in the input: placeholder + enabled, and the send/stop or
// Reconnect button. Maximal trouble disables the input; bridge trouble only
// changes the placeholder (the agent still works).
function placeholderFor(compact) {
  if (running) return compact ? "Working…" : "Working… add a message or press Stop";
  if (connState.state !== "ok") { const m = maximalIssue(); return m ? m.text : connState.short; }
  if (netShown) return netShown.text;
  if (compact && compactNote) return compactNote;
  return compact ? "Ask the agent…" : "Ask the agent to work on this board…";
}

function paintInput() {
  const ok = connState.state === "ok";
  els.prompt.disabled = !ok && !running;
  const p = placeholderFor(false);
  if (els.prompt.placeholder !== p) els.prompt.placeholder = p;
  els.prompt.title = ok || running ? "" : connState.text;
  els.cprompt.disabled = !ok && !running;
  const cp = placeholderFor(true);
  if (els.cprompt.placeholder !== cp) els.cprompt.placeholder = cp;
  els.cprompt.title = ok ? "" : connState.text;
  paintGo();
}

const ICON_RECONNECT = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.5 7a4.5 4.5 0 1 1-1.3-3.2"/><path d="M11.5 2v3h-3"/></svg>';
const setIcon = (b, key, html) => { if (b.dataset.icon !== key) { b.dataset.icon = key; b.innerHTML = html; } };

// Maximal is down and nothing runs: the round button reconnects instead.
const reconnectMode = () => !running && connState.state !== "ok";

function paintGo() {
  if (reconnectMode()) {
    const busy = net.maximal.s === "checking" || (net.maximal.s === "down" && !net.maximal.nextAt);
    for (const b of [els.go, els.cgo]) {
      b.classList.remove("stop");
      b.classList.add("reconnect");
      setIcon(b, busy ? "dots" : "reconnect", busy ? DOTS : ICON_RECONNECT);
      // aria-disabled keeps focus on the button while it retries.
      b.disabled = false;
      b.setAttribute("aria-disabled", String(busy));
      b.title = busy ? "Reconnecting…" : "Reconnect now";
      b.setAttribute("aria-label", busy ? "Reconnecting" : "Reconnect now");
    }
    return;
  }
  for (const b of [els.go, els.cgo]) { b.classList.remove("reconnect"); b.removeAttribute("aria-disabled"); }
  const stop = running && !els.prompt.value.trim();
  const label = stop ? "Stop" : running ? "Queue message (↩)" : "Send (↩)";
  setIcon(els.go, stop ? "stop" : "send", stop ? ICON_STOP : ICON_SEND);
  els.go.classList.toggle("stop", stop);
  els.go.title = label;
  els.go.setAttribute("aria-label", stop ? "Stop" : running ? "Queue message" : "Send");
  els.go.disabled = false;
  setIcon(els.cgo, running ? "stop" : "send", running ? ICON_STOP : ICON_SEND);
  els.cgo.classList.toggle("stop", running);
  els.cgo.title = running ? "Stop" : "Send";
  els.cgo.setAttribute("aria-label", running ? "Stop" : "Send");
  els.cgo.disabled = false;
}

function onRound(source) {
  const b = source === "compact" ? els.cgo : els.go;
  if (b.classList.contains("reconnect")) {
    if (b.getAttribute("aria-disabled") !== "true") retryNow();
    return;
  }
  send(source);
}

function modelName(id) {
  const m = models.find((x) => x.id === id);
  return m ? m.name : id || "No model";
}

function effortName(e) {
  const hit = EFFORTS.find((x) => x[0] === e);
  return hit ? hit[1] : e;
}

// "Claude Sonnet 5.5" → "Sonnet 5.5"; other vendors keep their display name.
function chipLabel() {
  return modelId ? `${modelName(modelId).replace(/^Claude\s+/, "")} · ${effortName(effort)}` : "No model";
}

function showModel() {
  const label = chipLabel();
  els.modelLabel.textContent = label;
  els.modelBtn.setAttribute("aria-label", modelId ? `Model: ${label}` : "Model: none");
  els.modelBtn.title = modelId ? `Model: ${label}\n${modelId}` : connState.text;
}

// ---- chip ⇄ sparkles. Idle (first message sent in this chat, or 15 s since
// the last model/effort interaction) shows the icon; hover (150 ms rest),
// keyboard focus, a click or the open menu bring the label back until 1.5 s
// after the pointer/focus leaves.
const CHIP_IDLE_MS = 15000;
const CHIP_REST_MS = 150;
const CHIP_LINGER_MS = 1500;
const chip = { idle: false, idleTimer: null, enterTimer: null, leaveTimer: null };

function paintChip(icon, animate = true) {
  const b = els.modelBtn;
  if (b.classList.contains("iconic") === icon) return;
  const from = b.getBoundingClientRect().width;
  const text = b.querySelector(".chip-text");
  const glyph = b.querySelector(".chip-icon");
