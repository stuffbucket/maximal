# Release Please — PAUSED during the core excavation / Electron transition.
#
# This repo's release story is being redefined: the proxy core moved to
# @stuffbucket/maximal-core and an Electron client is about to be brought into
# this repo. The previous flow (open a release PR → tag on merge → dispatch
# release.yml to build + sign installers) no longer applies: release.yml and the
# installer/binary build pipeline have been removed, so there is nothing for a
# tag to fire.
#
# The workflow is intentionally left disabled (job `if: false`) rather than
# deleted so the Electron work can reinstate a version-bump/changelog/tag flow
# without recovering it from history. Do NOT invest in a release pipeline here
# until that lands.
name: Release Please

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    # Disabled: see the header. Re-enable and wire to the new (Electron) release
    # pipeline when it exists.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Paused
        run: echo "release-please is paused during the core excavation / Electron transition."
