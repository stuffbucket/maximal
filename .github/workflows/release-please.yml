name: Release Please

# Automates the version-bump / changelog / tag dance that used to be a
# manual `bun run release` (bumpp) + hand-pushed tag. The flow is:
#
#   1. Commits land on main (conventional commits).
#   2. This workflow opens / updates a "release PR" that bumps
#      package.json `version` and regenerates CHANGELOG.md from those
#      commits. The PR sits open, accumulating changes, until a
#      maintainer merges it.
#   3. On merge of that release PR, this workflow creates + pushes the git
#      tag `vX.Y.Z`. It does NOT create a GitHub Release.
#   4. This workflow explicitly dispatches release.yml for that tag; it
#      creates the draft release, builds + signs + verifies every installer,
#      then publishes once.
#
# DIVISION OF RESPONSIBILITY
#   release-please (here):  the release PR (version bump + CHANGELOG.md),
#                           and on merge the git TAG only.
#   release.yml:            fires on the tag, creates the draft release,
#                           attaches all assets, and publishes exactly once.
#
# WHY TAG-ONLY (not a GitHub Release here)
#   Immutable Releases lock a release at publish time, and all assets must
#   be attached BEFORE that single publish. The installers take ~30 min to
#   build AFTER the tag exists, so the release MUST stay a draft until they
#   land — which means release.yml has to own creation+publish. If
#   release-please published the release itself, release.yml could not
#   re-draft it to attach the installers ("state cannot be changed when
#   release is immutable"). So release-please stops at the tag.
#
# TRIGGER CHAIN / TOKEN
#   GitHub suppresses workflow triggers for refs and PRs created with the
#   repository GITHUB_TOKEN. This workflow therefore dispatches release.yml
#   explicitly after tag creation and dispatches ci.yml explicitly for the
#   generated release PR's exact head SHA. No App token or ruleset bypass is
#   required.

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN scopes for tag creation, release-PR management, and explicit
# downstream workflow dispatches.
permissions:
  contents: write
  pull-requests: write
  actions: write

# One release-please run per branch. Never cancel in-flight: a run that
# is mid-tag-creation must finish, not be interrupted by the next push
# to main.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14

      # On merge of a release PR, create + push the TAG only (no GitHub
      # Release — release.yml owns that; see the WHY TAG-ONLY note above).
      # Runs BEFORE release-pr so the just-released version is tagged and
      # release-please has a clean baseline for proposing the next one.
      # The manifest version is bumped only when a release PR merges, so:
      # if the manifest version has no tag yet, a release PR just merged
      # → tag it. If the tag already exists, this is an ordinary push to
      # main → no-op.
      - name: Tag merged release (release.yml builds + publishes it)
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.["."]' .release-please-manifest.json)"
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already tagged — no release PR merged, nothing to do."
            exit 0
          fi
          echo "Manifest at ${VERSION} with no ${TAG} tag — tagging the merged release."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"
          echo "Pushed ${TAG}; the next step explicitly dispatches release.yml."

      # If the manifest version has a tag but its GitHub Release hasn't been
      # published yet (draft or absent), dispatch release.yml so the release
      # pipeline is retried automatically. workflow_dispatch is NOT subject
      # to the GITHUB_TOKEN anti-loop guard that suppresses push:tags: triggers,
      # so this fires release.yml even when the tag was pushed via GITHUB_TOKEN.
      - name: Re-trigger release.yml for any unpublished tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.["."]' .release-please-manifest.json)"
          TAG="v${VERSION}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} not yet on remote — release.yml will fire when the tag is pushed above."
            exit 0
          fi
          DRAFT="$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft' 2>/dev/null || echo 'notfound')"
          if [ "$DRAFT" = "false" ]; then
            echo "Release $TAG is already published — nothing to do."
            exit 0
          fi
          echo "Tag ${TAG} exists but release is '${DRAFT}' — dispatching release.yml..."
          gh workflow run release.yml --repo "${{ github.repository }}" --ref "${TAG}" -f tag="${TAG}"
          echo "Dispatched release.yml for ${TAG}."

      # Flip the merged release PR's label pending → tagged. release-please
      # normally does this in its `github-release` step, but this pipeline
      # SKIPS github-release (release.yml owns the GitHub Release — see the
      # WHY TAG-ONLY note). Without this, the label stays `autorelease: pending`,
      # which makes the release-pr step below abort ("untagged, merged release
      # PRs outstanding") and blocks EVERY future release until someone flips it
      # by hand. Runs once the tag exists, before release-pr, so the next PR
      # opens in the same run. Idempotent: a no-op when nothing is pending, and
      # self-heals any release PR a prior run left stuck at pending.
      - name: Mark tagged release PRs as autorelease:tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.["."]' .release-please-manifest.json)"
          TAG="v${VERSION}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} not on remote yet — nothing to mark."
            exit 0
          fi
          PENDING="$(gh pr list --repo "${{ github.repository }}" --state merged \
            --label "autorelease: pending" --json number --jq '.[].number')"
          if [ -z "${PENDING}" ]; then
            echo "No merged release PRs at 'autorelease: pending' — nothing to flip."
            exit 0
          fi
          for n in ${PENDING}; do
            gh pr edit "$n" --repo "${{ github.repository }}" \
              --remove-label "autorelease: pending" --add-label "autorelease: tagged"
            echo "Flipped #${n}: autorelease: pending → tagged"
          done

      # Open or update the release PR for the NEXT version (version bump +
      # CHANGELOG.md from conventional commits since the last tag).
      - name: release-please release-pr
        env:
          RP_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bunx release-please release-pr \
            --token "$RP_TOKEN" \
            --repo-url "${{ github.repository }}" \
            --target-branch "${{ github.ref_name }}" \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json

      # GITHUB_TOKEN-created pull requests do not trigger pull_request
      # workflows. Find release-please's exact open PR head and explicitly run
      # the required `test` check against that immutable SHA.
      - name: Dispatch CI for the release PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: release-please--branches--main--components--maximal
        run: |
          set -euo pipefail
          PRS="$(gh pr list --repo "${{ github.repository }}" --state open \
            --base main --head "$HEAD_BRANCH" \
            --json number,headRefName,headRefOid,url)"
          COUNT="$(jq 'length' <<<"$PRS")"
          if [ "$COUNT" -eq 0 ]; then
            echo "No open release-please PR — nothing to validate."
            exit 0
          fi
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected one open release-please PR, found $COUNT."
            exit 1
          fi
          HEAD_REF="$(jq -r '.[0].headRefName' <<<"$PRS")"
          HEAD_SHA="$(jq -r '.[0].headRefOid' <<<"$PRS")"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk '{print $1}')"
          if [ -z "$REMOTE_SHA" ] || [ "$REMOTE_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Release PR head moved during discovery."
            exit 1
          fi
          gh workflow run ci.yml --repo "${{ github.repository }}" \
            --ref "$HEAD_REF" -f expected_sha="$HEAD_SHA"
          echo "Dispatched CI for $(jq -r '.[0].url' <<<"$PRS") at $HEAD_SHA."
