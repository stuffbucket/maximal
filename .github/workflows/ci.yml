name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    types: [opened, synchronize, reopened]
  # Bot-created PR events may be suppressed when GITHUB_TOKEN creates them.
  # Their producer explicitly dispatches this workflow and pins the expected
  # head SHA so a branch movement cannot validate the wrong commit.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact PR head SHA this run must validate"
        required: true
        type: string
  # GitHub merge queue: dispatched against synthetic
  # gh-readonly-queue/<base>/... refs. Required status checks must run
  # here too or the queue blocks indefinitely waiting for them.
  merge_group:

# Read-only by default; a job asks for anything more.
permissions:
  contents: read

# Generated PRs currently receive both a pull_request event and their explicit
# exact-SHA dispatch. Give those trusted same-repository branch/SHA pairs one
# group so whichever arrives second replaces the duplicate full run. Every
# other dispatch keeps its run_id group; ordinary PRs retain per-PR superseding.
concurrency:
  group: >-
    ci-${{
      (
        (
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (
            github.head_ref == 'release-please--branches--main--components--maximal'
            || github.head_ref == 'automation/updates-manifest'
          )
        )
        || (
          github.event_name == 'workflow_dispatch'
          && github.actor == 'github-actions[bot]'
          && (
            github.ref_name == 'release-please--branches--main--components--maximal'
            || github.ref_name == 'automation/updates-manifest'
          )
        )
      )
      && (
        github.event_name == 'workflow_dispatch'
        && inputs.expected_sha
        || github.event.pull_request.head.sha
      )
      || (github.event.pull_request.number || github.run_id)
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'pull_request'
      || (
        github.event_name == 'workflow_dispatch'
        && github.actor == 'github-actions[bot]'
        && (
          github.ref_name == 'release-please--branches--main--components--maximal'
          || github.ref_name == 'automation/updates-manifest'
        )
      )
    }}

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_branch: ${{ steps.changes.outputs.head_branch }}
      head_sha: ${{ steps.changes.outputs.head_sha }}
      mode: ${{ steps.changes.outputs.mode }}
      trusted_generated: ${{ steps.changes.outputs.trusted_generated }}
      windows_broker: ${{ steps.changes.outputs.windows_broker }}
    steps:
      - name: Verify dispatched SHA
        if: github.event_name == 'workflow_dispatch' && github.sha != inputs.expected_sha
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          echo "::error::Branch moved before CI dispatch: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Classification compares the event's immutable endpoints. A shallow
          # clone could omit the PR merge base or the start of a multi-commit push.
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: Classify changes
        id: changes
        run: bun scripts/ci-change-classifier.ts

      - name: Report classification
        env:
          MODE: ${{ steps.changes.outputs.mode }}
          CHANGED_COUNT: ${{ steps.changes.outputs.changed_count }}
          TRUSTED_GENERATED: ${{ steps.changes.outputs.trusted_generated }}
          WINDOWS_BROKER: ${{ steps.changes.outputs.windows_broker }}
        run: |
          printf 'mode=%s changed=%s trusted_generated=%s windows_broker=%s\n' \
            "$MODE" "$CHANGED_COUNT" "$TRUSTED_GENERATED" "$WINDOWS_BROKER"

      - name: Verify trusted generated tree scope
        if: >-
          (
            github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository
            && (
              github.head_ref == 'release-please--branches--main--components--maximal'
              || github.head_ref == 'automation/updates-manifest'
            )
          )
          || (
            github.event_name == 'workflow_dispatch'
            && github.actor == 'github-actions[bot]'
            && (
              github.ref_name == 'release-please--branches--main--components--maximal'
              || github.ref_name == 'automation/updates-manifest'
            )
          )
        env:
          TRUSTED_GENERATED: ${{ steps.changes.outputs.trusted_generated }}
        run: |
          if [ "$TRUSTED_GENERATED" != "true" ]; then
            echo "::error::Generated branch changed files outside its fail-closed allowlist."
            exit 1
          fi

      # release-please reads the PR title on a squash and every branch commit
      # on a merge commit, so both must be Conventional Commits. The generated
      # dispatch may win de-duplication, so resolve its PR and check it too.
      - name: Check Conventional Commit subjects
        if: >-
          github.event_name == 'pull_request'
          || (
            github.event_name == 'workflow_dispatch'
            && (
              github.ref_name == 'release-please--branches--main--components--maximal'
              || github.ref_name == 'automation/updates-manifest'
            )
          )
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          title="$EVENT_PR_TITLE"
          number="$EVENT_PR_NUMBER"
          if [ -z "$number" ]; then
            prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
              --base main --head "$GITHUB_REF_NAME" --json number,title)"
            count="$(jq 'length' <<<"$prs")"
            if [ "$count" -ne 1 ]; then
              echo "::error::Expected one open generated PR for $GITHUB_REF_NAME, found $count."
              exit 1
            fi
            number="$(jq -r '.[0].number' <<<"$prs")"
            title="$(jq -r '.[0].title' <<<"$prs")"
          fi
          {
            printf '%s\n' "$title"
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$number/commits" \
              --jq '.[].commit.message | split("\n")[0]'
          } | bun scripts/check-commit-msg.ts --subjects

  # Only an allowlisted generated tree reaches this job, so actions:read is
  # never provisioned to ordinary PR validation. A completed successful
  # opposite-event run is the sole evidence for sequential de-duplication.
  deduplicate:
    needs: classify
    if: needs.classify.outputs.trusted_generated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      duplicate: ${{ steps.lookup.outputs.duplicate || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: Find successful generated-PR counterpart
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_BRANCH: ${{ needs.classify.outputs.head_branch }}
          CI_HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            counterpart="workflow_dispatch"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            counterpart="pull_request"
          else
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runs="$RUNNER_TEMP/ci-counterpart-runs.json"
          if ! gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$CI_HEAD_SHA&event=$counterpart&status=success&per_page=100" \
            > "$runs"; then
            echo "::warning::Could not list prior CI runs; running full validation."
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bun scripts/ci-change-classifier.ts --duplicate < "$runs"

  quality:
    needs: [classify, deduplicate]
    if: >-
      always()
      && needs.classify.result == 'success'
      && (needs.deduplicate.result == 'success' || needs.deduplicate.result == 'skipped')
      && needs.deduplicate.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: Configure package registry
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install dependencies
        run: bun install

      # The package feed's tarball hosts rotate; a lockfile that records one
      # fails a later frozen install (scripts/lockfile-shard-hosts.cjs).
      - name: Check pnpm lockfiles for rotating feed hosts
        run: bun scripts/strip-lockfile-hosts.ts --check

      - name: Run linter
        run: bun run lint:all

      - name: Run type check
        run: bun run typecheck

      - name: Check unsafe type assertions
        run: bun run casts:check

      - name: Build
        run: bun run build

  unit-tests:
    needs: [classify, deduplicate]
    if: >-
      always()
      && needs.classify.result == 'success'
      && (needs.deduplicate.result == 'success' || needs.deduplicate.result == 'skipped')
      && needs.deduplicate.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Root tests exercise the isolated broker package, but do not build Rust.
      MISE_DISABLE_TOOLS: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"

      - name: Verify Node sqlite support
        run: node -e "import('node:sqlite').then(() => console.log('node:sqlite ok')).catch((error) => { console.error(error); process.exit(1) })"

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - uses: ./.github/actions/setup-mise
        with:
          mise-version: v2026.9.5

      - name: Configure package registry
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install dependencies
        run: bun install

      # tests/mcp-adapter-end-to-end.test.ts intentionally skips when mcp-proxy
      # is unavailable, so install the broker package before the root suite.
      - name: Install isolated broker dependencies
        run: |
          mise trust packages/mcp-broker/mise.toml
          mise -C packages/mcp-broker install
          mise -C packages/mcp-broker exec -- pnpm install --frozen-lockfile

      - name: Run tests
        run: bun test

  broker:
    needs: [classify, deduplicate]
    if: >-
      always()
      && needs.classify.result == 'success'
      && (needs.deduplicate.result == 'success' || needs.deduplicate.result == 'skipped')
      && needs.deduplicate.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The root mise.toml pins Rust and the broker inherits it; nothing in
      # this job builds Rust through mise, so don't download the toolchain.
      MISE_DISABLE_TOOLS: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-mise
        with:
          mise-version: v2026.9.5

      - name: Configure package registry
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install isolated broker dependencies
        run: |
          mise trust packages/mcp-broker/mise.toml
          mise -C packages/mcp-broker install
          mise -C packages/mcp-broker exec -- pnpm install --frozen-lockfile

      - name: Check isolated broker
        run: |
          mise -C packages/mcp-broker exec -- pnpm typecheck
          mise -C packages/mcp-broker exec -- pnpm build
          MAXIMAL_MCP_BROKER_BINARY="$PWD/packages/mcp-broker/dist/maximal-mcp-broker" mise -C packages/mcp-broker exec -- pnpm test
          # The release cross-compiles the broker for Windows; catch a Bun
          # that can't before a release run does.
          mise -C packages/mcp-broker exec -- pnpm build:target \
            --target=bun-windows-x64 \
            --outfile="$RUNNER_TEMP/maximal-mcp-broker-windows-x64.exe"

  storybook:
    needs: [classify, deduplicate]
    if: >-
      always()
      && needs.classify.result == 'success'
      && (needs.deduplicate.result == 'success' || needs.deduplicate.result == 'skipped')
      && needs.deduplicate.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISE_DISABLE_TOOLS: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - uses: ./.github/actions/setup-mise
        with:
          mise-version: v2026.9.5

      - name: Configure package registry
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install dependencies
        run: bun install

      # Stories reach into shell/src and the harness fixtures mirror the API
      # schemas, so a prop or schema change can break them without touching
      # packages/storybook. Check on every run so they can't drift.
      - name: Install Storybook dependencies
        run: |
          # The root prepare hook installs shell dependencies; keep this frozen
          # pass explicit so CI rejects a stale shell lockfile.
          (cd shell && bun install --frozen-lockfile)
          mise install node pnpm
          mise -C packages/storybook exec -- pnpm install --frozen-lockfile

      - name: Check Storybook stories and harness fixtures
        run: bun run storybook:check

  # Branch protection requires exactly this stable check name. Keep the actual
  # Ubuntu suites parallel, then fail closed if any prerequisite was not green.
  test:
    name: test
    if: always()
    needs: [classify, deduplicate, quality, unit-tests, broker, storybook]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require full validation or a proven duplicate
        env:
          CLASSIFY: ${{ needs.classify.result }}
          DEDUPLICATE: ${{ needs.deduplicate.result }}
          DUPLICATE: ${{ needs.deduplicate.outputs.duplicate || 'false' }}
          QUALITY: ${{ needs.quality.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          BROKER: ${{ needs.broker.result }}
          STORYBOOK: ${{ needs.storybook.result }}
        run: |
          set -euo pipefail
          if [ "$CLASSIFY" != "success" ]; then
            echo "::error::classify=$CLASSIFY"
            exit 1
          fi
          if [ "$DEDUPLICATE" != "success" ] && [ "$DEDUPLICATE" != "skipped" ]; then
            echo "::error::deduplicate=$DEDUPLICATE"
            exit 1
          fi

          expected="success"
          if [ "$DUPLICATE" = "true" ]; then
            if [ "$DEDUPLICATE" != "success" ]; then
              echo "::error::duplicate=true without successful evidence job"
              exit 1
            fi
            expected="skipped"
          fi
          failed=0
          for result in \
            "quality=$QUALITY" \
            "unit-tests=$UNIT_TESTS" \
            "broker=$BROKER" \
            "storybook=$STORYBOOK"; do
            if [[ "$result" != *="$expected" ]]; then
              echo "::error::$result (expected $expected)"
              failed=1
            fi
          done
          exit "$failed"

  # The broker contains MCP servers on Windows with a kill-on-close Job
  # Object, which only a Windows machine can check: build the broker there
  # and run its tests, including test/windows-containment.test.ts, against
  # the compiled executable. Manual, scheduled, merge-group, and unknown
  # changes classify as full and always run both architectures.
  windows-broker:
    name: windows-broker (${{ matrix.runner }})
    needs: [classify, deduplicate]
    if: >-
      always()
      && needs.classify.result == 'success'
      && (needs.deduplicate.result == 'success' || needs.deduplicate.result == 'skipped')
      && needs.deduplicate.outputs.duplicate != 'true'
      && needs.classify.outputs.windows_broker == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      # The broker inherits the root mise.toml's Rust pin; nothing here
      # builds Rust.
      MISE_DISABLE_TOOLS: rust
      # An emulated x64 process can't tell it's on an Arm PC (it sees AMD64),
      # so the workflow says so. PowerShell takes about 42 seconds to launch
      # there, too slow for the PowerShell-parent adapter test.
      MAXIMAL_TEST_SKIP_POWERSHELL_PARENT: ${{ matrix.runner == 'windows-11-arm' && '1' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-mise
        with:
          mise-version: v2026.9.5

      - name: Configure package registry
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install isolated broker dependencies
        run: |
          mise trust mise.toml
          mise trust packages/mcp-broker/mise.toml
          mise install
          mise -C packages/mcp-broker install
          mise -C packages/mcp-broker exec -- pnpm install --frozen-lockfile

      - name: Build the broker
        run: mise -C packages/mcp-broker exec -- pnpm build

      - name: Test the broker on Windows
        working-directory: packages/mcp-broker
        run: |
          MAXIMAL_MCP_BROKER_BINARY="$(cygpath -w "$PWD/dist/maximal-mcp-broker.exe")" \
            mise exec -- bun test

      # Releases ship the minified x64 cross-compile (release.yml's
      # build:target), so check the adapter, the command line and containment
      # against exactly that build as well. On the Arm runner it runs under
      # emulation, as it does on an Arm PC.
      - name: Test the release build
        if: always()
        working-directory: packages/mcp-broker
        run: |
          mise exec -- pnpm build:target \
            --target=bun-windows-x64 \
            --outfile="$PWD/dist/release/maximal-mcp-broker.exe"
          MAXIMAL_MCP_BROKER_BINARY="$(cygpath -w "$PWD/dist/release/maximal-mcp-broker.exe")" \
            mise exec -- bun test test/cli.test.ts test/stdio-adapter.test.ts test/windows-adapter-pipes.test.ts test/windows-containment.test.ts

      # Claude Desktop's path end to end: a Node parent runs the release
      # adapter against Maximal's /mcp route, which forwards to a broker.
      - name: Test the release adapter through Maximal's /mcp route
        if: always()
        run: |
          mise exec -- bun install --frozen-lockfile
          MAXIMAL_MCP_BROKER_BINARY="$(cygpath -w "$PWD/packages/mcp-broker/dist/release/maximal-mcp-broker.exe")" \
            mise exec -- bun test tests/mcp-adapter-end-to-end.test.ts
