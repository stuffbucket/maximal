name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    types: [opened, synchronize, reopened]
  # Bot-created PR events are suppressed when GITHUB_TOKEN creates them.
  # Their producer explicitly dispatches this workflow and pins the expected
  # head SHA so a branch movement cannot validate the wrong commit.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact PR head SHA this run must validate"
        required: true
        type: string
  # GitHub merge queue: dispatched against synthetic
  # gh-readonly-queue/<base>/... refs. Required status checks must run
  # here too or the queue blocks indefinitely waiting for them.
  merge_group:

# A new push to a PR supersedes its in-flight run. Every other run gets its
# own group (run_id), so main, merge-group, and dispatched runs never queue
# behind or replace each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The root mise.toml pins Rust and the broker inherits it; nothing in
      # this job builds Rust through mise, so don't download the toolchain.
      MISE_DISABLE_TOOLS: rust
    steps:
      - name: Verify dispatched SHA
        if: github.event_name == 'workflow_dispatch' && github.sha != inputs.expected_sha
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          echo "::error::Branch moved before CI dispatch: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}."
          exit 1

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Verify Node sqlite support
        run: node -e "import('node:sqlite').then(() => console.log('node:sqlite ok')).catch((error) => { console.error(error); process.exit(1) })"

      - uses: ./.github/actions/setup-bun
        with:
          # Pinned to match the version the suite is currently green
          # against locally. `latest` regressed module-export resolution
          # on 2026-05-21 (run 26232611959 / 26232603655); 22 tests
          # failed with "Export named 'X' not found in module token.ts"
          # despite the exports being present. Bump intentionally when
          # we want a newer Bun, not by drift.
          bun-version: 1.4.3

      # release-please reads the PR title on a squash and every branch commit
      # on a merge commit, so both must be Conventional Commits.
      - name: Check Conventional Commit subjects
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            printf '%s\n' "$PR_TITLE"
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" \
              --jq '.[].commit.message | split("\n")[0]'
          } | bun scripts/check-commit-msg.ts --subjects

      - uses: ./.github/actions/setup-mise
        with:
          mise-version: v2026.9.5

      - name: Configure package registry
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install dependencies
        run: bun install

      # The package feed's tarball hosts rotate; a lockfile that records one
      # fails a later frozen install (scripts/lockfile-shard-hosts.cjs).
      - name: Check pnpm lockfiles for rotating feed hosts
        run: bun scripts/strip-lockfile-hosts.ts --check

      - name: Install isolated broker dependencies
        run: |
          mise trust packages/mcp-broker/mise.toml
          mise -C packages/mcp-broker install
          mise -C packages/mcp-broker exec -- pnpm install --frozen-lockfile

      - name: Check isolated broker
        run: |
          mise -C packages/mcp-broker exec -- pnpm typecheck
          mise -C packages/mcp-broker exec -- pnpm build
          MAXIMAL_MCP_BROKER_BINARY="$PWD/packages/mcp-broker/dist/maximal-mcp-broker" mise -C packages/mcp-broker exec -- pnpm test
          # The release cross-compiles the broker for Windows; catch a Bun
          # that can't before a release run does.
          mise -C packages/mcp-broker exec -- pnpm build:target \
            --target=bun-windows-x64 \
            --outfile="$RUNNER_TEMP/maximal-mcp-broker-windows-x64.exe"

      # Stories reach into shell/src and the harness fixtures mirror the API
      # schemas, so a prop or schema change can break them without touching
      # packages/storybook. Check on every run so they can't drift.
      - name: Install Storybook dependencies
        run: |
          # Story typechecking follows imports into shell/src.
          (cd shell && bun install --frozen-lockfile)
          # packages/storybook runs on the root Node and pnpm pins.
          mise install node pnpm
          mise -C packages/storybook exec -- pnpm install --frozen-lockfile

      - name: Check Storybook stories and harness fixtures
        run: bun run storybook:check

      - name: Run linter
        run: bun run lint:all

      - name: Run type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

  # The broker contains MCP servers on Windows with a kill-on-close Job
  # Object, which only a Windows machine can check: build the broker there
  # and run its tests, including test/windows-containment.test.ts, against
  # the compiled executable.
  # The same on Windows on Arm, where Maximal's x64 build runs under
  # emulation: the release broker and adapter must work there too.
  windows-broker:
    name: windows-broker (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      # The broker inherits the root mise.toml's Rust pin; nothing here
      # builds Rust.
      MISE_DISABLE_TOOLS: rust
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify dispatched SHA
        if: github.event_name == 'workflow_dispatch' && github.sha != inputs.expected_sha
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          echo "::error::Branch moved before CI dispatch: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}."
          exit 1

      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-mise
        with:
          mise-version: v2026.9.5

      - name: Configure package registry
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install isolated broker dependencies
        run: |
          mise trust mise.toml
          mise trust packages/mcp-broker/mise.toml
          mise install
          mise -C packages/mcp-broker install
          mise -C packages/mcp-broker exec -- pnpm install --frozen-lockfile

      - name: Build the broker
        run: mise -C packages/mcp-broker exec -- pnpm build

      - name: Test the broker on Windows
        working-directory: packages/mcp-broker
        run: |
          MAXIMAL_MCP_BROKER_BINARY="$(cygpath -w "$PWD/dist/maximal-mcp-broker.exe")" \
            mise exec -- bun test

      # Releases ship the minified x64 cross-compile (release.yml's
      # build:target), so check the adapter, the command line and containment
      # against exactly that build as well. On the Arm runner it runs under
      # emulation, as it does on an Arm PC.
      - name: Test the release build
        if: always()
        working-directory: packages/mcp-broker
        run: |
          mise exec -- pnpm build:target \
            --target=bun-windows-x64 \
            --outfile="$PWD/dist/release/maximal-mcp-broker.exe"
          MAXIMAL_MCP_BROKER_BINARY="$(cygpath -w "$PWD/dist/release/maximal-mcp-broker.exe")" \
            mise exec -- bun test test/cli.test.ts test/stdio-adapter.test.ts test/windows-adapter-pipes.test.ts test/windows-containment.test.ts

      # Claude Desktop's path end to end: a Node parent runs the release
      # adapter against Maximal's /mcp route, which forwards to a broker.
      - name: Test the release adapter through Maximal's /mcp route
        if: always()
        run: |
          mise exec -- bun install --frozen-lockfile
          MAXIMAL_MCP_BROKER_BINARY="$(cygpath -w "$PWD/packages/mcp-broker/dist/release/maximal-mcp-broker.exe")" \
            mise exec -- bun test tests/mcp-adapter-end-to-end.test.ts
