name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    types: [opened, synchronize, reopened]
  # Bot-created PR events may be suppressed when GITHUB_TOKEN creates them.
  # Their producer explicitly dispatches this workflow and pins the expected
  # head SHA so a branch movement cannot validate the wrong commit.
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact PR head SHA this run must validate"
        required: true
        type: string
  # GitHub merge queue: dispatched against synthetic
  # gh-readonly-queue/<base>/... refs. Required status checks must run
  # here too or the queue blocks indefinitely waiting for them.
  merge_group:

# Read-only by default; a job asks for anything more.
permissions:
  contents: read

# Generated PRs currently receive both a pull_request event and their explicit
# exact-SHA dispatch. Give those trusted same-repository branch/SHA pairs one
# group so whichever arrives second replaces the duplicate full run. Every
# other dispatch keeps its run_id group; ordinary PRs retain per-PR superseding.
concurrency:
  group: >-
    ci-${{
      (
        (
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (
            github.head_ref == 'release-please--branches--main--components--maximal'
            || github.head_ref == 'automation/updates-manifest'
          )
        )
        || (
          github.event_name == 'workflow_dispatch'
          && github.actor == 'github-actions[bot]'
          && (
            github.ref_name == 'release-please--branches--main--components--maximal'
            || github.ref_name == 'automation/updates-manifest'
          )
        )
      )
      && (
        github.event_name == 'workflow_dispatch'
        && inputs.expected_sha
        || github.event.pull_request.head.sha
      )
      || (github.event.pull_request.number || github.run_id)
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'pull_request'
      || (
        github.event_name == 'workflow_dispatch'
        && github.actor == 'github-actions[bot]'
        && (
          github.ref_name == 'release-please--branches--main--components--maximal'
          || github.ref_name == 'automation/updates-manifest'
        )
      )
    }}

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_branch: ${{ steps.changes.outputs.head_branch }}
      head_sha: ${{ steps.changes.outputs.head_sha }}
      mode: ${{ steps.changes.outputs.mode }}
      trusted_generated: ${{ steps.changes.outputs.trusted_generated }}
    steps:
      - name: Verify dispatched SHA
        if: github.event_name == 'workflow_dispatch' && github.sha != inputs.expected_sha
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          echo "::error::Branch moved before CI dispatch: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Classification compares the event's immutable endpoints. A shallow
          # clone could omit the PR merge base or the start of a multi-commit push.
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: Classify changes
        id: changes
        run: bun scripts/ci-change-classifier.ts

      - name: Report classification
        env:
          MODE: ${{ steps.changes.outputs.mode }}
          CHANGED_COUNT: ${{ steps.changes.outputs.changed_count }}
          TRUSTED_GENERATED: ${{ steps.changes.outputs.trusted_generated }}
        run: |
          printf 'mode=%s changed=%s trusted_generated=%s\n' \
            "$MODE" "$CHANGED_COUNT" "$TRUSTED_GENERATED"

      - name: Verify trusted generated tree scope
        if: >-
          (
            github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository
            && (
              github.head_ref == 'release-please--branches--main--components--maximal'
              || github.head_ref == 'automation/updates-manifest'
            )
          )
          || (
            github.event_name == 'workflow_dispatch'
            && github.actor == 'github-actions[bot]'
            && (
              github.ref_name == 'release-please--branches--main--components--maximal'
              || github.ref_name == 'automation/updates-manifest'
            )
          )
        env:
          TRUSTED_GENERATED: ${{ steps.changes.outputs.trusted_generated }}
        run: |
          if [ "$TRUSTED_GENERATED" != "true" ]; then
            echo "::error::Generated branch changed files outside its fail-closed allowlist."
            exit 1
          fi

      # release-please reads the PR title on a squash and every branch commit
      # on a merge commit, so both must be Conventional Commits. The generated
      # dispatch may win de-duplication, so resolve its PR and check it too.
      - name: Check Conventional Commit subjects
        if: >-
          github.event_name == 'pull_request'
          || (
            github.event_name == 'workflow_dispatch'
            && (
              github.ref_name == 'release-please--branches--main--components--maximal'
              || github.ref_name == 'automation/updates-manifest'
            )
          )
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          title="$EVENT_PR_TITLE"
          number="$EVENT_PR_NUMBER"
          if [ -z "$number" ]; then
            prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
              --base main --head "$GITHUB_REF_NAME" --json number,title)"
            count="$(jq 'length' <<<"$prs")"
            if [ "$count" -ne 1 ]; then
              echo "::error::Expected one open generated PR for $GITHUB_REF_NAME, found $count."
              exit 1
            fi
            number="$(jq -r '.[0].number' <<<"$prs")"
            title="$(jq -r '.[0].title' <<<"$prs")"
          fi
          {
            printf '%s\n' "$title"
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$number/commits" \
              --jq '.[].commit.message | split("\n")[0]'
          } | bun scripts/check-commit-msg.ts --subjects

  # Only an allowlisted generated tree reaches this job, so actions:read is
  # never provisioned to ordinary PR validation. A completed successful
  # opposite-event run is the sole evidence for sequential de-duplication.
  deduplicate:
    needs: classify
    if: needs.classify.outputs.trusted_generated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      duplicate: ${{ steps.lookup.outputs.duplicate || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: Find successful generated-PR counterpart
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_BRANCH: ${{ needs.classify.outputs.head_branch }}
          CI_HEAD_SHA: ${{ needs.classify.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            counterpart="workflow_dispatch"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            counterpart="pull_request"
          else
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runs="$RUNNER_TEMP/ci-counterpart-runs.json"
          if ! gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$CI_HEAD_SHA&event=$counterpart&status=success&per_page=100" \
            > "$runs"; then
            echo "::warning::Could not list prior CI runs; running full validation."
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bun scripts/ci-change-classifier.ts --duplicate < "$runs"

  quality:
    needs: [classify, deduplicate]
    if: >-
      always()
      && needs.classify.result == 'success'
      && (needs.deduplicate.result == 'success' || needs.deduplicate.result == 'skipped')
      && needs.deduplicate.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: Configure package registry
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install dependencies
        run: bun install

      # The package feed's tarball hosts rotate; a lockfile that records one
      # fails a later frozen install (scripts/lockfile-shard-hosts.cjs).
      - name: Check pnpm lockfiles for rotating feed hosts
        run: bun scripts/strip-lockfile-hosts.ts --check

      - name: Run linter
        run: bun run lint:all

      - name: Run type check
        run: bun run typecheck

      - name: Check unsafe type assertions
        run: bun run casts:check

      - name: Type check plugin packages
        run: bun run plugins:typecheck

      - name: Build
        run: bun run build

  unit-tests:
    needs: [classify, deduplicate]
    if: >-
      always()
      && needs.classify.result == 'success'
      && (needs.deduplicate.result == 'success' || needs.deduplicate.result == 'skipped')
      && needs.deduplicate.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"

      - name: Verify Node sqlite support
        run: node -e "import('node:sqlite').then(() => console.log('node:sqlite ok')).catch((error) => { console.error(error); process.exit(1) })"

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: Configure package registry
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Run plugin package tests
        run: bun run plugins:test

  storybook:
    needs: [classify, deduplicate]
    if: >-
      always()
      && needs.classify.result == 'success'
      && (needs.deduplicate.result == 'success' || needs.deduplicate.result == 'skipped')
      && needs.deduplicate.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISE_DISABLE_TOOLS: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - uses: ./.github/actions/setup-mise
        with:
          mise-version: v2026.9.5

      - name: Configure package registry
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install dependencies
        run: bun install

      # Stories reach into shell/src and the harness fixtures mirror the API
      # schemas, so a prop or schema change can break them without touching
      # packages/storybook. Check on every run so they can't drift.
      - name: Install Storybook dependencies
        run: |
          # The root prepare hook installs shell dependencies; keep this frozen
          # pass explicit so CI rejects a stale shell lockfile.
          (cd shell && bun install --frozen-lockfile)
          mise install node pnpm
          mise -C packages/storybook exec -- pnpm install --frozen-lockfile

      - name: Check Storybook stories and harness fixtures
        run: bun run storybook:check

  # Branch protection requires exactly this stable check name. Keep the actual
  # Ubuntu suites parallel, then fail closed if any prerequisite was not green.
  test:
    name: test
    if: always()
    needs: [classify, deduplicate, quality, unit-tests, storybook]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require full validation or a proven duplicate
        env:
          CLASSIFY: ${{ needs.classify.result }}
          DEDUPLICATE: ${{ needs.deduplicate.result }}
          DUPLICATE: ${{ needs.deduplicate.outputs.duplicate || 'false' }}
          QUALITY: ${{ needs.quality.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          STORYBOOK: ${{ needs.storybook.result }}
        run: |
          set -euo pipefail
          if [ "$CLASSIFY" != "success" ]; then
            echo "::error::classify=$CLASSIFY"
            exit 1
          fi
          if [ "$DEDUPLICATE" != "success" ] && [ "$DEDUPLICATE" != "skipped" ]; then
            echo "::error::deduplicate=$DEDUPLICATE"
            exit 1
          fi

          expected="success"
          if [ "$DUPLICATE" = "true" ]; then
            if [ "$DEDUPLICATE" != "success" ]; then
              echo "::error::duplicate=true without successful evidence job"
              exit 1
            fi
            expected="skipped"
          fi
          failed=0
          for result in \
            "quality=$QUALITY" \
            "unit-tests=$UNIT_TESTS" \
            "storybook=$STORYBOOK"; do
            if [[ "$result" != *="$expected" ]]; then
              echo "::error::$result (expected $expected)"
              failed=1
            fi
          done
          exit "$failed"
