name: Deploy to GitHub Pages

# ============================================================================
# AUTOMATIC DEPLOYS ARE FROZEN.
#
# The `push` trigger is commented out on purpose: the published site is to
# stay exactly as it is, and nothing should reach Pages without a deliberate
# human action. The workflow is ALSO disabled at the Actions level
# (`disabled_manually`), so neither a push nor a `workflow_dispatch` will run
# it while that holds.
#
# To resume automatic deploys, BOTH are required:
#   1. Restore the `push:` block below.
#   2. `gh workflow enable deploy-pages.yml` (or the Actions tab).
# Doing only one will leave you waiting for a deploy that cannot happen.
#
# Note when restoring: the paths filter includes this file, so the very
# commit that restores the trigger will itself deploy.
# ============================================================================
on:
  # push:
  #   branches: [ "main" ]
  #   # Only redeploy when something the deployed site actually depends on
  #   # changes. A src-only or test-only commit no longer rebuilds+redeploys
  #   # Pages — the previously unfiltered trigger multiplied deploy volume (and
  #   # so the odds of the GitHub Pages backend flakiness / the re-run artifact
  #   # trap in #239) on busy main days (issue #222 / #218; see
  #   # docs/decisions/site-runtime-version-manifest.md).
  #   #
  #   # `site/public/updates/manifest.json` is listed on purpose: a commit to it
  #   # becomes exactly one Pages deploy. Nothing writes it at present —
  #   # release.yml's `manifest` job went with the Tauri pipeline — so the site's
  #   # advertised version is pinned until `scripts/write-updates-manifest.ts` is
  #   # wired into whatever replaces it. The filter stays ready for that (the
  #   # `redeploy-site` job that used to do that is now gone). It lives under
  #   # site/public/ so `site/**` already covers it; it is named here only to
  #   # document that the release→site path rides this trigger.
  #   paths:
  #     - "site/**"
  #     - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
# `actions: write` lets the "Remove stale github-pages artifact" step below
# delete a prior attempt's artifact via the Actions API before re-uploading.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# One deployment at a time. `cancel-in-progress: true` so a newer commit or
# dispatch supersedes and CANCELS an in-flight deploy rather than queuing
# behind it: the site is a derived artifact with no per-run state worth
# draining, so the freshest content wins and superseded attempts don't linger
# (see docs/decisions/site-runtime-version-manifest.md).
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build the Astro site under ./site and deploy site/dist to Pages.
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: latest

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      # Build the static site. As of issue #223 (Phase 4 of #218) the build no
      # longer queries the GitHub releases API and has no SITE_PIN_VERSION knob:
      # the version + download links it server-renders come from the committed
      # static manifest (site/public/updates/manifest.json), which nothing
      # refreshes at present (see the paths filter above). So there is no
      # GITHUB_TOKEN / rate-limit exposure here, and the build is deterministic
      # + offline. #221's runtime hydration still layers over this baked,
      # fail-closed fallback.
      - name: Build Astro
        working-directory: site
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Guard against the "Multiple artifacts named github-pages" deploy trap.
      # `actions/deploy-pages` refuses to deploy when a run has >1 artifact
      # named `github-pages`, and `upload-pages-artifact` does NOT overwrite —
      # so re-running the failed deploy job re-uploads a SECOND copy without
      # removing the first, driving the count 1→2→3 and failing every re-run
      # harder (see issue #239). Deleting any pre-existing copy for THIS run
      # before uploading keeps the count at exactly 1, making re-runs safe.
      # No-ops on a first attempt (nothing to delete).
      - name: Remove stale github-pages artifact from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" \
            --jq '.artifacts[].id')
          if [ -z "$ids" ]; then
            echo "No pre-existing github-pages artifact for this run; nothing to remove."
            exit 0
          fi
          for id in $ids; do
            echo "Deleting stale github-pages artifact ${id} from run ${GITHUB_RUN_ID}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5