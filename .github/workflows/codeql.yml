name: CodeQL

# What gets scanned and when:
#   - pull_request / merge_group / push to main: only the languages the change
#     touches (scripts/codeql-languages.ts), so a docs-only PR runs no
#     analysis and a Rust-only PR runs only the Rust one.
#   - schedule / workflow_dispatch: every language, so new CodeQL queries
#     reach code that hasn't changed lately.
#   - Changing this workflow, the config, or the language picker: every
#     language.
# CodeQL is not a required status check (only `test` is), so skipping a
# language never blocks a merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes its in-flight scan. Every other run gets its
# own group (run_id), so main and scheduled scans never queue behind or
# replace each other.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Pick languages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: List changed files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            merge_group)  range="$MG_BASE...$MG_HEAD" ;;
            push)         range="$PUSH_BEFORE...$PUSH_AFTER" ;;
            *)            range="" ;;
          esac
          # No range (schedule/dispatch), a new branch (all-zero before), an
          # API failure, or a diff at the compare API's 300-file cap: scan all.
          if [ -z "$range" ] || [ "${range%%...*}" = "0000000000000000000000000000000000000000" ] \
            || ! gh api "repos/$GITHUB_REPOSITORY/compare/$range" --jq '.files[].filename' > changed.txt \
            || [ "$(wc -l < changed.txt)" -ge 300 ]; then
            echo ALL > changed.txt
          fi
          echo "$(wc -l < changed.txt) changed path(s)"

      - name: Pick languages
        id: pick
        run: echo "languages=$(bun scripts/codeql-languages.ts < changed.txt)" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: scope
    if: needs.scope.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.scope.outputs.languages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Rust is analyzed without building, but the extractor still downloads
      # every crate to resolve dependencies. Restore them on every run; save
      # only from main, because a cache saved on a PR or tag ref is visible to
      # that ref alone, while main's is visible to every PR and schedule.
      - name: Restore Cargo registry
        id: cargo-cache
        if: matrix.language == 'rust'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: codeql-cargo-${{ hashFiles('shell/src-tauri/Cargo.lock') }}
          restore-keys: codeql-cargo-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: Save Cargo registry
        if: >-
          matrix.language == 'rust'
          && github.ref == 'refs/heads/main'
          && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: codeql-cargo-${{ hashFiles('shell/src-tauri/Cargo.lock') }}
