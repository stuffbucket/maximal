name: Release

permissions:
  id-token: write
  contents: write

on:
  push:
    tags:
      - "v*"
  # Manual re-trigger for a tag that already exists — e.g. a tag pushed
  # via the default GITHUB_TOKEN (whose `push: tags` event is suppressed
  # by the anti-loop guard), or to rebuild a release. Select the tag
  # under "Use workflow from" so github.ref_name is the tag, not a branch
  # (the Validate step rejects branches). To recover a partially-failed
  # release, prefer "Re-run failed jobs" on the original run.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (must already exist; e.g. v0.1.0)
        required: true

# Serialize per-tag so a re-run or a double tag-push can't race two
# release runs against the same draft (the installer jobs would then
# double-build + clobber the same assets). Different tags still run
# concurrently. Never cancel in-flight — a release mid-notarization
# must finish, not be interrupted by a re-trigger.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Asset-reuse toggle (read via ${{ vars.RELEASE_REUSE_EXISTING_ASSETS }},
# a repo variable so it works for tag-triggered runs): set it to 'true' to
# let the windows-msi / windows-installer skip gates reuse already-attached
# assets for faster debug re-runs. Unset or any other value rebuilds
# everything from the tag commit (the default).
jobs:
  # Release builds trust only ci.yml's required `test` job for this exact
  # commit. Other CI lanes may keep running while independent release builds
  # start; branch checks or an earlier release-PR head are not accepted.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: Verify release identity and exact-SHA required-check evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
          # A tag push can race queued main-push CI plus its 20-minute suites.
          CI_EVIDENCE_WAIT_SECONDS: "1800"
        run: bun scripts/verify-release-source.ts

  release:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
    steps:
      # Fail fast on a bad trigger. The whole pipeline keys off
      # github.ref_name, which is only a real version when this runs on
      # a v* tag (push, or "Run workflow" with the tag selected under
      # "Use workflow from"). Running it from a branch (e.g. main) makes
      # ref_name="main", and changelogithub fails ~40s in with the
      # opaque "ref 'main' is not available as tags". Catch it in ~2s
      # with an actionable message instead.
      - name: Validate release ref
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Release must run on a vX.Y.Z tag, not '$TAG'."
            echo "::error::Cut a release by pushing a tag:  git tag vX.Y.Z && git push origin vX.Y.Z"
            echo "::error::(Running this workflow from a branch with no tag will not work — ref_name is the branch.)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: Configure package registry
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Detect pre-release
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *"-"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub Release notes (draft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          # release.yml owns the GitHub Release end to end: create it as a
          # DRAFT here, attach every asset across the downstream jobs, and
          # let `publish` flip draft→published+latest exactly once at the
          # end. That single publish is required for IMMUTABLE RELEASES —
          # a release can't be re-drafted to add assets once published.
          # release-please only creates the TAG (not a release), so there
          # is never a pre-existing release to adopt here.
          #
          # Idempotent: if a draft already exists (partial-failure re-run),
          # skip creation — the notes are already there and the downstream
          # jobs just need to attach their assets.
          EXISTING="$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft' 2>/dev/null || echo 'notfound')"
          if [ "$EXISTING" = "true" ]; then
            echo "Draft release for $TAG already exists — skipping creation (re-run)."
            exit 0
          fi
          # changelogithub computes notes from the previous v* tag. On the
          # first release no such tag exists and the tool produces a
          # malformed git range, so fall back to gh's auto-generated notes.
          PRIOR="$(git tag --list 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)"
          if [ -z "$PRIOR" ]; then
            echo "No prior v* tag — creating draft release with --generate-notes"
            FLAGS=(--draft)
            if [[ "${{ steps.prerelease.outputs.is_prerelease }}" == "true" ]]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" --title "$TAG" --generate-notes "${FLAGS[@]}"
          else
            echo "Prior tag $PRIOR — running changelogithub (draft)"
            # Name both ends. Left to itself, changelogithub reads the tag at
            # HEAD, and a commit carrying two tags (an rc and the next rc, or
            # the final release on its last rc) makes it give up.
            FLAGS=(--draft --from "$PRIOR" --to "$TAG")
            if [[ "${{ steps.prerelease.outputs.is_prerelease }}" == "true" ]]; then
              FLAGS+=(--prerelease)
            fi
            bunx changelogithub "${FLAGS[@]}"
          fi

  # The release source already passed generic CI. This lane performs only the
  # release-specific dependency inventory and license policy check.
  sbom:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: Configure package registry
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install production dependency graphs
        run: bun install --frozen-lockfile

      - name: Generate SBOM and run license scan
        run: |
          bun scripts/sbom.ts \
            --root . \
            --output SBOM.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: SBOM.cdx.json
          if-no-files-found: error

  # Build platform-neutral UI bytes once. Raw binaries and both in-repository
  # desktop packagers consume this exact artifact; macos-builder remains an
  # isolated signing boundary and builds its own producer input.
  ui:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: Configure package registry
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install UI dependencies
        run: |
          bun install --frozen-lockfile
          (cd shell && bun install --frozen-lockfile)

      - name: Build web UI and embed manifest
        run: |
          bun run build:ui
          bun run scripts/gen-ui-embed.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-ui
          path: |
            shell/dist
            src/generated/ui-embed.ts
          if-no-files-found: error

  # Apple Silicon is the only macOS target. Intel is not supported.
  binaries:
    needs:
      - preflight
      - ui
    permissions:
      contents: read
    # Public repo policy: no macOS runners. Bun's `--compile` cross-
    # compiles both targets from a Linux host. Windows binaries also cross-compile
    # cleanly from Linux (the resulting .exe is identical to one built
    # on a Windows runner).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: bun-darwin-arm64, artifact: darwin-arm64, ext: tar.gz }
          - { target: bun-windows-x64, artifact: windows-x64, ext: zip }
          # The Linux binaries also go into the Debian packages (linux-deb).
          - { target: bun-linux-x64, artifact: linux-x64, ext: tar.gz }
          - { target: bun-linux-arm64, artifact: linux-arm64, ext: tar.gz }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: Configure package registry
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the build-once UI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-ui
          path: .

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compile binaries
        shell: bash
        env:
          MAXIMAL_VERSION: ${{ steps.ver.outputs.version }}
          MAXIMAL_GIT_SHA: ${{ github.sha }}
          MAXIMAL_GIT_BRANCH: ${{ github.ref_name }}
          # Read the matrix value via env rather than inlining the
          # `${{ }}` expression into the shell condition — avoids a
          # shellcheck SC2193 false positive (it can't see the templated
          # value) and keeps workflow expressions out of executed shell.
          ARTIFACT: ${{ matrix.artifact }}
          BUN_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist-bin
          OUT="dist-bin/maximal"
          if [[ "$ARTIFACT" == windows-* ]]; then
            OUT="${OUT}.exe"
          fi

          # --define injects compile-time constants into the primary binary:
          #   __MAXIMAL_VERSION__   the stripped tag (e.g. "0.3.4")
          #   __MAXIMAL_GIT_SHA__   the full sha (40 hex)
          #   __MAXIMAL_GIT_BRANCH__ the ref name (e.g. "v0.3.4")
          #   __MAXIMAL_CHANNEL__   release channel: the prerelease label
          #     (e.g. "beta" from v0.4.33-beta.1) or "stable" for a plain
          #     vX.Y.Z tag. Drives which manifest channel the build polls
          #     (src/lib/update/update-check.ts). Derived from the tag so it matches
          #     the Detect-pre-release classification without a cross-job output.
          # src/lib/update/build-info.ts reads these via globalThis with a
          # package.json fallback for non-binary execution.
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-* ]]; then
            CHANNEL="${TAG#*-}"; CHANNEL="${CHANNEL%%.*}"
          else
            CHANNEL="stable"
          fi
          bun build --compile --minify --sourcemap \
            --target="$BUN_TARGET" \
            --define "__MAXIMAL_VERSION__=\"${MAXIMAL_VERSION}\"" \
            --define "__MAXIMAL_GIT_SHA__=\"${MAXIMAL_GIT_SHA}\"" \
            --define "__MAXIMAL_GIT_BRANCH__=\"${MAXIMAL_GIT_BRANCH}\"" \
            --define "__MAXIMAL_CHANNEL__=\"${CHANNEL}\"" \
            src/main.ts --outfile "$OUT"

      - name: Package
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          BASE="maximal-v${VERSION}-${{ matrix.artifact }}"
          mkdir -p dist-release
          cd dist-bin
          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            7z a "../dist-release/${BASE}.zip" maximal.exe
          else
            tar -czf "../dist-release/${BASE}.tar.gz" maximal
          fi
          cd ../dist-release
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${BASE}.${{ matrix.ext }}" > "${BASE}.${{ matrix.ext }}.sha256"
          else
            sha256sum "${BASE}.${{ matrix.ext }}" > "${BASE}.${{ matrix.ext }}.sha256"
          fi

      - name: Upload raw archive for packaging and verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binary-${{ matrix.artifact }}
          path: dist-release
          if-no-files-found: error

  # One job owns attachment of the raw archives and SBOM. Downstream package
  # jobs consume workflow artifacts rather than using the mutable draft as a
  # build transport.
  raw-assets:
    needs:
      - release
      - sbom
      - binaries
      - smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-binary-*
          path: dist-release
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: dist-release

      - uses: ./.github/actions/upload-release-asset
        with:
          tag: ${{ github.ref_name }}
          files: dist-release/*

  checksums:
    # Wait until every producer has attached its per-asset checksum. This also
    # prevents SHA256SUMS from depending on whichever draft mutations happened
    # to win a race.
    needs:
      - raw-assets
      - linux-deb
      - windows-installer
      - windows-msi
      - windows-shell
      - macos-dmg
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch per-arch sha256 files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sums && cd sums
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern '*.sha256'

      - name: Concatenate into SHA256SUMS
        run: |
          cat sums/*.sha256 | sort > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS to release
        uses: ./.github/actions/upload-release-asset
        with:
          tag: ${{ github.ref_name }}
          files: SHA256SUMS

  # Executes the Windows binary on a clean image; cross-compiled Mach-O
  # binaries cannot be executed on the public Linux runners.
  smoke:
    needs: binaries
    permissions:
      contents: read
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binary-windows-x64
          path: .

      - name: Unpack
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter '*.zip' | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath . -Force

      - name: Smoke check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($binary in @('maximal.exe')) {
            if (-not (Test-Path $binary)) {
              Write-Error "Missing release binary: $binary"
              exit 1
            }
          }

          .\maximal.exe debug --json | Out-File -FilePath debug.json -Encoding utf8
          Get-Content debug.json
          $j = Get-Content debug.json | ConvertFrom-Json
          foreach ($k in @('version','git','runtime','config','secrets','executor')) {
            if ($null -eq $j.$k) {
              Write-Error "Missing top-level key: $k"
              exit 1
            }
          }

  # Standard Homebrew release mechanic for a private tap: render
  # the formula with the just-published version + per-arch SHAs and
  # push it to `stuffbucket/homebrew-tap/Formula/maximal.rb`. Users
  # then `brew tap stuffbucket/tap` once and `brew upgrade maximal`
  # picks up subsequent releases automatically.
  #
  # Requires the `HOMEBREW_TAP_TOKEN` repo secret: a PAT or fine-
  # grained token with Contents:write on `stuffbucket/homebrew-tap`.
  # The job no-ops with a warning if the secret is absent so a
  # missing token doesn't fail the whole release.
  homebrew-tap:
    # After `publish`: sync-homebrew-formula.ts fetches each per-arch
    # .sha256 over public HTTPS, which only resolves once the release
    # is published (draft assets are not publicly downloadable).
    #
    # Skip for pre-releases: the tap's `maximal.rb` is the STABLE formula
    # (`brew install stuffbucket/tap/maximal`). Bumping it to a
    # `-beta.N` version would push the beta onto every stable Homebrew
    # user. `release` is in `needs` so this job can read is_prerelease.
    needs:
      - publish
      - release
    if: ${{ needs.release.outputs.is_prerelease == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Bump formula in stuffbucket/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — skipping tap bump."
            echo "::warning::Create a fine-grained PAT with Contents:write on stuffbucket/homebrew-tap and add it as a repo secret to enable."
            exit 0
          fi

          # Render the formula against the GitHub release we just
          # cut. The script fetches each per-arch .sha256 over HTTPS.
          mkdir -p out
          bun scripts/sync-homebrew-formula.ts \
            --org stuffbucket \
            --repo maximal \
            --version "$VERSION" \
            --output out/maximal.rb

          # Clone the tap, copy the rendered file in, push.
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/stuffbucket/homebrew-tap.git" \
            tap
          mkdir -p tap/Formula
          cp out/maximal.rb tap/Formula/maximal.rb

          cd tap
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add Formula/maximal.rb
          # Use --cached so this also catches the brand-new-file case
          # (untracked → staged → diff vs HEAD). git diff (no --cached)
          # was a no-op on a new file and silently skipped the commit.
          if git diff --cached --quiet -- Formula/maximal.rb; then
            echo "No formula changes for $TAG — already in sync."
            exit 0
          fi
          git commit -m "maximal: bump to $TAG"
          git push origin HEAD:main

  # ── Installers ───────────────────────────────────────────────────────

  # The signed DMG and the signed updater bundle the macOS app installs in
  # place must be attached (and the bundle verified) before `publish` seals
  # the release.
  #
  # The private builder is started with a short-lived app-repoman
  # installation token, only when its files are not already on the draft.
  # `APP_ID` (variable) and `APP_PRIVATE_KEY` (secret) live in the `release`
  # environment (deploys from `v*` tags only). app-repoman needs Actions
  # read/write on stuffbucket/macos-builder. App keys do not expire, unlike a
  # PAT. Everything that touches this repository keeps `github.token`.
  macos-dmg:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    # Above the ~30 min builder/notarization wait this job polls for.
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      # The builder's name for the updater bundle (`updater_name` in
      # .macos-builder/config); it arrives with `.sig` and `.sha256`.
      TARBALL: maximal-${{ github.ref_name }}-darwin-arm64.app.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: Check whether the builder files are already on the draft
        id: builder-files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name' 2>/dev/null || true)"
          has() { grep -Fxq "$1" <<<"$assets"; }
          if { has "Maximal.dmg" \
              || { has "maximal-${TAG}-darwin-arm64.dmg" \
                && has "maximal-${TAG}-darwin-arm64.dmg.sha256"; }; } \
            && has "$TARBALL" && has "$TARBALL.sig" && has "$TARBALL.sha256"; then
            echo "The DMG and ${TARBALL} (+ .sig, .sha256) are already on the draft."
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      # Only a dispatch needs this token, so a rerun whose files are already
      # on the draft needs no key.
      - name: Create an app-repoman token for macos-builder
        id: builder-token
        if: steps.builder-files.outputs.built != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: stuffbucket
          repositories: macos-builder
          permission-actions: write

      - name: Start the macOS builder and wait for its files on the draft
        if: steps.builder-files.outputs.built != 'true'
        env:
          BUILDER_TOKEN: ${{ steps.builder-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SRC="Maximal.dmg"
          DST="maximal-${TAG}-darwin-arm64.dmg"
          ASSETS=""
          refresh() {
            ASSETS="$(gh release view "$TAG" --repo "$REPO" --json assets \
              --jq '.assets[].name' 2>/dev/null || true)"
          }
          has() { grep -Fxq "$1" <<<"$ASSETS"; }
          built() {
            { has "$SRC" || { has "$DST" && has "$DST.sha256"; }; } \
              && has "$TARBALL" && has "$TARBALL.sig" && has "$TARBALL.sha256"
          }
          echo "Dispatching the private macOS builder for ${REPO} at ${TAG}…"
          GH_TOKEN="$BUILDER_TOKEN" gh workflow run build.yml \
            --repo stuffbucket/macos-builder --ref main \
            -f "repo=${REPO}" -f "ref=${TAG}"
          echo "Polling the draft for ${SRC} and ${TARBALL} (+ .sig, .sha256) (sign + notarize takes a few min)…"
          ok=0
          for i in $(seq 1 40); do   # ~30 min cap (45s × 40)
            sleep 45
            refresh
            if built; then
              ok=1; echo "Builder files present after ~$((i * 45))s."; break
            fi
          done
          if [ "$ok" -ne 1 ]; then
            missing=""
            if ! has "$SRC"; then
              has "$DST" || missing="$missing $DST"
              has "$DST.sha256" || missing="$missing $DST.sha256"
            fi
            for f in "$TARBALL" "$TARBALL.sig" "$TARBALL.sha256"; do
              has "$f" || missing="$missing $f"
            done
            echo "::error::Timed out waiting for${missing} on the draft release. See the stuffbucket/macos-builder run; the release stays a draft (not published without a macOS build)." >&2
            exit 1
          fi

      - name: Normalize the .dmg name and checksum on the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SRC="Maximal.dmg"
          DST="maximal-${TAG}-darwin-arm64.dmg"
          assets="$(gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name')"
          if ! grep -Fxq "$SRC" <<<"$assets"; then
            if grep -Fxq "$DST" <<<"$assets" \
              && grep -Fxq "$DST.sha256" <<<"$assets"; then
              echo "${DST} (+ .sha256) is already normalized."
              exit 0
            fi
            echo "::error::Neither ${SRC} nor a complete ${DST} (+ .sha256) is attached."
            exit 1
          fi
          # Normalize the asset name and checksum before publication.
          tmp="$(mktemp -d)"
          gh release download "$TAG" --repo "$REPO" --pattern "$SRC" --dir "$tmp"
          mv "$tmp/$SRC" "$tmp/$DST"
          ( cd "$tmp" && shasum -a 256 "$DST" > "$DST.sha256" )
          gh release upload "$TAG" --repo "$REPO" "$tmp/$DST" "$tmp/$DST.sha256" --clobber
          gh release delete-asset "$TAG" "$SRC" --repo "$REPO" --yes 2>/dev/null || true
          gh release delete-asset "$TAG" "$SRC.sha256" --repo "$REPO" --yes 2>/dev/null || true
          echo "Shipped ${DST} (+ .sha256); removed builder-named ${SRC}."

      # The macOS app installs this bundle in place only if it is signed by
      # the key in tauri.conf.json and for this version. Check both here, on
      # every run, so a bad bundle keeps the release a draft.
      - name: Verify the macOS updater bundle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          gh release download "$TAG" --repo "$REPO" --dir "$dir" \
            --pattern "$TARBALL" --pattern "$TARBALL.sig" --pattern "$TARBALL.sha256"
          ( cd "$dir" && sha256sum -c "$TARBALL.sha256" )
          bun scripts/verify-updater-signature.ts \
            --file "$dir/$TARBALL" --version "${TAG#v}"

  # Windows PowerShell installer — install.ps1 shipped verbatim + sha256.
  windows-installer:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip if installer already attached
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE: ${{ vars.RELEASE_REUSE_EXISTING_ASSETS }}
        run: |
          set -euo pipefail
          if [ "${REUSE:-}" != "true" ]; then
            echo "RELEASE_REUSE_EXISTING_ASSETS not 'true' — staging from tag commit."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || echo '')"
          if grep -Fxq "install.ps1" <<<"$ASSETS" \
            && grep -Fxq "install.ps1.sha256" <<<"$ASSETS"; then
            echo "Reuse enabled and install.ps1 (+ .sha256) already attached to $TAG — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Reuse enabled but install.ps1 not yet present on $TAG — staging."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage installer + sha256
        if: steps.skip.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp build/windows/install.ps1 dist-release/install.ps1
          (cd dist-release && shasum -a 256 install.ps1 > install.ps1.sha256)
          ls -la dist-release

      - name: Attach installer to release
        if: steps.skip.outputs.skip != 'true'
        uses: ./.github/actions/upload-release-asset
        with:
          tag: ${{ env.TAG }}
          files: |
            dist-release/install.ps1
            dist-release/install.ps1.sha256

  # Windows MSI (WiX, per-user). Wraps the windows-x64 workflow artifact
  # produced by `binaries`.
  windows-msi:
    needs:
      - release
      - binaries
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip if MSI already attached
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE: ${{ vars.RELEASE_REUSE_EXISTING_ASSETS }}
        shell: bash
        run: |
          set -euo pipefail
          MSI="maximal-${TAG}-windows-x64.msi"
          if [ "${REUSE:-}" != "true" ]; then
            echo "RELEASE_REUSE_EXISTING_ASSETS not 'true' — building from tag commit."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || echo '')"
          if grep -Fxq "$MSI" <<<"$ASSETS" \
            && grep -Fxq "$MSI.sha256" <<<"$ASSETS"; then
            echo "Reuse enabled and $MSI (+ .sha256) already attached to $TAG — skipping build + upload."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Reuse enabled but $MSI not yet present on $TAG — building."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version
        id: ver
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download windows-x64 zip + sha256
        if: steps.skip.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binary-windows-x64
          path: dist-bin

      - name: Verify windows-x64 SHA-256
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="maximal-${TAG}-windows-x64.zip"
          ( cd dist-bin && sha256sum -c "$ZIP.sha256" )

      - name: Unpack zip
        if: steps.skip.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem -Path dist-bin -Filter '*.zip' | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath staging -Force
          foreach ($binary in @('maximal.exe')) {
            if (-not (Test-Path (Join-Path 'staging' $binary))) {
              Write-Error "$binary missing from $($zip.Name)"
              exit 1
            }
          }
          Get-ChildItem staging

      - name: Install WiX
        if: steps.skip.outputs.skip != 'true'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $userBin = Join-Path $env:USERPROFILE '.dotnet\tools'
          echo $userBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$userBin\wix.exe" --version

      - name: Build MSI
        if: steps.skip.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.ver.outputs.version }}'
          $out = "dist-release\maximal-${env:TAG}-windows-x64.msi"
          New-Item -ItemType Directory -Path dist-release -Force | Out-Null
          # CLI-only MSI: no WiX extensions needed. WiX resolves both .wxs
          # source executables via -bindpath.
          wix build build\windows\maximal.wxs `
            -d "Version=$version" `
            -arch x64 `
            -bindpath staging `
            -out $out

      - name: SHA-256
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd dist-release
          sha256sum "maximal-${TAG}-windows-x64.msi" > "maximal-${TAG}-windows-x64.msi.sha256"
          cat "maximal-${TAG}-windows-x64.msi.sha256"

      - name: Attach MSI to release
        if: steps.skip.outputs.skip != 'true'
        uses: ./.github/actions/upload-release-asset
        with:
          tag: ${{ env.TAG }}
          files: |
            dist-release/maximal-${{ env.TAG }}-windows-x64.msi
            dist-release/maximal-${{ env.TAG }}-windows-x64.msi.sha256

  # Verify the MSI works end-to-end on a clean Windows image: silent
  # install → assert registry/files/PATH → run the installed binary →
  # uninstall → assert clean removal. Gates `publish` directly via the
  # job graph (no sentinel asset needed now). Assertions track
  # build/windows/maximal.wxs (per-user install to
  # %LocalAppData%\Programs\maximal, ARP DisplayName "maximal", HKCU
  # marker Software\stuffbucket\maximal\installed=1, install dir on PATH).
  windows-msi-verify:
    needs: windows-msi
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      # write, not read: downloads the MSI from the DRAFT release, which a
      # read-only token can't see ("release not found").
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Resolve asset name
        id: names
        shell: bash
        run: echo "msi=maximal-${TAG}-windows-x64.msi" >> "$GITHUB_OUTPUT"

      - name: Download MSI from release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ steps.names.outputs.msi }}" \
            --dir .
          ls -lh "${{ steps.names.outputs.msi }}"

      - name: Install MSI silently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path "${{ steps.names.outputs.msi }}").Path
          $log = Join-Path $env:GITHUB_WORKSPACE 'install.log'
          # msiexec is a GUI-subsystem binary: invoked bare it detaches and
          # PowerShell returns 0 regardless. -Wait -PassThru blocks and
          # gives the real exit code. 0 = success; 3010/1641 = restart-related.
          $p = Start-Process msiexec.exe `
            -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" `
            -Wait -PassThru
          Write-Host "msiexec /i exit code: $($p.ExitCode)"
          if ($p.ExitCode -notin @(0, 1641, 3010)) {
            throw "MSI install failed (exit $($p.ExitCode))"
          }

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-install-log-${{ env.TAG }}
          path: install.log
          if-no-files-found: ignore

      - name: Verify post-install state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\maximal'
          foreach ($binary in @('maximal.exe')) {
            $binaryPath = Join-Path $installRoot $binary
            if (-not (Test-Path $binaryPath)) { throw "$binary missing at $binaryPath" }
            Write-Host "$binary present ($((Get-Item $binaryPath).Length) bytes)"
          }

          # Don't assert on the Add/Remove-Programs (Uninstall) registry key:
          # for a per-user MSI on a fresh CI profile the HKCU\...\Uninstall
          # hive may not exist at all, and the exact location varies. A
          # successful `msiexec /x <file>` in the Uninstall step proves the
          # product is registered with Windows Installer. Assert only the
          # signals build/windows/maximal.wxs makes deterministic: our own
          # HKCU marker (hard) and the PATH entry (soft — log, don't fail).
          $marker = Get-ItemPropertyValue 'HKCU:\Software\stuffbucket\maximal' 'installed' -ErrorAction SilentlyContinue
          if ($marker -ne 1) { throw "HKCU marker Software\stuffbucket\maximal\installed != 1 (got '$marker')" }

          $userPath = [Environment]::GetEnvironmentVariable('PATH', 'User')
          if ($userPath -notlike '*Programs\maximal*') {
            Write-Warning "install dir not found in user PATH (non-fatal): $userPath"
          } else {
            Write-Host "install dir present in user PATH"
          }
          Write-Host "post-install state OK"

      - name: Smoke-test installed binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Run from the INSTALLED location — proves the MSI placed a
          # working binary. `debug --json` needs no credentials.
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\maximal\maximal.exe'
          & $exe debug --json | Out-File -FilePath debug.json -Encoding utf8
          $j = Get-Content debug.json | ConvertFrom-Json
          foreach ($k in @('version','git','runtime','config','secrets','executor')) {
            if ($null -eq $j.$k) { throw "Missing top-level key in debug --json: $k" }
          }
          Write-Host "installed binary debug --json OK (version=$($j.version))"

      - name: Uninstall MSI silently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Uninstall by the package file — msiexec resolves the ProductCode
          # from it (no brittle registry lookup), and a clean exit also
          # confirms the product was actually registered by the install.
          $msi = (Resolve-Path "${{ steps.names.outputs.msi }}").Path
          $log = Join-Path $env:GITHUB_WORKSPACE 'uninstall.log'
          $p = Start-Process msiexec.exe `
            -ArgumentList "/x `"$msi`" /qn /norestart /l*v `"$log`"" `
            -Wait -PassThru
          Write-Host "msiexec /x exit code: $($p.ExitCode)"
          if ($p.ExitCode -notin @(0, 1641, 3010)) {
            throw "MSI uninstall failed (exit $($p.ExitCode))"
          }

      - name: Upload uninstall log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-uninstall-log-${{ env.TAG }}
          path: uninstall.log
          if-no-files-found: ignore

      - name: Verify clean removal
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\maximal'
          foreach ($binary in @('maximal.exe')) {
            $binaryPath = Join-Path $installRoot $binary
            if (Test-Path $binaryPath) {
              throw "$binary still present after uninstall: $binaryPath"
            }
          }
          # Check the marker VALUE is gone (the parent key may linger empty,
          # so don't assert on the key path).
          $m = Get-ItemPropertyValue 'HKCU:\Software\stuffbucket\maximal' 'installed' -ErrorAction SilentlyContinue
          if ($null -ne $m) { throw "HKCU marker 'installed' still present after uninstall (got '$m')" }
          $userPath = [Environment]::GetEnvironmentVariable('PATH', 'User')
          if ($userPath -like '*Programs\maximal*') {
            Write-Warning "install dir still in user PATH after uninstall (non-fatal)"
          }
          Write-Host "clean removal verified"

  # Windows desktop installer built around the release sidecars.
  windows-shell:
    needs:
      - release
      - binaries
      - ui
    runs-on: windows-2022
    timeout-minutes: 20
    # Holds the updater signing secrets; the environment deploys from v* tags
    # only. Reruns are safe: this job needs binaries -> release, whose
    # Validate step rejects any non-tag ref first.
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      # Retry crate downloads instead of failing on a transient connection
      # reset (belt-and-suspenders alongside the cargo cache).
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip if Windows shell installer already attached
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE: ${{ vars.RELEASE_REUSE_EXISTING_ASSETS }}
        shell: bash
        run: |
          set -euo pipefail
          SETUP="maximal-${TAG}-windows-x64-setup.exe"
          if [ "${REUSE:-}" != "true" ]; then
            echo "RELEASE_REUSE_EXISTING_ASSETS not 'true' — building from tag commit."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || echo '')"
          if grep -Fxq "$SETUP" <<<"$ASSETS" \
            && grep -Fxq "$SETUP.sha256" <<<"$ASSETS" \
            && grep -Fxq "$SETUP.sig" <<<"$ASSETS"; then
            echo "Reuse enabled and $SETUP (+ .sha256, .sig) already attached — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version
        id: ver
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun
        if: steps.skip.outputs.skip != 'true'
        with:
          bun-version: 1.4.3

      # Pinned Rust + the Cargo cache warmed from main by
      # windows-rust-cache.yml (a cache saved on this tag would be invisible
      # to the next release, so this job only restores).
      - name: Set up Rust
        if: steps.skip.outputs.skip != 'true'
        uses: ./.github/actions/setup-rust-windows

      # setup-bun adds a Git-Bash-style PATH; bun steps must run under bash
      # (pwsh/cmd can't resolve it on Windows).
      - name: Configure package registry
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install dependencies
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: bun install --frozen-lockfile

      - name: Install shell dependencies
        if: steps.skip.outputs.skip != 'true'
        working-directory: shell
        shell: bash
        run: bun install --frozen-lockfile

      - name: Download the build-once UI
        if: steps.skip.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-ui
          path: .

      # Reuse the exact sidecars the `binaries` job built, so the tray app
      # embeds the identical release executables without the draft as transport.
      - name: Download windows-x64 sidecars
        if: steps.skip.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binary-windows-x64
          path: dist-bin

      - name: Verify windows-x64 sidecars
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="maximal-${TAG}-windows-x64.zip"
          ( cd dist-bin && sha256sum -c "$ZIP.sha256" )

      - name: Place sidecars as Tauri externalBin inputs
        if: steps.skip.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem dist-bin -Filter '*.zip' | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath staging -Force
          $binaries = @{
            'maximal.exe' = 'maximal-x86_64-pc-windows-msvc.exe'
          }
          New-Item -ItemType Directory -Force -Path 'shell\src-tauri\binaries' | Out-Null
          foreach ($entry in $binaries.GetEnumerator()) {
            $source = Join-Path 'staging' $entry.Key
            if (-not (Test-Path $source)) { throw "$($entry.Key) missing from zip" }
            Copy-Item $source (Join-Path 'shell\src-tauri\binaries' $entry.Value) -Force
          }
          Get-ChildItem 'shell\src-tauri\binaries'

      # The app verifies every in-place update against the public key in
      # tauri.conf.json. Fail before building if it isn't the key the
      # signing secrets belong to (the repo variable holds the same public key).
      - name: Check updater public key
        if: steps.skip.outputs.skip != 'true'
        shell: pwsh
        env:
          EXPECTED_PUBKEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $conf = Get-Content -Raw 'shell/src-tauri/tauri.conf.json' | ConvertFrom-Json
          $configured = $conf.plugins.updater.pubkey
          if (-not $env:EXPECTED_PUBKEY) {
            Write-Error 'Repository variable TAURI_SIGNING_PUBLIC_KEY is not set.'
          }
          if ($configured -cne $env:EXPECTED_PUBKEY) {
            Write-Error 'plugins.updater.pubkey in tauri.conf.json does not match TAURI_SIGNING_PUBLIC_KEY.'
          }
          Write-Host 'Updater public key matches.'

      - name: Tauri build (Windows, NSIS)
        if: steps.skip.outputs.skip != 'true'
        working-directory: shell
        shell: bash
        env:
          MAXIMAL_VERSION: ${{ steps.ver.outputs.version }}
          # createUpdaterArtifacts signs the NSIS installer (writing
          # <setup>.exe.sig) with this key; the CLI reads both from the
          # environment and never prints them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Stamp the real version (tauri.conf.json hardcodes 0.0.0), skip
          # beforeBuildCommand — the UI is already built above, and the hook
          # runs via cmd.exe where bun isn't resolvable on Windows — and sign
          # the installer for in-place updates (the signature records this
          # version, which the app checks against the desktop manifest).
          bun run tauri build --bundles nsis \
            --config "{\"version\":\"${MAXIMAL_VERSION}\",\"build\":{\"beforeBuildCommand\":\"\"},\"bundle\":{\"createUpdaterArtifacts\":true}}"

      # The check the app makes before installing: signed by the key in
      # tauri.conf.json, for this version.
      - name: Verify the updater signature
        if: steps.skip.outputs.skip != 'true'
        shell: bash
        env:
          MAXIMAL_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          setups=(shell/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ "${#setups[@]}" -ne 1 ]; then
            echo "::error::Expected one NSIS installer, found ${#setups[@]}."
            exit 1
          fi
          bun scripts/verify-updater-signature.ts \
            --file "${setups[0]}" --version "$MAXIMAL_VERSION"

      - name: Verify NSIS installed sidecars
        if: steps.skip.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsisDir = 'shell/src-tauri/target/release/bundle/nsis'
          $setup = Get-ChildItem -Path $nsisDir -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not produced under $nsisDir" }
          $installRoot = Join-Path $env:LOCALAPPDATA 'Maximal'
          try {
            $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "NSIS install failed: $($install.ExitCode)" }
            foreach ($binary in @('maximal.exe')) {
              $binaryPath = Join-Path $installRoot $binary
              if (-not (Test-Path $binaryPath)) { throw "$binary missing at $binaryPath" }
            }
          } finally {
            Get-Process -Name 'Maximal', 'maximal', 'maximal-shell' `
              -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            $uninstaller = Get-ChildItem $installRoot -Recurse -Filter 'uninstall.exe' `
              -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($uninstaller) {
              Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait
            }
          }
          foreach ($binary in @('maximal.exe')) {
            $binaryPath = Join-Path $installRoot $binary
            if (Test-Path $binaryPath) { throw "$binary remains after NSIS uninstall" }
          }

      - name: Stage NSIS installer + sha256 + updater signature
        if: steps.skip.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsisDir = 'shell/src-tauri/target/release/bundle/nsis'
          $setup = Get-ChildItem -Path $nsisDir -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { Write-Error "NSIS installer not produced under $nsisDir"; exit 1 }
          $sig = "$($setup.FullName).sig"
          if (-not (Test-Path $sig)) { Write-Error "Updater signature not produced: $sig"; exit 1 }
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $name = "maximal-${env:TAG}-windows-x64-setup.exe"
          $dst = Join-Path 'dist-release' $name
          Copy-Item $setup.FullName $dst -Force
          # The signature covers the file's bytes, not its name, so it travels
          # with the renamed installer. The manifest job copies it verbatim
          # into https://mxml.sh/updates/desktop/<channel>.json.
          Copy-Item $sig "$dst.sig" -Force
          # `<hash>  <filename>` to match the sha256sum convention the other assets use.
          $hash = (Get-FileHash -Algorithm SHA256 $dst).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "$dst.sha256"
          Write-Host "staged $dst ($((Get-Item $dst).Length) bytes)"
          Get-Content "$dst.sha256"

      - name: Attach Windows shell installer to release
        if: steps.skip.outputs.skip != 'true'
        uses: ./.github/actions/upload-release-asset
        with:
          tag: ${{ env.TAG }}
          files: |
            dist-release/maximal-${{ env.TAG }}-windows-x64-setup.exe
            dist-release/maximal-${{ env.TAG }}-windows-x64-setup.exe.sha256
            dist-release/maximal-${{ env.TAG }}-windows-x64-setup.exe.sig

  # ── Linux (Debian 13, Ubuntu 24.04, Ubuntu 26.04) ────────────────────

  # Two Debian packages per architecture, published through the signed apt
  # repository at https://mxml.sh/apt (deploy-pages.yml):
  #   maximal_<ver>_<arch>.deb          the release binaries from `binaries`,
  #                                     a user systemd unit, the apt marker
  #   maximal-desktop_<ver>_<arch>.deb  the Tauri tray app; runs maximal's
  #                                     /usr/bin/maximal as its sidecar and
  #                                     depends on maximal (= <ver>)
  # Built on Ubuntu 24.04, the oldest glibc of the targets, so they run on
  # Debian 13 and Ubuntu 26.04 too, on a native runner per architecture
  # (WebKitGTK doesn't cross-compile from the x64 runner).
  linux-deb:
    needs:
      - release
      - binaries
      - ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, artifact: linux-x64, runner: ubuntu-24.04 }
          - { arch: arm64, artifact: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    # A cold Rust release build of the tray app takes longer than 20 minutes.
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      ARCH: ${{ matrix.arch }}
      ARTIFACT: ${{ matrix.artifact }}
      # Retry crate downloads instead of failing on a transient reset.
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: ver
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # The same binaries as the raw archive, so the version and channel
      # stamped by `binaries` are what apt installs.
      - name: Download the release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binary-${{ matrix.artifact }}
          path: dist-bin

      - name: Build the maximal package from the release binaries
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TARBALL="maximal-${TAG}-${ARTIFACT}.tar.gz"
          mkdir -p dist-release
          ( cd dist-bin && sha256sum -c "$TARBALL.sha256" && tar -xzf "$TARBALL" )
          bash build/linux/build-maximal-deb.sh "$VERSION" "$ARCH" dist-bin dist-release

      - name: Install the tray app's build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev

      - name: Set up Rust
        uses: ./.github/actions/setup-rust-linux

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: Configure package registry
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install shell dependencies
        working-directory: shell
        run: bun install --frozen-lockfile

      - name: Download the build-once UI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-ui
          path: .

      # tauri.linux.conf.json names the binary maximal-desktop, adds the tray
      # library and installs the apt marker. `externalBin: []` keeps the
      # sidecars out: the app runs maximal's /usr/bin/maximal, next to its own
      # executable.
      - name: Tauri build (Linux, deb)
        working-directory: shell
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          bun run tauri build --bundles deb \
            --config "{\"version\":\"${VERSION}\",\"build\":{\"beforeBuildCommand\":\"\"},\"bundle\":{\"externalBin\":[]}}"

      - name: Repack as maximal-desktop
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(shell/src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::Expected one Tauri .deb, found ${#debs[@]}."
            exit 1
          fi
          bash build/linux/repack-desktop-deb.sh "$VERSION" "$ARCH" "${debs[0]}" dist-release

      # GitHub Pages serves files up to 100 MB; the apt repository refuses
      # anything over 95 MB, so catch it here, before the release publishes.
      - name: Check sizes and write checksums
        run: |
          set -euo pipefail
          cd dist-release
          for deb in *.deb; do
            size="$(stat -c %s "$deb")"
            echo "$deb: $((size / 1024 / 1024)) MB"
            if [ "$size" -gt $((95 * 1024 * 1024)) ]; then
              echo "::error::$deb is over 95 MB, too big for the apt repository on GitHub Pages."
              exit 1
            fi
            sha256sum "$deb" > "$deb.sha256"
          done
          ls -la

      - name: Attach the Debian packages to the release
        uses: ./.github/actions/upload-release-asset
        with:
          tag: ${{ env.TAG }}
          files: |
            dist-release/maximal_${{ steps.ver.outputs.version }}_${{ matrix.arch }}.deb
            dist-release/maximal_${{ steps.ver.outputs.version }}_${{ matrix.arch }}.deb.sha256
            dist-release/maximal-desktop_${{ steps.ver.outputs.version }}_${{ matrix.arch }}.deb
            dist-release/maximal-desktop_${{ steps.ver.outputs.version }}_${{ matrix.arch }}.deb.sha256

      - name: Upload packages for smoke tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-debs-${{ matrix.arch }}
          path: dist-release
          if-no-files-found: error

  # Install both packages in clean Debian 13, Ubuntu 24.04 and Ubuntu 26.04
  # containers on both architectures: apt resolves every dependency, the CLI
  # reports its version, the proxy answers on 127.0.0.1 and logs an available
  # update with the apt command, and maximal-desktop ships no copy of the
  # binaries. See build/linux/smoke-deb.sh.
  linux-deb-smoke:
    name: linux-deb-smoke (${{ matrix.image }}, ${{ matrix.arch }})
    needs: linux-deb
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: ["debian:13", "ubuntu:24.04", "ubuntu:26.04"]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      ARCH: ${{ matrix.arch }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the packages from the build lane
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-debs-${{ matrix.arch }}
          path: debs

      - name: Verify package checksums
        run: ( cd debs && sha256sum -c ./*.sha256 )

      - name: Install and run in ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/debs:/debs:ro" "$IMAGE" \
            bash /src/build/linux/smoke-deb.sh "${TAG#v}" /debs

  # Publish only after every required artifact and verification job succeeds.
  # Failures leave the release draft mutable for a re-run.
  publish:
    needs:
      - release
      - raw-assets
      - checksums
      - smoke
      - windows-installer
      - windows-msi
      - windows-msi-verify
      - macos-dmg
      - windows-shell
      - linux-deb
      - linux-deb-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent: if a prior run already flipped this release to
          # published, a re-run of `publish` (e.g. retrying a later job)
          # must be a no-op rather than re-running the draft→published
          # transition on a live release.
          DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo 'true')"
          if [ "$DRAFT" = "false" ]; then
            echo "Release $TAG is already published — nothing to do."
            exit 0
          fi
          if [[ "${{ needs.release.outputs.is_prerelease }}" == "true" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          echo "Published $TAG"

  # Propose the schema-2 updates manifest after publication without rebuilding
  # Astro. The generator consumes this release's immutable tag and assets and
  # preserves sibling channels. A rolling PR keeps protected `main` as the
  # source of truth; a maintainer merge triggers the existing site/** Pages
  # deployment. GITHUB_TOKEN-created PRs do not trigger CI, so this job also
  # dispatches the required check against the exact pushed head SHA.
  manifest:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: updates-manifest-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - name: Configure package registry
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update the protected manifest PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          HEAD_BRANCH: automation/updates-manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PRS="$(bun scripts/list-manifest-prs.ts)"
          PR_COUNT="$(jq 'length' <<<"$PRS")"
          if [ "$PR_COUNT" -gt 1 ]; then
            echo "::error::Expected at most one open manifest PR, found $PR_COUNT."
            exit 1
          fi

          REMOTE_SHA="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')"
          if [ "$PR_COUNT" -eq 1 ]; then
            if [ -z "$REMOTE_SHA" ]; then
              echo "::error::Open manifest PR has no remote head branch."
              exit 1
            fi
            PR_SHA="$(jq -r '.[0].headRefOid' <<<"$PRS")"
            if [ "$REMOTE_SHA" != "$PR_SHA" ]; then
              echo "::error::Manifest PR head moved during discovery."
              exit 1
            fi
            git fetch origin "refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
            git switch --create "$HEAD_BRANCH" --track "origin/$HEAD_BRANCH"
            git merge --no-edit origin/main
          else
            git switch --create "$HEAD_BRANCH" origin/main
          fi

          if [[ "$TAG" == *-* ]]; then
            CHANNEL="${TAG#*-}"
            CHANNEL="${CHANNEL%%.*}"
          else
            CHANNEL="stable"
          fi

          CURRENT_TAG="$(jq -r --arg channel "$CHANNEL" \
            '.channels[$channel].tag // ""' \
            site/public/updates/manifest.json)"
          if [ "$CURRENT_TAG" = "$TAG" ]; then
            echo "channels.${CHANNEL} already points at ${TAG}; skipping regeneration."
          else
            # Also writes updates/desktop/<channel>.json when the release
            # carries signed desktop updates (<setup>.exe.sig,
            # <name>.app.tar.gz.sig).
            bun scripts/write-updates-manifest.ts --tag "$TAG"
            bun test \
              tests/write-updates-manifest.test.ts \
              tests/site-committed-manifest.test.ts \
              tests/updates-manifest.test.ts \
              tests/hydrate-manifest.test.ts \
              tests/update-check.test.ts
            git add -A -- site/public/updates
            if ! git diff --cached --quiet -- site/public/updates; then
              git commit -m "chore(site): update updates manifest for $TAG"
            fi
          fi

          if [ "$PR_COUNT" -eq 0 ] && git diff --quiet origin/main...HEAD; then
            echo "Manifest for ${TAG} is already on main — no PR needed."
            exit 0
          fi

          if [ "$PR_COUNT" -eq 1 ]; then
            git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
          elif [ -n "$REMOTE_SHA" ]; then
            git push \
              --force-with-lease="refs/heads/${HEAD_BRANCH}:${REMOTE_SHA}" \
              origin "HEAD:refs/heads/${HEAD_BRANCH}"
          else
            git push --set-upstream origin "$HEAD_BRANCH"
          fi

          HEAD_SHA="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')"
          if [ -z "$HEAD_SHA" ] || [ "$HEAD_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Remote manifest branch does not match the generated commit."
            exit 1
          fi

          TITLE="chore(site): update updates manifest for $TAG"
          BODY="Published ${TAG} is now represented in site/public/updates/manifest.json (and, with signed desktop updates, site/public/updates/desktop/). Merge this PR after the required test check passes; the resulting main push deploys Pages."
          if [ "$PR_COUNT" -eq 0 ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main \
              --head "$HEAD_BRANCH" --title "$TITLE" --body "$BODY"
          else
            PR_NUMBER="$(jq -r '.[0].number' <<<"$PRS")"
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --body "$BODY"
          fi

          CURRENT="$(bun scripts/list-manifest-prs.ts)"
          CURRENT_COUNT="$(jq 'length' <<<"$CURRENT")"
          CURRENT_SHA="$(jq -r '.[0].headRefOid // ""' <<<"$CURRENT")"
          if [ "$CURRENT_COUNT" -ne 1 ] || [ "$CURRENT_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Manifest PR does not point at the pushed head SHA."
            exit 1
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$HEAD_BRANCH" -f expected_sha="$HEAD_SHA"
          echo "Dispatched CI for $(jq -r '.[0].url' <<<"$CURRENT") at $HEAD_SHA."
