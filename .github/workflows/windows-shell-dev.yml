# Windows Tauri shell fast-iteration harness (manual).
#
# The macOS menu-bar app (shell/) is built by the private macOS builder via
# .macos-builder/build.sh; the shell has NEVER been cross-built for Windows,
# even though its tray / menu / notification code is not macOS-gated and
# tauri.conf.json declares `targets: "all"`. We develop on macOS and cannot
# build Tauri-for-Windows locally, so this workflow is the only way to verify
# the Windows shell actually compiles and bundles.
#
# It is `workflow_dispatch`-only (never on push/PR/tag) and runs entirely on
# a windows-2022 runner:
#
#   1. Build the embedded settings/dashboard UI + the ui-embed manifest.
#   2. Compile the proxy sidecar for win-x64 via scripts/build-sidecar.ts,
#      which stages its target-triple externalBin input under
#      shell/src-tauri/binaries/.
#   3. Run the native shell tests under Windows, including quit ordering.
#   4. `bun run tauri build` for Windows → NSIS per-user installer (+ the
#      bare .exe). NSIS is chosen over WiX/MSI to match the macOS per-user,
#      no-admin model (installMode: currentUser in tauri.conf.json).
#   5. Install the packaged app, seed isolated Claude Code and Codex fixtures,
#      launch it, and prove its sidecar starts.
#   6. Reinstall while it is running, verify the captured old process pair exits,
#      then launch the replacement and require a healthy sidecar response.
#   7. Prove both packaged configurators applied their routing, route a taskbar
#      action through the single running instance, send its window WM_CLOSE, and
#      verify bounded cleanup plus exact process exit.
#   8. Relaunch, forcibly terminate only the shell PID, and verify Job Object
#      containment removes the exact sidecar process and its listeners.
#   9. Relaunch, then run the NSIS uninstaller while Maximal is still running.
#      A bounded deadline catches regressions where the uninstaller waits forever.
#
# Trigger: Actions tab -> "windows shell (dev)" -> Run workflow, pick the
# branch. Or: gh workflow run windows-shell-dev.yml --ref agent/win-shell

name: windows shell (dev)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Synthetic version for the dev build (no leading v)"
        required: false
        default: "0.0.0-dev"

# A second dispatch supersedes an in-flight one for the same branch.
concurrency:
  group: windows-shell-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      MAXIMAL_VERSION: ${{ github.event.inputs.version }}
      MAXIMAL_GIT_SHA: ${{ github.sha }}
      MAXIMAL_GIT_BRANCH: ${{ github.ref_name }}
      MAXIMAL_CHANNEL: dev
      # Force a fresh sidecar compile so version metadata is re-stamped and the
      # up-to-date short-circuit in build-sidecar.ts can't skip the win-x64 build.
      MAXIMAL_FORCE_SIDECAR: "1"
      # Retry crate downloads instead of failing on a transient connection
      # reset (belt-and-suspenders alongside the cargo cache).
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3
          cache-dependencies: "true"

      # Pinned Rust + the Cargo cache warmed from main by
      # windows-rust-cache.yml (restore only, shared with the release job).
      - name: Set up Rust
        uses: ./.github/actions/setup-rust-windows

      - name: Configure package registry
        shell: bash
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install dependencies
        # bash: setup-bun adds a Git-Bash-style PATH ($HOME/.bun/bin) to
        # GITHUB_PATH, which pwsh (the windows-2022 default shell) can't
        # resolve — so every bun step must run under bash.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then break; fi
            if (( attempt == 3 )); then exit 1; fi
            sleep "$((attempt * 15))"
          done

      # The embedded settings/dashboard UI lives in shell/ with its own
      # manifest; the root install doesn't cover it. Mirrors the release
      # `binaries` job and the windows-installer-dev workflow. This also
      # pulls in the shell's @tauri-apps/cli for `bun run tauri build`.
      - name: Install shell dependencies
        working-directory: shell
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then break; fi
            if (( attempt == 3 )); then exit 1; fi
            sleep "$((attempt * 15))"
          done

      - name: Build web UI + ui-embed manifest
        shell: bash
        run: |
          set -euo pipefail
          bun run build:ui
          bun run scripts/gen-ui-embed.ts

      # Compile the sidecar for win-x64 and place its target-triple input
      # under shell/src-tauri/binaries/ for Tauri's externalBin resolver.
      - name: Build win-x64 sidecar (externalBin)
        shell: bash
        run: bun run scripts/build-sidecar.ts --force

      # Tauri requires exact target-triple source names and installs them as
      # unsuffixed siblings in the application directory.
      - name: Verify sidecar placement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'shell/src-tauri/binaries'
          $triple = 'x86_64-pc-windows-msvc'
          $exe = Join-Path $dir "maximal-$triple.exe"
          if (-not (Test-Path $exe)) { throw "sidecar not found: $exe" }
          Write-Host "sidecar OK: $exe ($((Get-Item $exe).Length) bytes)"
          Get-ChildItem $dir

      # Compile and exercise the lifecycle code with target_os = "windows",
      # including the synthetic Job Object kill-on-close containment test.
      # --release lets the following Tauri build reuse the compiled graph.
      - name: Test native shell lifecycle (Windows)
        shell: bash
        run: cargo test --release --manifest-path shell/src-tauri/Cargo.toml

      # Build the Tauri app for Windows. The NSIS per-user installer + the
      # raw .exe are produced under shell/src-tauri/target/release/bundle/.
      # build:ui runs again as beforeBuildCommand (cheap, idempotent).
      - name: Tauri build (Windows, NSIS)
        working-directory: shell
        shell: bash
        run: |
          # The UI + ui-embed manifest were already built by the step above.
          # Tauri runs beforeBuildCommand via cmd.exe on Windows, where bun
          # (only on the Git-Bash-style PATH from setup-bun) can't resolve —
          # so override the hook to empty for this CI build to skip the
          # redundant re-run rather than fight bun-under-cmd.
          bun run tauri build --bundles nsis \
            --config '{"build":{"beforeBuildCommand":""}}'

      - name: Locate build outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'shell/src-tauri/target/release'
          $nsis = Get-ChildItem -Path (Join-Path $root 'bundle/nsis') -Filter '*-setup.exe' -ErrorAction SilentlyContinue
          $app = Get-ChildItem -Path $root -Filter 'Maximal.exe' -ErrorAction SilentlyContinue
          if (-not $nsis) {
            Write-Error "NSIS installer not produced under $root/bundle/nsis"
            exit 1
          }
          Write-Host "NSIS installer: $($nsis.FullName) ($($nsis.Length) bytes)"
          if ($app) { Write-Host "App exe: $($app.FullName) ($($app.Length) bytes)" }

      - name: Upload Windows shell artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-shell-dev
          path: |
            shell/src-tauri/target/release/bundle/nsis/*-setup.exe
            shell/src-tauri/target/release/Maximal.exe
          if-no-files-found: error

  # Install + launcher verification — a SEPARATE job so it reuses the
  # already-built NSIS artifact instead of recompiling. Iterating on these
  # assertions costs seconds (download + install), not a full Rust compile;
  # if only this fails, "Re-run failed jobs" reruns just this job.
  verify-install:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-shell-dev
          path: dist

      # Prove the tray app is what a user actually gets: silently install the
      # NSIS package, then assert a "Maximal" Start Menu shortcut lands that
      # targets the app exe inside the install dir — the Windows analog of the
      # macOS .app in /Applications (how a user finds + launches maximal).
      - name: Install NSIS + verify Start Menu launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist -Recurse -Filter '*-setup.exe' | Select-Object -First 1).FullName
          if (-not $setup) { throw "no *-setup.exe in the downloaded artifact" }
          Write-Host "Installing $setup /S ..."
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "NSIS installer timed out"
          }
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "NSIS install failed: $($p.ExitCode)" }
          Start-Sleep -Seconds 3

          # Tauri per-user (currentUser) NSIS installs under %LOCALAPPDATA%\Maximal.
          $installRoot = Join-Path $env:LOCALAPPDATA 'Maximal'
          if (-not (Test-Path $installRoot)) { throw "install dir missing: $installRoot" }
          Get-ChildItem $installRoot | ForEach-Object { Write-Host "  installed: $($_.Name)" }
          foreach ($binary in @('maximal.exe')) {
            $binaryPath = Join-Path $installRoot $binary
            if (-not (Test-Path $binaryPath)) { throw "$binary missing at $binaryPath" }
          }

          # The launcher is the "Maximal" Start Menu shortcut (per-user
          # Programs), exactly named Maximal.lnk.
          $sm = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $lnk = Get-ChildItem $sm -Recurse -Filter 'Maximal.lnk' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $lnk) { throw "no 'Maximal.lnk' Start Menu shortcut found under $sm" }
          Write-Host "Start Menu shortcut: $($lnk.FullName)"

          # It must target the app binary at the known path. productName is
          # "Maximal" (install dir) but the Tauri/cargo binary is maximal-shell,
          # so the launcher target is %LOCALAPPDATA%\Maximal\maximal-shell.exe.
          $expected = Join-Path $installRoot 'maximal-shell.exe'
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk.FullName).TargetPath
          Write-Host "shortcut target: $target"
          if ($target -ne $expected) {
            throw "Start Menu shortcut should target '$expected', got '$target'"
          }
          if (-not (Test-Path $target)) { throw "shortcut target does not exist on disk: $target" }
          Write-Host "Start Menu launcher OK -> $target"

      - name: Seed isolated app integration fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'maximal-packaged-lifecycle'
          $maximalHome = Join-Path $fixtureRoot 'maximal'
          $claudeHome = Join-Path $fixtureRoot 'claude'
          $codexHome = Join-Path $fixtureRoot 'codex'
          New-Item -ItemType Directory -Force $maximalHome, $claudeHome, $codexHome | Out-Null

          $env:COPILOT_API_HOME = $maximalHome
          $env:CLAUDE_CONFIG_DIR = $claudeHome
          $env:CODEX_HOME = $codexHome
          foreach ($entry in @(
            "COPILOT_API_HOME=$maximalHome",
            "CLAUDE_CONFIG_DIR=$claudeHome",
            "CODEX_HOME=$codexHome"
          )) {
            $entry | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

          @'
          {
            "checkUpdates": false,
            "smallModel": "smoke-user-model",
            "apps": {
              "claudeCode": { "enabled": true },
              "codex": { "enabled": true }
            }
          }
          '@ | Set-Content (Join-Path $maximalHome 'config.json') -Encoding utf8

          @'
          {
            "permissions": { "allow": ["Read"] },
            "env": { "SMOKE_USER_ENV": "preserve-me" },
            "smokeUserSetting": { "preserve": true }
          }
          '@ | Set-Content (Join-Path $claudeHome 'settings.json') -Encoding utf8

          $codexSeed = @'
          # packaged lifecycle smoke user content
          model_provider = "user-provider"
          model = "smoke-model"
          user_setting = "preserve-me"

          [features]
          smoke_feature = true

          [model_providers.user-provider]
          name = "User Provider"
          base_url = "https://example.invalid/v1"
          wire_api = "responses"
          '@
          $codexPath = Join-Path $codexHome 'config.toml'
          $codexSeed | Set-Content $codexPath -Encoding utf8 -NoNewline
          Copy-Item $codexPath (Join-Path $fixtureRoot 'codex-config.before.toml')
          Write-Host "seeded isolated integration fixtures under $fixtureRoot"

      - name: Launch installed app and verify sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:LOCALAPPDATA 'Maximal'
          $shellPath = Join-Path $installRoot 'maximal-shell.exe'
          if (-not (Test-Path $shellPath)) { throw "shell missing: $shellPath" }

          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class MaximalStartupWindowSmoke {
            private delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")]
            [return: MarshalAs(UnmanagedType.Bool)]
            private static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);
            [DllImport("user32.dll")]
            private static extern uint GetWindowThreadProcessId(
              IntPtr hWnd, out uint processId);
            [DllImport("user32.dll")]
            [return: MarshalAs(UnmanagedType.Bool)]
            public static extern bool IsIconic(IntPtr hWnd);
            [DllImport("user32.dll")]
            [return: MarshalAs(UnmanagedType.Bool)]
            public static extern bool IsWindowVisible(IntPtr hWnd);
            [DllImport("user32.dll")]
            public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll", EntryPoint = "GetWindowLongPtrW")]
            public static extern IntPtr GetWindowLongPtr(IntPtr hWnd, int index);
            public static IntPtr[] WindowsForProcess(uint processId) {
              var windows = new List<IntPtr>();
              EnumWindows((hWnd, lParam) => {
                uint owner;
                GetWindowThreadProcessId(hWnd, out owner);
                if (owner == processId) windows.Add(hWnd);
                return true;
              }, IntPtr.Zero);
              return windows.ToArray();
            }
          }
          '@

          $foregroundBeforeLaunch = [MaximalStartupWindowSmoke]::GetForegroundWindow()
          Write-Host "launching: $shellPath"
          $shellProcess = Start-Process -FilePath $shellPath -PassThru
          # Cold hosted runners can take more than 30 seconds to initialize the
          # sidecar on first launch. Observe the short-lived minimized state in
          # the same loop: the unauthenticated flow intentionally presents
          # Account after the splash minimum, so waiting for a later sidecar
          # probe would miss the Ready-time taskbar state.
          $sidecarProcess = $null
          $startupWindowHandle = [IntPtr]::Zero
          $startupExtendedStyle = [int64]0
          $foregroundAtStartupSnapshot = [IntPtr]::Zero
          $deadline = (Get-Date).AddSeconds(60)
          $nextSidecarCheck = Get-Date
          do {
            $now = Get-Date
            if (-not $sidecarProcess -and $now -ge $nextSidecarCheck) {
              $sidecarProcess = Get-CimInstance Win32_Process -Filter "Name = 'maximal.exe'" |
                Where-Object { $_.ParentProcessId -eq $shellProcess.Id } |
                Select-Object -First 1
              $nextSidecarCheck = $now.AddMilliseconds(500)
            }
            if ($startupWindowHandle -eq [IntPtr]::Zero) {
              foreach ($candidate in [MaximalStartupWindowSmoke]::WindowsForProcess(
                  [uint32]$shellProcess.Id)) {
                if ([MaximalStartupWindowSmoke]::IsWindowVisible($candidate) -and
                    [MaximalStartupWindowSmoke]::IsIconic($candidate)) {
                  $startupWindowHandle = $candidate
                  $startupExtendedStyle = [MaximalStartupWindowSmoke]::GetWindowLongPtr(
                    $candidate, -20).ToInt64()
                  $foregroundAtStartupSnapshot = [MaximalStartupWindowSmoke]::GetForegroundWindow()
                  break
                }
              }
            }
            if (-not $shellProcess.HasExited -and $sidecarProcess -and
                $startupWindowHandle -ne [IntPtr]::Zero) { break }
            Start-Sleep -Milliseconds 100
            $shellProcess.Refresh()
          } while ((Get-Date) -lt $deadline)

          if ($shellProcess.HasExited) { throw "maximal-shell did not stay running" }
          if (-not $sidecarProcess) { throw "maximal sidecar did not start within 60 seconds" }
          if ($startupWindowHandle -eq [IntPtr]::Zero) {
            throw "ordinary startup did not create a minimized taskbar-backed main window"
          }
          if (($startupExtendedStyle -band 0x80) -ne 0) {
            throw "startup main window used WS_EX_TOOLWINDOW and was not taskbar-eligible"
          }
          $activationChecked = $foregroundBeforeLaunch -ne [IntPtr]::Zero
          $startupDisplacedForeground = (
            $activationChecked -and
            $foregroundAtStartupSnapshot -eq $startupWindowHandle)
          if ($startupDisplacedForeground) {
            Write-Warning "startup main window was foreground at the minimized snapshot"
          }
          Write-Host "shell PID: $($shellProcess.Id); sidecar PID: $($sidecarProcess.ProcessId)"
          [ordered]@{
            shellPid = $shellProcess.Id
            sidecarPid = [int]$sidecarProcess.ProcessId
            windowHandle = $startupWindowHandle.ToInt64()
            foregroundBeforeLaunch = $foregroundBeforeLaunch.ToInt64()
            foregroundAtMinimizedSnapshot = $foregroundAtStartupSnapshot.ToInt64()
            minimized = $true
            taskbarEligible = $true
            activationChecked = $activationChecked
            activated = $startupDisplacedForeground
          } | ConvertTo-Json | Set-Content dist/startup-window.json
          Write-Host "ordinary startup created minimized taskbar window $startupWindowHandle"

      # Re-run the installer while the tray shell is alive. This specifically
      # exercises NSIS_HOOK_PREINSTALL: the v0.5.1 hook left the old shell and
      # proxy running, so reinstalling could leave users attached to a failed
      # old process. Capture exact PIDs so image-wide cleanup cannot mask it.
      - name: Reinstall NSIS app while Maximal is running
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:LOCALAPPDATA 'Maximal'
          $shellPath = Join-Path $installRoot 'maximal-shell.exe'
          $setup = (Get-ChildItem dist -Recurse -Filter '*-setup.exe' | Select-Object -First 1).FullName
          if (-not $setup) { throw "no *-setup.exe in the downloaded artifact" }

          $oldShell = Get-CimInstance Win32_Process -Filter "Name = 'maximal-shell.exe'" |
            Where-Object { $_.ExecutablePath -eq $shellPath } |
            Select-Object -First 1
          if (-not $oldShell) { throw "installed maximal-shell process not found before reinstall" }
          $oldSidecar = Get-CimInstance Win32_Process -Filter "Name = 'maximal.exe'" |
            Where-Object { $_.ParentProcessId -eq $oldShell.ProcessId } |
            Select-Object -First 1
          if (-not $oldSidecar) { throw "sidecar child of shell PID $($oldShell.ProcessId) not found before reinstall" }
          $oldShellPid = [int]$oldShell.ProcessId
          $oldSidecarPid = [int]$oldSidecar.ProcessId
          $oldListenerPorts = @(
            Get-NetTCPConnection -OwningProcess $oldSidecarPid -State Listen -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty LocalPort -Unique
          )

          Write-Host "reinstalling over shell PID $oldShellPid and sidecar PID $oldSidecarPid"
          $installer = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru
          if (-not $installer.WaitForExit(60000)) {
            Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue
            throw "NSIS reinstall timed out with Maximal running"
          }
          if ($installer.ExitCode -ne 0) { throw "NSIS reinstall failed: $($installer.ExitCode)" }

          $exitDeadline = (Get-Date).AddSeconds(10)
          do {
            $remainingOldShell = Get-Process -Id $oldShellPid -ErrorAction SilentlyContinue
            $remainingOldSidecar = Get-Process -Id $oldSidecarPid -ErrorAction SilentlyContinue
            $remainingOldListeners = @(
              Get-NetTCPConnection -OwningProcess $oldSidecarPid -State Listen -ErrorAction SilentlyContinue
            )
            if (-not $remainingOldShell -and -not $remainingOldSidecar -and $remainingOldListeners.Count -eq 0) {
              break
            }
            Start-Sleep -Milliseconds 100
          } while ((Get-Date) -lt $exitDeadline)
          if ($remainingOldShell) { throw "pre-reinstall shell PID $oldShellPid survived NSIS reinstall" }
          if ($remainingOldSidecar) { throw "pre-reinstall sidecar PID $oldSidecarPid survived NSIS reinstall" }
          if ($remainingOldListeners.Count -ne 0) {
            throw "pre-reinstall sidecar PID $oldSidecarPid retained listeners after NSIS reinstall"
          }

          if (-not (Test-Path $shellPath)) { throw "shell missing after reinstall: $shellPath" }
          $replacementShell = Get-CimInstance Win32_Process -Filter "Name = 'maximal-shell.exe'" |
            Where-Object {
              $_.ExecutablePath -eq $shellPath -and $_.ProcessId -ne $oldShellPid
            } |
            Sort-Object CreationDate -Descending |
            Select-Object -First 1
          if ($replacementShell) {
            $replacementShellPid = [int]$replacementShell.ProcessId
            Write-Host "installer launched replacement shell PID $replacementShellPid"
          } else {
            $replacementShellPid = (Start-Process -FilePath $shellPath -PassThru).Id
            Write-Host "launched replacement shell PID $replacementShellPid"
          }

          $replacementSidecar = $null
          $replacementPort = $null
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $replacementShellAlive = Get-Process -Id $replacementShellPid -ErrorAction SilentlyContinue
            $replacementSidecar = Get-CimInstance Win32_Process -Filter "Name = 'maximal.exe'" |
              Where-Object { $_.ParentProcessId -eq $replacementShellPid } |
              Select-Object -First 1
            if ($replacementShellAlive -and $replacementSidecar) {
              $ports = @(
                Get-NetTCPConnection -OwningProcess $replacementSidecar.ProcessId -State Listen -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty LocalPort -Unique
              )
              foreach ($port in $ports) {
                try {
                  $status = Invoke-RestMethod -Uri "http://127.0.0.1:$port/status" `
                    -Method Get -TimeoutSec 2
                  if ($status.service -eq 'maximal') {
                    $replacementPort = $port
                    break
                  }
                } catch {
                  Write-Host "replacement listener $port not ready: $($_.Exception.Message)"
                }
              }
            }
            if ($replacementPort) { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)
          if (-not $replacementShellAlive) { throw "replacement maximal-shell did not stay running after reinstall" }
          if (-not $replacementSidecar) { throw "replacement sidecar did not start within 60 seconds after reinstall" }
          if (-not $replacementPort) { throw "replacement sidecar did not answer /status within 60 seconds after reinstall" }

          [ordered]@{
            oldShellPid = $oldShellPid
            oldSidecarPid = $oldSidecarPid
            oldListenerPorts = $oldListenerPorts
            replacementShellPid = $replacementShellPid
            replacementSidecarPid = [int]$replacementSidecar.ProcessId
            replacementPort = $replacementPort
          } | ConvertTo-Json | Set-Content dist/reinstall-pids.json
          Write-Host "replacement shell PID $replacementShellPid and sidecar PID $($replacementSidecar.ProcessId) are healthy"

      # Exercise the ordinary Windows taskbar and X-close path before abrupt
      # containment. Startup must expose a minimized taskbar-eligible window
      # without activation. A task argument restores that same window through
      # the single-instance callback. WM_CLOSE must keep both processes alive
      # behind confirmation, then run bounded cleanup only after acceptance.
      - name: Confirm packaged window close and verify bounded app exit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:LOCALAPPDATA 'Maximal'
          $shellPath = Join-Path $installRoot 'maximal-shell.exe'
          $shellProcess = Get-CimInstance Win32_Process -Filter "Name = 'maximal-shell.exe'" |
            Where-Object { $_.ExecutablePath -eq $shellPath } |
            Select-Object -First 1
          if (-not $shellProcess) { throw "installed maximal-shell process not found" }
          $sidecarProcess = Get-CimInstance Win32_Process -Filter "Name = 'maximal.exe'" |
            Where-Object { $_.ParentProcessId -eq $shellProcess.ProcessId } |
            Select-Object -First 1
          if (-not $sidecarProcess) { throw "sidecar child of shell PID $($shellProcess.ProcessId) not found" }

          $shellPid = [int]$shellProcess.ProcessId
          $sidecarPid = [int]$sidecarProcess.ProcessId
          $listenerDeadline = (Get-Date).AddSeconds(10)
          do {
            $listenerPorts = @(
              Get-NetTCPConnection -OwningProcess $sidecarPid -State Listen -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty LocalPort -Unique
            )
            if ($listenerPorts.Count -gt 0) { break }
            Start-Sleep -Milliseconds 100
          } while ((Get-Date) -lt $listenerDeadline)
          if ($listenerPorts.Count -eq 0) {
            throw "sidecar PID $sidecarPid did not open a listener before graceful shutdown"
          }

          $shutdownPort = $null
          foreach ($port in $listenerPorts) {
            try {
              $status = Invoke-RestMethod -Uri "http://127.0.0.1:$port/status" `
                -Method Get -TimeoutSec 2
              if ($status.service -eq 'maximal') {
                $shutdownPort = $port
                break
              }
            } catch {
              Write-Host "listener $port did not answer as Maximal: $($_.Exception.Message)"
            }
          }
          if (-not $shutdownPort) {
            throw "no listener owned by sidecar PID $sidecarPid identified itself as Maximal"
          }

          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'maximal-packaged-lifecycle'
          $maximalConfigPath = Join-Path $env:COPILOT_API_HOME 'config.json'
          $claudeSettingsPath = Join-Path $env:CLAUDE_CONFIG_DIR 'settings.json'
          $codexConfigPath = Join-Path $env:CODEX_HOME 'config.toml'
          $codexBaselinePath = Join-Path $fixtureRoot 'codex-config.before.toml'

          $maximalConfig = Get-Content $maximalConfigPath -Raw | ConvertFrom-Json
          if ($maximalConfig.apps.claudeCode.enabled -ne $true) {
            throw "Claude Code routing intent was not preserved while packaged app ran"
          }
          if ($maximalConfig.apps.codex.enabled -ne $true) {
            throw "Codex routing intent was not preserved while packaged app ran"
          }
          if ($maximalConfig.smallModel -ne 'smoke-user-model') {
            throw "unrelated Maximal config changed while packaged app ran"
          }

          $claudeSettings = Get-Content $claudeSettingsPath -Raw | ConvertFrom-Json
          if ($claudeSettings.env.ANTHROPIC_BASE_URL -ne "http://127.0.0.1:$shutdownPort") {
            throw "packaged Claude Code configurator did not apply the active proxy URL"
          }
          if (-not $claudeSettings.apiKeyHelper) {
            throw "packaged Claude Code configurator did not apply apiKeyHelper"
          }
          if ($claudeSettings.env.SMOKE_USER_ENV -ne 'preserve-me' -or
              $claudeSettings.smokeUserSetting.preserve -ne $true -or
              -not ($claudeSettings.permissions.allow -contains 'Read')) {
            throw "packaged Claude Code configurator changed unrelated user fields"
          }

          $codexText = Get-Content $codexConfigPath -Raw
          if (-not $codexText.Contains('# >>> maximal codex routing v1:') -or
              -not $codexText.Contains('model_provider = "maximal-app"') -or
              -not $codexText.Contains("base_url = `"http://127.0.0.1:$shutdownPort/v1`"")) {
            throw "packaged Codex configurator did not apply the active provider routing"
          }
          if (-not $codexText.Contains('model = "smoke-model"') -or
              -not $codexText.Contains('user_setting = "preserve-me"') -or
              -not $codexText.Contains('smoke_feature = true')) {
            throw "packaged Codex configurator changed unrelated user content"
          }
          Write-Host "packaged Claude Code and Codex configurators applied routing"

          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class MaximalWindowSmoke {
            [DllImport("user32.dll", SetLastError = true)]
            [return: MarshalAs(UnmanagedType.Bool)]
            public static extern bool PostMessage(
              IntPtr hWnd, uint message, IntPtr wParam, IntPtr lParam);
            [DllImport("user32.dll")]
            [return: MarshalAs(UnmanagedType.Bool)]
            public static extern bool IsIconic(IntPtr hWnd);
          }
          '@

          $preActionWindowHandle = [IntPtr]::Zero
          $preActionDeadline = (Get-Date).AddSeconds(15)
          do {
            $shell = Get-Process -Id $shellPid -ErrorAction SilentlyContinue
            if ($shell) {
              $shell.Refresh()
              $preActionWindowHandle = $shell.MainWindowHandle
            }
            if ($preActionWindowHandle -ne [IntPtr]::Zero) { break }
            Start-Sleep -Milliseconds 100
          } while ((Get-Date) -lt $preActionDeadline)
          if ($preActionWindowHandle -eq [IntPtr]::Zero) {
            throw "replacement startup did not retain a main window"
          }

          $actionProcess = Start-Process -FilePath $shellPath `
            -ArgumentList '--maximal-action=dashboard' -PassThru
          if (-not $actionProcess.WaitForExit(10000)) {
            Stop-Process -Id $actionProcess.Id -Force -ErrorAction SilentlyContinue
            throw "taskbar action process did not hand off to the existing shell"
          }
          if ($actionProcess.ExitCode -ne 0) {
            throw "taskbar action process exited $($actionProcess.ExitCode)"
          }

          $windowHandle = [IntPtr]::Zero
          $windowTitle = ''
          $windowDeadline = (Get-Date).AddSeconds(15)
          do {
            $activeShells = @(
              Get-CimInstance Win32_Process -Filter "Name = 'maximal-shell.exe'" |
                Where-Object { $_.ExecutablePath -eq $shellPath }
            )
            $shell = Get-Process -Id $shellPid -ErrorAction SilentlyContinue
            if ($shell) {
              $shell.Refresh()
              $windowHandle = $shell.MainWindowHandle
              $windowTitle = $shell.MainWindowTitle
            }
            if ($activeShells.Count -eq 1 -and
                [int]$activeShells[0].ProcessId -eq $shellPid -and
                $windowHandle -ne [IntPtr]::Zero -and
                $windowTitle -eq 'Maximal — Dashboard') {
              break
            }
            Start-Sleep -Milliseconds 100
          } while ((Get-Date) -lt $windowDeadline)
          if ($activeShells.Count -ne 1 -or
              [int]$activeShells[0].ProcessId -ne $shellPid) {
            $activeIds = ($activeShells | ForEach-Object { $_.ProcessId }) -join ', '
            throw "taskbar action left installed shell PIDs [$activeIds]; expected only $shellPid"
          }
          if ($windowHandle -eq [IntPtr]::Zero) {
            throw "taskbar Dashboard action did not create a main window"
          }
          if ($windowTitle -ne 'Maximal — Dashboard') {
            throw "taskbar Dashboard action left unexpected window title '$windowTitle'"
          }
          if ($windowHandle -ne $preActionWindowHandle) {
            throw "taskbar action replaced startup HWND $preActionWindowHandle with $windowHandle"
          }
          if ([MaximalWindowSmoke]::IsIconic($windowHandle)) {
            throw "taskbar Dashboard action left the startup window minimized"
          }
          Write-Host "taskbar Dashboard action restored shell PID $shellPid window '$windowTitle'"

          [ordered]@{
            shellPid = $shellPid
            sidecarPid = $sidecarPid
            listenerPorts = $listenerPorts
            maximalPort = $shutdownPort
            windowTitle = $windowTitle
            windowHandle = $windowHandle.ToInt64()
          } | ConvertTo-Json | Set-Content dist/graceful-shutdown-pids.json

          if (-not [MaximalWindowSmoke]::PostMessage(
              $windowHandle, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)) {
            throw "could not send WM_CLOSE to shell PID $shellPid"
          }
          Write-Host "sent WM_CLOSE to shell PID $shellPid; waiting for quit confirmation"

          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $confirmButton = $null
          $confirmDeadline = (Get-Date).AddSeconds(10)
          $condition = [System.Windows.Automation.PropertyCondition]::new(
            [System.Windows.Automation.AutomationElement]::NameProperty,
            'Quit Maximal')
          do {
            if (-not (Get-Process -Id $shellPid -ErrorAction SilentlyContinue)) {
              throw "shell PID $shellPid exited before quit confirmation"
            }
            if (-not (Get-Process -Id $sidecarPid -ErrorAction SilentlyContinue)) {
              throw "sidecar PID $sidecarPid exited before quit confirmation"
            }
            $root = [System.Windows.Automation.AutomationElement]::FromHandle(
              $windowHandle)
            if ($root) {
              $confirmButton = $root.FindFirst(
                [System.Windows.Automation.TreeScope]::Descendants,
                $condition)
            }
            if ($confirmButton) { break }
            Start-Sleep -Milliseconds 100
          } while ((Get-Date) -lt $confirmDeadline)
          if (-not $confirmButton) {
            throw "WM_CLOSE did not expose the 'Quit Maximal' confirmation button"
          }

          Start-Sleep -Seconds 1
          if (-not (Get-Process -Id $shellPid -ErrorAction SilentlyContinue)) {
            throw "shell PID $shellPid exited while quit confirmation was pending"
          }
          if (-not (Get-Process -Id $sidecarPid -ErrorAction SilentlyContinue)) {
            throw "sidecar PID $sidecarPid exited while quit confirmation was pending"
          }
          $pendingListeners = @(
            Get-NetTCPConnection -OwningProcess $sidecarPid -State Listen -ErrorAction SilentlyContinue
          )
          if ($pendingListeners.Count -eq 0) {
            throw "sidecar PID $sidecarPid dropped its listeners before quit confirmation"
          }

          $invokePattern = $confirmButton.GetCurrentPattern(
            [System.Windows.Automation.InvokePattern]::Pattern)
          $invokePattern.Invoke()
          Write-Host "accepted quit confirmation; waiting for bounded graceful exit"

          $deadline = (Get-Date).AddSeconds(10)
          do {
            $remainingShell = Get-Process -Id $shellPid -ErrorAction SilentlyContinue
            $remainingSidecar = Get-Process -Id $sidecarPid -ErrorAction SilentlyContinue
            $remainingListeners = @(
              Get-NetTCPConnection -OwningProcess $sidecarPid -State Listen -ErrorAction SilentlyContinue
            )
            if (-not $remainingShell -and -not $remainingSidecar -and $remainingListeners.Count -eq 0) {
              break
            }
            Start-Sleep -Milliseconds 100
          } while ((Get-Date) -lt $deadline)
          if ($remainingSidecar) { throw "sidecar PID $sidecarPid survived bounded graceful shutdown" }
          if ($remainingShell) { throw "shell PID $shellPid survived bounded graceful shutdown" }
          if ($remainingListeners.Count -ne 0) {
            throw "sidecar PID $sidecarPid retained listeners after bounded graceful shutdown"
          }

          $afterClaude = Get-Content $claudeSettingsPath -Raw | ConvertFrom-Json
          if ($afterClaude.env.ANTHROPIC_BASE_URL) {
            throw "Claude Code proxy URL survived bounded graceful shutdown"
          }
          if ($afterClaude.PSObject.Properties.Name -contains 'apiKeyHelper') {
            throw "Claude Code apiKeyHelper survived bounded graceful shutdown"
          }
          if ($afterClaude.env.CLAUDE_CODE_AUTO_MODE_SERVER) {
            throw "Claude Code auto-mode routing survived bounded graceful shutdown"
          }
          if ($afterClaude.env.SMOKE_USER_ENV -ne 'preserve-me' -or
              $afterClaude.smokeUserSetting.preserve -ne $true -or
              -not ($afterClaude.permissions.allow -contains 'Read')) {
            throw "Claude Code graceful cleanup changed unrelated user fields"
          }

          $afterCodex = Get-Content $codexConfigPath -Raw
          $beforeCodex = Get-Content $codexBaselinePath -Raw
          if ($afterCodex -cne $beforeCodex) {
            throw "Codex graceful cleanup did not restore the seeded user config exactly"
          }

          $afterMaximal = Get-Content $maximalConfigPath -Raw | ConvertFrom-Json
          if ($afterMaximal.apps.claudeCode.enabled -ne $true -or
              $afterMaximal.apps.codex.enabled -ne $true) {
            throw "graceful cleanup removed durable app routing intent"
          }
          if ($afterMaximal.smallModel -ne 'smoke-user-model') {
            throw "graceful cleanup changed unrelated Maximal config"
          }

          [ordered]@{
            claudeCode = [ordered]@{
              applied = $true
              reverted = $true
              userFieldsPreserved = $true
              routingIntentPreserved = $true
            }
            codex = [ordered]@{
              applied = $true
              revertedExactly = $true
              routingIntentPreserved = $true
            }
          } | ConvertTo-Json -Depth 4 | Set-Content dist/configurator-verification.json
          Write-Host "shell PID $shellPid and sidecar PID $sidecarPid exited gracefully; configurators reverted scoped routing"

          $replacementShell = Start-Process -FilePath $shellPath -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $replacementSidecar = Get-CimInstance Win32_Process -Filter "Name = 'maximal.exe'" |
              Where-Object { $_.ParentProcessId -eq $replacementShell.Id } |
              Select-Object -First 1
            if (-not $replacementShell.HasExited -and $replacementSidecar) { break }
            Start-Sleep -Milliseconds 500
            $replacementShell.Refresh()
          } while ((Get-Date) -lt $deadline)
          if ($replacementShell.HasExited) { throw "replacement maximal-shell did not stay running" }
          if (-not $replacementSidecar) { throw "replacement sidecar did not start within 60 seconds" }
          Write-Host "replacement shell PID: $($replacementShell.Id); sidecar PID: $($replacementSidecar.ProcessId)"

      # Keep abrupt parent death as a distinct Job Object containment test. This
      # runs before NSIS's image-wide cleanup can mask the result. Kill only the
      # shell PID, without /T, and require its exact sidecar and listeners to
      # disappear. Then relaunch so the running-uninstaller smoke remains intact.
      - name: Force shell exit and verify sidecar containment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:LOCALAPPDATA 'Maximal'
          $shellPath = Join-Path $installRoot 'maximal-shell.exe'
          $shellProcess = Get-CimInstance Win32_Process -Filter "Name = 'maximal-shell.exe'" |
            Where-Object { $_.ExecutablePath -eq $shellPath } |
            Select-Object -First 1
          if (-not $shellProcess) { throw "installed maximal-shell process not found" }
          $sidecarProcess = Get-CimInstance Win32_Process -Filter "Name = 'maximal.exe'" |
            Where-Object { $_.ParentProcessId -eq $shellProcess.ProcessId } |
            Select-Object -First 1
          if (-not $sidecarProcess) { throw "sidecar child of shell PID $($shellProcess.ProcessId) not found" }

          $shellPid = [int]$shellProcess.ProcessId
          $sidecarPid = [int]$sidecarProcess.ProcessId
          $listenerPorts = @(
            Get-NetTCPConnection -OwningProcess $sidecarPid -State Listen -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty LocalPort -Unique
          )
          [ordered]@{
            shellPid = $shellPid
            sidecarPid = $sidecarPid
            listenerPorts = $listenerPorts
          } | ConvertTo-Json | Set-Content dist/containment-pids.json
          Write-Host "forcing shell PID $shellPid; expecting sidecar PID $sidecarPid to follow"
          Stop-Process -Id $shellPid -Force

          $deadline = (Get-Date).AddSeconds(5)
          do {
            $remainingSidecar = Get-Process -Id $sidecarPid -ErrorAction SilentlyContinue
            $remainingListeners = @(
              Get-NetTCPConnection -OwningProcess $sidecarPid -State Listen -ErrorAction SilentlyContinue
            )
            if (-not $remainingSidecar -and $remainingListeners.Count -eq 0) { break }
            Start-Sleep -Milliseconds 100
          } while ((Get-Date) -lt $deadline)
          if ($remainingSidecar) { throw "sidecar PID $sidecarPid survived forced shell exit" }
          if ($remainingListeners.Count -ne 0) {
            throw "sidecar PID $sidecarPid retained listeners after forced shell exit"
          }
          Write-Host "contained sidecar PID $sidecarPid and its listeners exited"

          $replacementShell = Start-Process -FilePath $shellPath -PassThru
          # Cold hosted runners can take more than 30 seconds to initialize the
          # sidecar on first launch (the diagnostics record the exact child PID).
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $replacementSidecar = Get-CimInstance Win32_Process -Filter "Name = 'maximal.exe'" |
              Where-Object { $_.ParentProcessId -eq $replacementShell.Id } |
              Select-Object -First 1
            if (-not $replacementShell.HasExited -and $replacementSidecar) { break }
            Start-Sleep -Milliseconds 500
            $replacementShell.Refresh()
          } while ((Get-Date) -lt $deadline)
          if ($replacementShell.HasExited) { throw "replacement maximal-shell did not stay running" }
          if (-not $replacementSidecar) { throw "replacement sidecar did not start within 60 seconds" }
          Write-Host "replacement shell PID: $($replacementShell.Id); sidecar PID: $($replacementSidecar.ProcessId)"

      - name: Uninstall NSIS app while Maximal is running
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:LOCALAPPDATA 'Maximal'
          $unins = Get-ChildItem $installRoot -Recurse -Filter 'uninstall.exe' `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $unins) { throw "uninstaller not found under $installRoot" }

          # Do not stop Maximal here. NSIS_HOOK_PREUNINSTALL must stop the open
          # tray shell and its sidecars before Tauri's CheckIfAppIsRunning.
          Write-Host "uninstalling with Maximal still running: $($unins.FullName)"
          # _?= disables NSIS's usual handoff to a temporary copy. Without it,
          # WaitForExit observes only the launcher and can return before the real
          # uninstaller reaches CheckIfAppIsRunning or removes the binaries.
          $p = Start-Process -FilePath $unins.FullName `
            -ArgumentList '/S', "_?=$installRoot" -PassThru
          if (-not $p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Process -Name 'maximal-shell', 'maximal' `
              -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            throw "uninstaller timed out with Maximal running"
          }
          if ($p.ExitCode -ne 0) { throw "NSIS uninstall failed: $($p.ExitCode)" }

          $deadline = (Get-Date).AddSeconds(10)
          do {
            $remaining = @(
              Get-Process -Name 'maximal-shell', 'maximal' `
                -ErrorAction SilentlyContinue
            )
            if ($remaining.Count -eq 0) { break }
            Start-Sleep -Milliseconds 250
          } while ((Get-Date) -lt $deadline)
          if ($remaining.Count -ne 0) {
            $details = ($remaining | ForEach-Object { "$($_.ProcessName):$($_.Id)" }) -join ', '
            throw "Maximal processes remain after uninstall: $details"
          }

          foreach ($binary in @('maximal-shell.exe', 'maximal.exe')) {
            $binaryPath = Join-Path $installRoot $binary
            if (Test-Path $binaryPath) { throw "$binary still present: $binaryPath" }
          }

          # An in-place NSIS uninstaller cannot remove its own executable.
          Remove-Item $installRoot -Recurse -Force
          if (Test-Path $installRoot) { throw "install root still present: $installRoot" }

      # Capture evidence before the best-effort image-wide cleanup below. This
      # makes packaged lifecycle failures diagnosable without rerunning a build.
      - name: Capture Windows lifecycle diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          Get-CimInstance Win32_Process |
            Select-Object Name, ProcessId, ParentProcessId, ExecutablePath, CommandLine |
            ConvertTo-Json -Depth 3 | Set-Content diagnostics/processes.json
          Get-NetTCPConnection -ErrorAction SilentlyContinue |
            Select-Object State, LocalAddress, LocalPort, RemoteAddress, RemotePort, OwningProcess |
            ConvertTo-Json -Depth 3 | Set-Content diagnostics/tcp-connections.json

          $installRoot = Join-Path $env:LOCALAPPDATA 'Maximal'
          if (Test-Path $installRoot) {
            Get-ChildItem $installRoot -Recurse -Force |
              Select-Object FullName, Length, LastWriteTime |
              ConvertTo-Json -Depth 3 | Set-Content diagnostics/install-tree.json
          }
          $appData = Join-Path $env:APPDATA 'maximal'
          New-Item -ItemType Directory -Force diagnostics/appdata | Out-Null
          foreach ($name in @('session-running', 'maximal.pid')) {
            $source = Join-Path $appData $name
            if (Test-Path $source) {
              Copy-Item $source (Join-Path 'diagnostics/appdata' $name) -Force
            }
          }

          # Record only booleans from integration fixtures. The generated API-key
          # helper can contain a secret, so never upload the raw client configs.
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'maximal-packaged-lifecycle'
          $fixtureMaximalConfig = Join-Path $fixtureRoot 'maximal/config.json'
          $fixtureClaudeSettings = Join-Path $fixtureRoot 'claude/settings.json'
          $fixtureCodexConfig = Join-Path $fixtureRoot 'codex/config.toml'
          $fixtureState = [ordered]@{
            maximalConfigExists = Test-Path $fixtureMaximalConfig
            maximalConfigReadable = $null
            claudeCodeIntent = $null
            codexIntent = $null
            maximalUserFieldPreserved = $null
            claudeSettingsExists = Test-Path $fixtureClaudeSettings
            claudeSettingsReadable = $null
            claudeProxyPresent = $null
            claudeHelperPresent = $null
            claudeUserFieldsPreserved = $null
            codexConfigExists = Test-Path $fixtureCodexConfig
            codexConfigReadable = $null
            codexRoutingPresent = $null
            codexUserFieldsPreserved = $null
          }
          try {
            $maximalConfig = Get-Content $fixtureMaximalConfig -Raw | ConvertFrom-Json
            $fixtureState.maximalConfigReadable = $true
            $fixtureState.claudeCodeIntent = $maximalConfig.apps.claudeCode.enabled -eq $true
            $fixtureState.codexIntent = $maximalConfig.apps.codex.enabled -eq $true
            $fixtureState.maximalUserFieldPreserved = $maximalConfig.smallModel -eq 'smoke-user-model'
          } catch {
            $fixtureState.maximalConfigReadable = $false
          }
          try {
            $claude = Get-Content $fixtureClaudeSettings -Raw | ConvertFrom-Json
            $fixtureState.claudeSettingsReadable = $true
            $fixtureState.claudeProxyPresent = [bool]$claude.env.ANTHROPIC_BASE_URL
            $fixtureState.claudeHelperPresent = $claude.PSObject.Properties.Name -contains 'apiKeyHelper'
            $fixtureState.claudeUserFieldsPreserved =
              $claude.env.SMOKE_USER_ENV -eq 'preserve-me' -and
              $claude.smokeUserSetting.preserve -eq $true
          } catch {
            $fixtureState.claudeSettingsReadable = $false
          }
          try {
            $codex = Get-Content $fixtureCodexConfig -Raw
            $fixtureState.codexConfigReadable = $true
            $fixtureState.codexRoutingPresent = $codex.Contains('# >>> maximal codex routing v1:')
            $fixtureState.codexUserFieldsPreserved =
              $codex.Contains('user_setting = "preserve-me"') -and
              $codex.Contains('smoke_feature = true')
          } catch {
            $fixtureState.codexConfigReadable = $false
          }
          $fixtureState | ConvertTo-Json -Depth 3 | Set-Content diagnostics/configurator-state.json

      - name: Upload Windows lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-shell-dev-diagnostics
          path: |
            diagnostics/
            dist/startup-window.json
            dist/reinstall-pids.json
            dist/graceful-shutdown-pids.json
            dist/configurator-verification.json
            dist/containment-pids.json
          if-no-files-found: warn

      - name: Best-effort hosted-runner cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-Process -Name 'maximal-shell', 'maximal' `
            -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          $installRoot = Join-Path $env:LOCALAPPDATA 'Maximal'
          $unins = Get-ChildItem $installRoot -Recurse -Filter 'uninstall.exe' `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($unins) {
            $cleanup = Start-Process -FilePath $unins.FullName `
              -ArgumentList '/S', "_?=$installRoot" -PassThru
            [void]$cleanup.WaitForExit(30000)
          }
          if (Test-Path $installRoot) {
            Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
