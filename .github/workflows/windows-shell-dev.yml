# Windows Tauri shell fast-iteration harness (manual).
#
# The macOS menu-bar app (shell/) is built by the private macOS builder via
# .macos-builder/build.sh; the shell has NEVER been cross-built for Windows,
# even though its tray / menu / notification code is not macOS-gated and
# tauri.conf.json declares `targets: "all"`. We develop on macOS and cannot
# build Tauri-for-Windows locally, so this workflow is the only way to verify
# the Windows shell actually compiles and bundles.
#
# It is `workflow_dispatch`-only (never on push/PR/tag) and runs entirely on
# a windows-2022 runner:
#
#   1. Build the embedded settings/dashboard UI + the ui-embed manifest.
#   2. Compile the proxy and isolated broker sidecars for win-x64 via
#      scripts/build-sidecar.ts, which stages both target-triple externalBin
#      inputs under shell/src-tauri/binaries/.
#   3. Run the native shell tests under Windows, including quit ordering.
#   4. `bun run tauri build` for Windows → NSIS per-user installer (+ the
#      bare .exe). NSIS is chosen over WiX/MSI to match the macOS per-user,
#      no-admin model (installMode: currentUser in tauri.conf.json).
#   5. Install and launch the packaged app, prove its sidecar starts, forcibly
#      terminate only the shell PID, and verify the exact sidecar disappears.
#   6. Relaunch, then run the NSIS uninstaller while Maximal is still running.
#      A bounded deadline catches regressions where the uninstaller waits forever.
#
# Trigger: Actions tab -> "windows shell (dev)" -> Run workflow, pick the
# branch. Or: gh workflow run windows-shell-dev.yml --ref agent/win-shell

name: windows shell (dev)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Synthetic version for the dev build (no leading v)"
        required: false
        default: "0.0.0-dev"

# A second dispatch supersedes an in-flight one for the same branch.
concurrency:
  group: windows-shell-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      # The root mise.toml pins Rust and the broker inherits it; nothing in
      # this job builds Rust through mise, so don't download the toolchain.
      MISE_DISABLE_TOOLS: rust
      MAXIMAL_VERSION: ${{ github.event.inputs.version }}
      MAXIMAL_GIT_SHA: ${{ github.sha }}
      MAXIMAL_GIT_BRANCH: ${{ github.ref_name }}
      MAXIMAL_CHANNEL: dev
      # Force a fresh sidecar compile so version metadata is re-stamped and the
      # up-to-date short-circuit in build-sidecar.ts can't skip the win-x64 build.
      MAXIMAL_FORCE_SIDECAR: "1"
      # Retry crate downloads instead of failing on a transient connection
      # reset (belt-and-suspenders alongside the cargo cache).
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.3

      - uses: ./.github/actions/setup-mise
        with:
          mise-version: v2026.9.5

      # Pinned Rust + the Cargo cache warmed from main by
      # windows-rust-cache.yml (restore only, shared with the release job).
      - name: Set up Rust
        uses: ./.github/actions/setup-rust-windows

      - name: Configure package registry
        shell: bash
        run: printf '%s\n' 'registry=https://packagefeedproxy.microsoft.io/npm/' > "$HOME/.npmrc"

      - name: Install dependencies
        # bash: setup-bun adds a Git-Bash-style PATH ($HOME/.bun/bin) to
        # GITHUB_PATH, which pwsh (the windows-2022 default shell) can't
        # resolve — so every bun step must run under bash.
        shell: bash
        run: bun install --frozen-lockfile

      - name: Install isolated broker dependencies
        shell: bash
        run: |
          mise trust packages/mcp-broker/mise.toml
          mise -C packages/mcp-broker install
          mise -C packages/mcp-broker exec -- pnpm install --frozen-lockfile

      # The embedded settings/dashboard UI lives in shell/ with its own
      # manifest; the root install doesn't cover it. Mirrors the release
      # `binaries` job and the windows-installer-dev workflow. This also
      # pulls in the shell's @tauri-apps/cli for `bun run tauri build`.
      - name: Install shell dependencies
        working-directory: shell
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build web UI + ui-embed manifest
        shell: bash
        run: |
          set -euo pipefail
          bun run build:ui
          bun run scripts/gen-ui-embed.ts

      # Compile both sidecars for win-x64 and place their target-triple inputs
      # under shell/src-tauri/binaries/ for Tauri's externalBin resolver.
      - name: Build win-x64 sidecars (externalBin)
        shell: bash
        run: bun run scripts/build-sidecar.ts --force

      # Tauri requires exact target-triple source names and installs them as
      # unsuffixed siblings in the application directory.
      - name: Verify sidecar placement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'shell/src-tauri/binaries'
          $triple = 'x86_64-pc-windows-msvc'
          foreach ($name in @('maximal', 'maximal-mcp-broker')) {
            $exe = Join-Path $dir "$name-$triple.exe"
            if (-not (Test-Path $exe)) { throw "sidecar not found: $exe" }
            Write-Host "sidecar OK: $exe ($((Get-Item $exe).Length) bytes)"
          }
          Get-ChildItem $dir

      # Compile and exercise the lifecycle code with target_os = "windows",
      # including the synthetic Job Object kill-on-close containment test.
      # --release lets the following Tauri build reuse the compiled graph.
      - name: Test native shell lifecycle (Windows)
        shell: bash
        run: cargo test --release --manifest-path shell/src-tauri/Cargo.toml

      # Build the Tauri app for Windows. The NSIS per-user installer + the
      # raw .exe are produced under shell/src-tauri/target/release/bundle/.
      # build:ui runs again as beforeBuildCommand (cheap, idempotent).
      - name: Tauri build (Windows, NSIS)
        working-directory: shell
        shell: bash
        run: |
          # The UI + ui-embed manifest were already built by the step above.
          # Tauri runs beforeBuildCommand via cmd.exe on Windows, where bun
          # (only on the Git-Bash-style PATH from setup-bun) can't resolve —
          # so override the hook to empty for this CI build to skip the
          # redundant re-run rather than fight bun-under-cmd.
          bun run tauri build --bundles nsis \
            --config '{"build":{"beforeBuildCommand":""}}'

      - name: Locate build outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'shell/src-tauri/target/release'
          $nsis = Get-ChildItem -Path (Join-Path $root 'bundle/nsis') -Filter '*-setup.exe' -ErrorAction SilentlyContinue
          $app = Get-ChildItem -Path $root -Filter 'Maximal.exe' -ErrorAction SilentlyContinue
          if (-not $nsis) {
            Write-Error "NSIS installer not produced under $root/bundle/nsis"
            exit 1
          }
          Write-Host "NSIS installer: $($nsis.FullName) ($($nsis.Length) bytes)"
          if ($app) { Write-Host "App exe: $($app.FullName) ($($app.Length) bytes)" }

      - name: Upload Windows shell artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-shell-dev
          path: |
            shell/src-tauri/target/release/bundle/nsis/*-setup.exe
            shell/src-tauri/target/release/Maximal.exe
          if-no-files-found: error

  # Install + launcher verification — a SEPARATE job so it reuses the
  # already-built NSIS artifact instead of recompiling. Iterating on these
  # assertions costs seconds (download + install), not a full Rust compile;
  # if only this fails, "Re-run failed jobs" reruns just this job.
  verify-install:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-shell-dev
          path: dist

      # Prove the tray app is what a user actually gets: silently install the
      # NSIS package, then assert a "Maximal" Start Menu shortcut lands that
      # targets the app exe inside the install dir — the Windows analog of the
      # macOS .app in /Applications (how a user finds + launches maximal).
      - name: Install NSIS + verify Start Menu launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist -Recurse -Filter '*-setup.exe' | Select-Object -First 1).FullName
          if (-not $setup) { throw "no *-setup.exe in the downloaded artifact" }
          Write-Host "Installing $setup /S ..."
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "NSIS installer timed out"
          }
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "NSIS install failed: $($p.ExitCode)" }
          Start-Sleep -Seconds 3

          # Tauri per-user (currentUser) NSIS installs under %LOCALAPPDATA%\Maximal.
          $installRoot = Join-Path $env:LOCALAPPDATA 'Maximal'
          if (-not (Test-Path $installRoot)) { throw "install dir missing: $installRoot" }
          Get-ChildItem $installRoot | ForEach-Object { Write-Host "  installed: $($_.Name)" }
          foreach ($binary in @('maximal.exe', 'maximal-mcp-broker.exe')) {
            $binaryPath = Join-Path $installRoot $binary
            if (-not (Test-Path $binaryPath)) { throw "$binary missing at $binaryPath" }
          }

          # The launcher is the "Maximal" Start Menu shortcut (per-user
          # Programs), exactly named Maximal.lnk.
          $sm = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $lnk = Get-ChildItem $sm -Recurse -Filter 'Maximal.lnk' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $lnk) { throw "no 'Maximal.lnk' Start Menu shortcut found under $sm" }
          Write-Host "Start Menu shortcut: $($lnk.FullName)"

          # It must target the app binary at the known path. productName is
          # "Maximal" (install dir) but the Tauri/cargo binary is maximal-shell,
          # so the launcher target is %LOCALAPPDATA%\Maximal\maximal-shell.exe.
          $expected = Join-Path $installRoot 'maximal-shell.exe'
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk.FullName).TargetPath
          Write-Host "shortcut target: $target"
          if ($target -ne $expected) {
            throw "Start Menu shortcut should target '$expected', got '$target'"
          }
          if (-not (Test-Path $target)) { throw "shortcut target does not exist on disk: $target" }
          Write-Host "Start Menu launcher OK -> $target"

      - name: Launch installed app and verify sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:LOCALAPPDATA 'Maximal'
          $shellPath = Join-Path $installRoot 'maximal-shell.exe'
          if (-not (Test-Path $shellPath)) { throw "shell missing: $shellPath" }

          Write-Host "launching: $shellPath"
          $shellProcess = Start-Process -FilePath $shellPath -PassThru
          # Cold hosted runners can take more than 30 seconds to initialize the
          # sidecar on first launch (the diagnostics record the exact child PID).
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $sidecarProcess = Get-CimInstance Win32_Process -Filter "Name = 'maximal.exe'" |
              Where-Object { $_.ParentProcessId -eq $shellProcess.Id } |
              Select-Object -First 1
            if (-not $shellProcess.HasExited -and $sidecarProcess) { break }
            Start-Sleep -Milliseconds 500
            $shellProcess.Refresh()
          } while ((Get-Date) -lt $deadline)

          if ($shellProcess.HasExited) { throw "maximal-shell did not stay running" }
          if (-not $sidecarProcess) { throw "maximal sidecar did not start within 60 seconds" }
          Write-Host "shell PID: $($shellProcess.Id); sidecar PID: $($sidecarProcess.ProcessId)"

      # This runs before NSIS's image-wide cleanup can mask the result. Kill only
      # the shell PID, without /T, and require its exact sidecar and listeners to
      # disappear. Then relaunch so the running-uninstaller smoke remains intact.
      - name: Force shell exit and verify sidecar containment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:LOCALAPPDATA 'Maximal'
          $shellPath = Join-Path $installRoot 'maximal-shell.exe'
          $shellProcess = Get-CimInstance Win32_Process -Filter "Name = 'maximal-shell.exe'" |
            Where-Object { $_.ExecutablePath -eq $shellPath } |
            Select-Object -First 1
          if (-not $shellProcess) { throw "installed maximal-shell process not found" }
          $sidecarProcess = Get-CimInstance Win32_Process -Filter "Name = 'maximal.exe'" |
            Where-Object { $_.ParentProcessId -eq $shellProcess.ProcessId } |
            Select-Object -First 1
          if (-not $sidecarProcess) { throw "sidecar child of shell PID $($shellProcess.ProcessId) not found" }

          $shellPid = [int]$shellProcess.ProcessId
          $sidecarPid = [int]$sidecarProcess.ProcessId
          $listenerPorts = @(
            Get-NetTCPConnection -OwningProcess $sidecarPid -State Listen -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty LocalPort -Unique
          )
          [ordered]@{
            shellPid = $shellPid
            sidecarPid = $sidecarPid
            listenerPorts = $listenerPorts
          } | ConvertTo-Json | Set-Content dist/containment-pids.json
          Write-Host "forcing shell PID $shellPid; expecting sidecar PID $sidecarPid to follow"
          Stop-Process -Id $shellPid -Force

          $deadline = (Get-Date).AddSeconds(5)
          do {
            $remainingSidecar = Get-Process -Id $sidecarPid -ErrorAction SilentlyContinue
            $remainingListeners = @(
              Get-NetTCPConnection -OwningProcess $sidecarPid -State Listen -ErrorAction SilentlyContinue
            )
            if (-not $remainingSidecar -and $remainingListeners.Count -eq 0) { break }
            Start-Sleep -Milliseconds 100
          } while ((Get-Date) -lt $deadline)
          if ($remainingSidecar) { throw "sidecar PID $sidecarPid survived forced shell exit" }
          if ($remainingListeners.Count -ne 0) {
            throw "sidecar PID $sidecarPid retained listeners after forced shell exit"
          }
          Write-Host "contained sidecar PID $sidecarPid and its listeners exited"

          $replacementShell = Start-Process -FilePath $shellPath -PassThru
          # Cold hosted runners can take more than 30 seconds to initialize the
          # sidecar on first launch (the diagnostics record the exact child PID).
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $replacementSidecar = Get-CimInstance Win32_Process -Filter "Name = 'maximal.exe'" |
              Where-Object { $_.ParentProcessId -eq $replacementShell.Id } |
              Select-Object -First 1
            if (-not $replacementShell.HasExited -and $replacementSidecar) { break }
            Start-Sleep -Milliseconds 500
            $replacementShell.Refresh()
          } while ((Get-Date) -lt $deadline)
          if ($replacementShell.HasExited) { throw "replacement maximal-shell did not stay running" }
          if (-not $replacementSidecar) { throw "replacement sidecar did not start within 60 seconds" }
          Write-Host "replacement shell PID: $($replacementShell.Id); sidecar PID: $($replacementSidecar.ProcessId)"

      - name: Uninstall NSIS app while Maximal is running
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:LOCALAPPDATA 'Maximal'
          $unins = Get-ChildItem $installRoot -Recurse -Filter 'uninstall.exe' `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $unins) { throw "uninstaller not found under $installRoot" }

          # Do not stop Maximal here. NSIS_HOOK_PREUNINSTALL must stop the open
          # tray shell and its sidecars before Tauri's CheckIfAppIsRunning.
          Write-Host "uninstalling with Maximal still running: $($unins.FullName)"
          # _?= disables NSIS's usual handoff to a temporary copy. Without it,
          # WaitForExit observes only the launcher and can return before the real
          # uninstaller reaches CheckIfAppIsRunning or removes the binaries.
          $p = Start-Process -FilePath $unins.FullName `
            -ArgumentList '/S', "_?=$installRoot" -PassThru
          if (-not $p.WaitForExit(60000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Process -Name 'maximal-shell', 'maximal', 'maximal-mcp-broker' `
              -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            throw "uninstaller timed out with Maximal running"
          }
          if ($p.ExitCode -ne 0) { throw "NSIS uninstall failed: $($p.ExitCode)" }

          $deadline = (Get-Date).AddSeconds(10)
          do {
            $remaining = @(
              Get-Process -Name 'maximal-shell', 'maximal', 'maximal-mcp-broker' `
                -ErrorAction SilentlyContinue
            )
            if ($remaining.Count -eq 0) { break }
            Start-Sleep -Milliseconds 250
          } while ((Get-Date) -lt $deadline)
          if ($remaining.Count -ne 0) {
            $details = ($remaining | ForEach-Object { "$($_.ProcessName):$($_.Id)" }) -join ', '
            throw "Maximal processes remain after uninstall: $details"
          }

          foreach ($binary in @('maximal-shell.exe', 'maximal.exe', 'maximal-mcp-broker.exe')) {
            $binaryPath = Join-Path $installRoot $binary
            if (Test-Path $binaryPath) { throw "$binary still present: $binaryPath" }
          }

          # An in-place NSIS uninstaller cannot remove its own executable.
          Remove-Item $installRoot -Recurse -Force
          if (Test-Path $installRoot) { throw "install root still present: $installRoot" }

      # Capture evidence before the best-effort image-wide cleanup below. This
      # makes packaged lifecycle failures diagnosable without rerunning a build.
      - name: Capture Windows lifecycle diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          Get-CimInstance Win32_Process |
            Select-Object Name, ProcessId, ParentProcessId, ExecutablePath, CommandLine |
            ConvertTo-Json -Depth 3 | Set-Content diagnostics/processes.json
          Get-NetTCPConnection -ErrorAction SilentlyContinue |
            Select-Object State, LocalAddress, LocalPort, RemoteAddress, RemotePort, OwningProcess |
            ConvertTo-Json -Depth 3 | Set-Content diagnostics/tcp-connections.json

          $installRoot = Join-Path $env:LOCALAPPDATA 'Maximal'
          if (Test-Path $installRoot) {
            Get-ChildItem $installRoot -Recurse -Force |
              Select-Object FullName, Length, LastWriteTime |
              ConvertTo-Json -Depth 3 | Set-Content diagnostics/install-tree.json
          }
          $appData = Join-Path $env:APPDATA 'maximal'
          New-Item -ItemType Directory -Force diagnostics/appdata | Out-Null
          foreach ($name in @('session-running', 'maximal.pid')) {
            $source = Join-Path $appData $name
            if (Test-Path $source) {
              Copy-Item $source (Join-Path 'diagnostics/appdata' $name) -Force
            }
          }

      - name: Upload Windows lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-shell-dev-diagnostics
          path: |
            diagnostics/
            dist/containment-pids.json
          if-no-files-found: warn

      - name: Best-effort hosted-runner cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-Process -Name 'maximal-shell', 'maximal', 'maximal-mcp-broker' `
            -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          $installRoot = Join-Path $env:LOCALAPPDATA 'Maximal'
          $unins = Get-ChildItem $installRoot -Recurse -Filter 'uninstall.exe' `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($unins) {
            $cleanup = Start-Process -FilePath $unins.FullName `
              -ArgumentList '/S', "_?=$installRoot" -PassThru
            [void]$cleanup.WaitForExit(30000)
          }
          if (Test-Path $installRoot) {
            Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
