name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  # See ci.yml — required checks must also run on merge_group.
  merge_group:

permissions:
  contents: read

# A new push to a PR supersedes its in-flight run. Every other run gets its
# own group (run_id), so main, merge-group, and dispatched runs never queue
# behind or replace each other.
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # trufflehog needs full history to diff PR commits against
          # base. Shallow checkout would force a full-tree scan and
          # produce noisy results.
          fetch-depth: 0

      - name: Scan with TruffleHog
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          # On PRs, scan only the diff (base..head). On push-to-main,
          # the action defaults to scanning the new commits introduced
          # by the push.
          extra_args: --results=verified,unknown
