# Vendored replacement for jdx/mise-action.
#
# Internal MS GitHub Actions environments reject non-MS/GitHub-sourced
# actions, so install the pinned official mise release here: the platform's
# standalone binary, checked against the release's SHASUMS256.txt.
#
# The download goes through the GitHub API with the job's token. github.com
# throttles anonymous release downloads when it's under load (504s failed
# whole CI runs on 2026-11-08 and 2026-11-09), and authenticated requests
# aren't in that pool. mise.run's installer can't take a token, which is why
# this no longer uses it. An anonymous download stays as the fallback for a
# runner whose token can't read jdx/mise.

name: Setup mise
description: Install mise and add it to PATH

inputs:
  mise-version:
    description: Exact mise release to install.
    required: false
    default: v2026.9.5
  github-token:
    description: Token for downloading the mise release; the job's token is enough.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      env:
        MISE_VERSION: ${{ inputs.mise-version }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        # Windows takes the x64 build on every runner; on Arm it runs under
        # emulation, as it does on an Arm PC.
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) asset="mise-${MISE_VERSION}-linux-x64" ;;
          Linux/ARM64) asset="mise-${MISE_VERSION}-linux-arm64" ;;
          macOS/X64) asset="mise-${MISE_VERSION}-macos-x64" ;;
          macOS/ARM64) asset="mise-${MISE_VERSION}-macos-arm64" ;;
          Windows/*) asset="mise-${MISE_VERSION}-windows-x64.exe" ;;
          *)
            echo "::error::no mise build for $RUNNER_OS/$RUNNER_ARCH"
            exit 1
            ;;
        esac
        target=mise
        if [ "$RUNNER_OS" = Windows ]; then target=mise.exe; fi

        bin="$HOME/.local/bin"
        mkdir -p "$bin"
        cd "$bin"

        fetch_authenticated() {
          command -v gh >/dev/null && [ -n "${GH_TOKEN:-}" ] || return 1
          local attempt
          for attempt in 1 2 3; do
            if gh release download "$MISE_VERSION" --repo jdx/mise --clobber \
              --pattern "$asset" --pattern SHASUMS256.txt; then
              return 0
            fi
            sleep $((attempt * 5))
          done
          return 1
        }
        if ! fetch_authenticated; then
          echo "::warning::authenticated mise download failed; trying anonymously"
          base="https://github.com/jdx/mise/releases/download/${MISE_VERSION}"
          curl -fsSL --retry 3 -o "$asset" "$base/$asset"
          curl -fsSL --retry 3 -o SHASUMS256.txt "$base/SHASUMS256.txt"
        fi

        # Exact name match: a substring would also pick up the -musl and
        # archive variants listed beside it.
        awk -v f="./$asset" '$2 == f { print $1 "  " substr(f, 3) }' SHASUMS256.txt > mise.sha256
        if [ ! -s mise.sha256 ]; then
          echo "::error::$asset is not listed in the release's SHASUMS256.txt"
          exit 1
        fi
        if command -v sha256sum >/dev/null; then
          sha256sum -c mise.sha256
        else
          shasum -a 256 -c mise.sha256
        fi
        rm SHASUMS256.txt mise.sha256
        mv "$asset" "$target"
        chmod +x "$target"
        echo "$bin" >> "$GITHUB_PATH"

    - name: Verify mise
      shell: bash
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        mise --version
